<script>

(function () {

    "use strict";


    /* =========================================
       DATA
    ========================================= */

    const STORAGE_KEY =
        "life_game_v2";


    const defaultData = {

        finance: [

            {
                id: "income",
                icon: "💵",
                name: "Заработано за месяц",
                unit: "₽",
                current: 0,
                target: 100000
            },

            {
                id: "monthlyGoal",
                icon: "🎯",
                name: "Цель на месяц",
                unit: "₽",
                current: 0,
                target: 100000
            },

            {
                id: "yearlyGoal",
                icon: "🏆",
                name: "Цель на год",
                unit: "₽",
                current: 0,
                target: 1200000
            },

            {
                id: "expenses",
                icon: "📉",
                name: "Обязательные расходы",
                unit: "₽",
                current: 0,
                target: 50000
            },

            {
                id: "safety",
                icon: "🛡️",
                name: "Подушка безопасности",
                unit: "₽",
                current: 0,
                target: 300000
            }

        ],


        health: [

            {
                id: "routine",
                icon: "⏰",
                name: "Режим дня",
                unit: "%",
                current: 0,
                target: 100
            },

            {
                id: "nutrition",
                icon: "🍎",
                name: "Питание с КБЖУ",
                unit: "%",
                current: 0,
                target: 100
            },

            {
                id: "workouts",
                icon: "🏋️",
                name: "Программа тренировок",
                unit: "тренировок",
                current: 0,
                target: 12
            },

            {
                id: "steps",
                icon: "🚶",
                name: "Шаги в день",
                unit: "шагов",
                current: 0,
                target: 10000
            }

        ],


        development: [

            {
                id: "books",
                icon: "📚",
                name: "Чтение книг",
                unit: "книг",
                current: 0,
                target: 2
            },

            {
                id: "language",
                icon: "🌐",
                name: "Изучение языка",
                unit: "минут",
                current: 0,
                target: 30
            },

            {
                id: "meditation",
                icon: "🧘",
                name: "Медитация",
                unit: "минут",
                current: 0,
                target: 15
            }

        ]

    };


    let data =
        loadData();


    /* =========================================
       STORAGE
    ========================================= */

    function loadData() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (saved) {

                const parsed =
                    JSON.parse(saved);

                return mergeData(parsed);

            }

        } catch (error) {

            console.error(
                "Storage error:",
                error
            );

        }

        return clone(defaultData);

    }


    function clone(object) {

        return JSON.parse(
            JSON.stringify(object)
        );

    }


    function mergeData(saved) {

        const result =
            clone(defaultData);


        Object.keys(result).forEach(
            function (category) {

                if (
                    Array.isArray(
                        saved[category]
                    )
                ) {

                    saved[category].forEach(
                        function(savedItem) {

                            const item =
                                result[category].find(
                                    function(element) {

                                        return (
                                            element.id ===
                                            savedItem.id
                                        );

                                    }
                                );


                            if (item) {

                                item.current =
                                    Number(
                                        savedItem.current
                                    ) || 0;

                                item.target =
                                    Number(
                                        savedItem.target
                                    ) || 0;

                            }

                        }
                    );

                }

            }
        );


        return result;

    }


    function saveData() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );

        } catch (error) {

            console.error(
                "Cannot save data:",
                error
            );

        }

    }


    /* =========================================
       CALCULATIONS
    ========================================= */

    function progress(
        current,
        target
    ) {

        const c =
            Number(current) || 0;

        const t =
            Number(target) || 0;


        if (t <= 0) {

            return 0;

        }


        return Math.min(
            100,
            Math.max(
                0,
                Math.round(
                    c / t * 100
                )
            )
        );

    }


    function categoryProgress(
        category
    ) {

        const items =
            data[category];


        if (!items || !items.length) {

            return 0;

        }


        const total =
            items.reduce(
                function(sum, item) {

                    return (
                        sum +
                        progress(
                            item.current,
                            item.target
                        )
                    );

                },
                0
            );


        return Math.round(
            total / items.length
        );

    }


    function totalProgress() {

        return Math.round(

            (
                categoryProgress(
                    "finance"
                ) +

                categoryProgress(
                    "health"
                ) +

                categoryProgress(
                    "development"
                )

            ) / 3

        );

    }


    function formatNumber(
        value
    ) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(
            Number(value) || 0
        );

    }


    /* =========================================
       HOME
    ========================================= */

    function updateHome() {

        const total =
            totalProgress();


        const overallValue =
            document.querySelector(
                ".overall-value"
            );


        const overallFill =
            document.querySelector(
                ".overall-fill"
            );


        if (overallValue) {

            overallValue.innerHTML =
                total +
                "<span>%</span>";

        }


        if (overallFill) {

            overallFill.style.width =
                total + "%";

        }


        document
            .querySelectorAll(
                ".category-card"
            )
            .forEach(
                function(card) {

                    const category =
                        card.dataset.category;


                    const value =
                        categoryProgress(
                            category
                        );


                    const percent =
                        card.querySelector(
                            ".category-percent"
                        );


                    const fill =
                        card.querySelector(
                            ".progress-fill"
                        );


                    if (percent) {

                        percent.textContent =
                            value + "%";

                    }


                    if (fill) {

                        fill.style.width =
                            value + "%";

                    }

                }
            );

    }


    /* =========================================
       NAVIGATION
    ========================================= */

    function setupNavigation() {

        const buttons =
            document.querySelectorAll(
                ".nav-item"
            );


        buttons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();
                        event.stopPropagation();


                        const section =
                            this.dataset.section;


                        setActiveNav(
                            section
                        );


                        if (
                            section ===
                            "home"
                        ) {

                            closeCategory();

                        } else {

                            openCategory(
                                section
                            );

                        }

                    }
                );

            }
        );


        document
            .querySelectorAll(
                ".category-card"
            )
            .forEach(
                function(card) {

                    card.addEventListener(
                        "click",
                        function() {

                            openCategory(
                                this.dataset.category
                            );

                        }
                    );

                }
            );

    }


    function setActiveNav(
        section
    ) {

        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(
                function(button) {

                    button.classList.toggle(
                        "active",
                        button.dataset.section ===
                        section
                    );

                }
            );

    }


    /* =========================================
       CATEGORY
    ========================================= */

    function openCategory(
        category
    ) {

        closeCategory();


        const titles = {

            finance:
                "💰 Финансы",

            health:
                "❤️ Здоровье",

            development:
                "🧠 Развитие"

        };


        const page =
            document.createElement(
                "div"
            );


        page.className =
            "category-page";


        const percent =
            categoryProgress(
                category
            );


        page.innerHTML = `

            <div class="category-page-header">

                <button
                    class="back-button"
                    type="button"
                >
                    ←
                </button>

                <div>

                    <div class="page-eyebrow">
                        LIFE GAME
                    </div>

                    <h2>
                        ${titles[category]}
                    </h2>

                </div>

            </div>


            <div class="category-summary">

                <div class="section-label">
                    CATEGORY PROGRESS
                </div>

                <div class="summary-value">
                    ${percent}%
                </div>

                <div class="summary-bar">

                    <div
                        class="summary-fill"
                        style="width:${percent}%"
                    ></div>

                </div>

            </div>


            <div class="metrics-list">

                ${data[category]
                    .map(
                        function(item) {

                            const p =
                                progress(
                                    item.current,
                                    item.target
                                );


                            return `

                                <div
                                    class="metric-card"
                                    data-id="${item.id}"
                                >

                                    <div class="metric-top">

                                        <div class="metric-title">

                                            <div class="metric-icon">
                                                ${item.icon}
                                            </div>

                                            <div>

                                                <strong>
                                                    ${item.name}
                                                </strong>

                                                <span>
                                                    ${formatNumber(
                                                        item.current
                                                    )}
                                                    ${item.unit}
                                                    /
                                                    ${formatNumber(
                                                        item.target
                                                    )}
                                                    ${item.unit}
                                                </span>

                                            </div>

                                        </div>

                                        <div class="metric-percent">
                                            ${p}%
                                        </div>

                                    </div>


                                    <div class="metric-progress">

                                        <div
                                            class="metric-progress-fill"
                                            style="width:${p}%"
                                        ></div>

                                    </div>


                                    <button
                                        class="metric-edit"
                                        type="button"
                                        data-edit="${item.id}"
                                    >
                                        ✎ ИЗМЕНИТЬ
                                    </button>

                                </div>

                            `;

                        }
                    )
                    .join("")}

            </div>

        `;


        document.body.appendChild(
            page
        );


        page
            .querySelector(
                ".back-button"
            )
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();

                    closeCategory();

                    updateHome();

                    setActiveNav(
                        "home"
                    );

                }
            );


        page
            .querySelectorAll(
                ".metric-edit"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            openEditor(
                                category,
                                this.dataset.edit
                            );

                        }
                    );

                }
            );

    }


    function closeCategory() {

        const page =
            document.querySelector(
                ".category-page"
            );


        if (page) {

            page.remove();

        }

    }


    /* =========================================
       EDITOR
    ========================================= */

    function openEditor(
        category,
        id
    ) {

        const item =
            data[category].find(
                function(element) {

                    return (
                        element.id === id
                    );

                }
            );


        if (!item) {

            return;

        }


        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "editor-overlay";


        overlay.innerHTML = `

            <div class="editor">

                <button
                    class="editor-close"
                    type="button"
                >
                    ×
                </button>


                <div class="editor-icon">
                    ${item.icon}
                </div>


                <div class="editor-eyebrow">
                    EDIT GOAL
                </div>


                <h3>
                    ${item.name}
                </h3>


                <label>
                    Текущее значение
                </label>

                <input
                    class="current-input"
                    type="number"
                    inputmode="decimal"
                    value="${item.current}"
                >


                <label>
                    Цель
                </label>

                <input
                    class="target-input"
                    type="number"
                    inputmode="decimal"
                    value="${item.target}"
                >


                <div class="editor-preview">

                    <span>
                        ПРОГРЕСС
                    </span>

                    <strong
                        class="editor-progress"
                    >
                        ${progress(
                            item.current,
                            item.target
                        )}%
                    </strong>

                </div>


                <button
                    class="save-button"
                    type="button"
                >
                    СОХРАНИТЬ
                </button>

            </div>

        `;


        document.body.appendChild(
            overlay
        );


        const currentInput =
            overlay.querySelector(
                ".current-input"
            );


        const targetInput =
            overlay.querySelector(
                ".target-input"
            );


        const preview =
            overlay.querySelector(
                ".editor-progress"
            );


        function updatePreview() {

            preview.textContent =
                progress(
                    currentInput.value,
                    targetInput.value
                ) + "%";

        }


        currentInput.addEventListener(
            "input",
            updatePreview
        );


        targetInput.addEventListener(
            "input",
            updatePreview
        );


        overlay
            .querySelector(
                ".editor-close"
            )
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();

                    overlay.remove();

                }
            );


        overlay
            .querySelector(
                ".save-button"
            )
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();


                    item.current =
                        Number(
                            currentInput.value
                        ) || 0;


                    item.target =
                        Number(
                            targetInput.value
                        ) || 0;


                    saveData();


                    overlay.remove();


                    openCategory(
                        category
                    );


                    updateHome();

                }
            );


        overlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            }
        );

    }


    /* =========================================
       DAILY QUEST
    ========================================= */

    function setupQuest() {

        const button =
            document.getElementById(
                "dailyQuest"
            );


        if (!button) {

            return;

        }


        button.addEventListener(
            "click",
            function(event) {

                event.preventDefault();
                event.stopPropagation();


                const overlay =
                    document.createElement(
                        "div"
                    );


                overlay.className =
                    "editor-overlay";


                overlay.innerHTML = `

                    <div class="editor quest-message">

                        <button
                            class="editor-close"
                            type="button"
                        >
                            ×
                        </button>

                        <div class="editor-icon">
                            ⚡
                        </div>

                        <div class="editor-eyebrow">
                            DAILY QUEST
                        </div>

                        <h3>
                            Новый день
                        </h3>

                        <p>
                            Здесь появятся ежедневные
                            задания, которые будут
                            приносить тебе XP.
                        </p>

                        <button
                            class="save-button"
                            type="button"
                        >
                            ПОНЯТНО
                        </button>

                    </div>

                `;


                document.body.appendChild(
                    overlay
                );


                overlay
                    .querySelector(
                        ".editor-close"
                    )
                    .addEventListener(
                        "click",
                        function() {

                            overlay.remove();

                        }
                    );


                overlay
                    .querySelector(
                        ".save-button"
                    )
                    .addEventListener(
                        "click",
                        function() {

                            overlay.remove();

                        }
                    );

            }
        );

    }


    /* =========================================
       START APPLICATION
    ========================================= */

    function startApp() {

        setupNavigation();

        setupQuest();

        updateHome();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startApp
        );

    } else {

        startApp();

    }

})();

</script>

</body>
</html>
