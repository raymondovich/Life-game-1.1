
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Life Game</title>


    <style>

        /* =========================================
           LIFE GAME — PREMIUM BLACK
        ========================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        :root {

            --bg: #050505;
            --bg-soft: #090909;

            --card: #101010;
            --card-light: #151515;

            --border: #242424;
            --border-light: #303030;

            --text: #f5f5f5;
            --text-soft: #a0a0a0;
            --text-muted: #626262;

            --white: #ffffff;

            --radius-large: 24px;
            --radius-medium: 18px;

        }


        html {

            margin: 0;
            padding: 0;

            min-height: 100%;

            background: var(--bg);

        }


        body {

            margin: 0;
            padding: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #050505 45%,
                    #030303 100%
                );

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Inter",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;

            overflow-x: hidden;

        }


        body.page-open {
            overflow: hidden;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            border: 0;
            cursor: pointer;
        }


        /* =========================================
           APP
        ========================================= */

        .app {

            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            margin: 0 auto;

            padding:
                24px
                18px
                120px;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 28px;

        }


        .eyebrow {

            margin-bottom: 5px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        .header h1 {

            margin: 0;

            color: var(--text);

            font-size: 27px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.2px;

        }


        .avatar {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #2a2a2a;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #292929,
                    #0b0b0b
                );

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 12px 30px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);

        }


        /* =========================================
           LEVEL
        ========================================= */

        .level-card {

            position: relative;

            margin-bottom: 30px;

            padding: 21px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-large);

            background:
                linear-gradient(
                    145deg,
                    #151515 0%,
                    #0d0d0d 55%,
                    #090909 100%
                );

            box-shadow:
                0 24px 60px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.035);

        }


        .level-top {

            position: relative;

            display: flex;

            align-items: flex-end;
            justify-content: space-between;

            z-index: 1;

        }


        .label {

            display: block;

            margin-bottom: 5px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 2px;

        }


        .level-number {

            color: var(--text);

            font-size: 26px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -1px;

        }


        .xp-value {

            color: #8b8b8b;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.5px;

        }


        .xp-bar {

            position: relative;

            width: 100%;
            height: 4px;

            margin-top: 19px;

            overflow: hidden;

            border-radius: 20px;

            background: #252525;

        }


        .xp-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #ffffff
                );

            transition:
                width 0.8s cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================
           OVERALL
        ========================================= */

        .overall-section {
            margin-bottom: 25px;
        }


        .section-label {

            margin-bottom: 3px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 2.5px;

        }


        .overall-value {

            margin-bottom: 12px;

            color: var(--text);

            font-size: 58px;
            line-height: 0.95;

            font-weight: 800;

            letter-spacing: -4px;

        }


        .overall-value span {

            margin-left: 2px;

            color: #777777;

            font-size: 27px;

            letter-spacing: -1px;

        }


        .overall-bar {

            width: 100%;
            height: 3px;

            overflow: hidden;

            border-radius: 20px;

            background: #1c1c1c;

        }


        .overall-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background: #eeeeee;

            box-shadow:
                0 0 10px rgba(255,255,255,0.18);

            transition:
                width 0.8s cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================
           CATEGORIES
        ========================================= */

        .categories {

            display: flex;

            flex-direction: column;

            gap: 13px;

        }


        .category-card {

            position: relative;

            padding: 20px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-large);

            background:
                linear-gradient(
                    145deg,
                    #121212,
                    #0b0b0b
                );

            cursor: pointer;

            box-shadow:
                0 16px 40px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.025);

            transition:
                transform 0.18s ease,
                border-color 0.18s ease;

        }


        .category-card:active {

            transform: scale(0.985);

            border-color: #3a3a3a;

        }


        .category-header {

            position: relative;

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;

            z-index: 1;

        }


        .category-title {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .category-icon {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #282828;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #111111
                );

            font-size: 19px;

        }


        .category-name strong {

            display: block;

            color: #eeeeee;

            font-size: 13px;
            line-height: 1;

            font-weight: 750;

            letter-spacing: 1.1px;

        }


        .category-name span {

            display: block;

            margin-top: 6px;

            color: var(--text-muted);

            font-size: 10px;

            font-weight: 500;

        }


        .category-percent {

            color: #eeeeee;

            font-size: 20px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.7px;

        }


        .progress-bar {

            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 20px;

            background: #222222;

        }


        .progress-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #f5f5f5
                );

            transition:
                width 0.8s cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================
           DAILY QUEST
        ========================================= */

        .quest-button {

            width: 100%;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-top: 20px;

            border: 1px solid #303030;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #eeeeee,
                    #bdbdbd
                );

            color: #080808;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2px;

            box-shadow:
                0 18px 40px rgba(0,0,0,0.35);

        }


        .quest-icon {

            margin-right: 8px;

            font-size: 19px;

        }


        /* =========================================
           BOTTOM NAV
        ========================================= */

        .bottom-nav {

            position: fixed;

            left: 50%;
            bottom: 12px;

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 484px;

            height: 69px;

            display: flex;

            align-items: center;
            justify-content: space-around;

            padding: 5px 7px;

            z-index: 100;

            border: 1px solid #242424;

            border-radius: 23px;

            background:
                rgba(14,14,14,0.92);

            backdrop-filter: blur(24px);

            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.65);

        }


        .nav-item {

            min-width: 65px;
            height: 56px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            border-radius: 17px;

            background: transparent;

            color: #555555;

        }


        .nav-item.active {

            color: #ffffff;

            background:
                rgba(255,255,255,0.055);

        }


        .nav-icon {

            font-size: 17px;

            line-height: 1;

        }


        .nav-label {

            font-size: 8px;

            font-weight: 500;

        }


        /* =========================================
           CATEGORY PAGE
        ========================================= */

        .category-page {

            position: fixed;

            inset: 0;

            z-index: 200;

            overflow-y: auto;

            padding:
                24px
                18px
                120px;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #050505 60%,
                    #030303 100%
                );

            animation:
                pageIn 0.25s ease;

        }


        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .category-page-header {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 24px;

        }


        .back-button {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #292929;

            border-radius: 14px;

            background: #111111;

            color: #ffffff;

            font-size: 20px;

        }


        .page-eyebrow {

            margin-bottom: 5px;

            color: #5f5f5f;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 2.5px;

        }


        .category-page h2 {

            margin: 0;

            color: #f5f5f5;

            font-size: 25px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.8px;

        }


        .category-summary {

            margin-bottom: 18px;

            padding: 22px;

            border: 1px solid #242424;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0c0c0c
                );

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

        }


        .summary-value {

            margin-bottom: 15px;

            color: #f5f5f5;

            font-size: 46px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -3px;

        }


        .summary-bar {

            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 20px;

            background: #222222;

        }


        .summary-fill {

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #ffffff
                );

            transition:
                width 0.5s ease;

        }


        /* =========================================
           METRICS
        ========================================= */

        .metrics-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .metric-card {

            padding: 18px;

            border: 1px solid #222222;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #121212,
                    #0a0a0a
                );

            box-shadow:
                0 14px 35px rgba(0,0,0,0.22);

        }


        .metric-top {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 15px;

        }


        .metric-title {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .metric-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #292929;

            border-radius: 13px;

            background: #171717;

            font-size: 18px;

        }


        .metric-title strong {

            display: block;

            color: #eeeeee;

            font-size: 12px;

            line-height: 1.2;

            font-weight: 700;

        }


        .metric-title span {

            display: block;

            margin-top: 5px;

            color: #666666;

            font-size: 9px;

            line-height: 1.2;

        }


        .metric-percent {

            color: #eeeeee;

            font-size: 19px;

            font-weight: 800;

            white-space: nowrap;

        }


        .metric-progress {

            width: 100%;
            height: 3px;

            margin-bottom: 15px;

            overflow: hidden;

            border-radius: 20px;

            background: #202020;

        }


        .metric-progress-fill {

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #666666,
                    #eeeeee
                );

            transition:
                width 0.5s ease;

        }


        .metric-edit {

            width: 100%;
            height: 38px;

            border: 1px solid #292929;

            border-radius: 12px;

            background: #111111;

            color: #8c8c8c;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        /* =========================================
           EXPENSES SUBBLOCK
        ========================================= */

        .expenses-subblock {

            margin-top: 15px;

            padding-top: 16px;

            border-top: 1px solid #222222;

        }


        .expenses-subblock-header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 12px;

        }


        .expenses-subblock-title {

            color: #777777;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.8px;

            text-transform: uppercase;

        }


        .expenses-subblock-total {

            color: #eeeeee;

            font-size: 12px;

            font-weight: 800;

        }


        .expense-list {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .expense-row {

            min-height: 48px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding:
                8px
                10px
                8px
                12px;

            border: 1px solid #1f1f1f;

            border-radius: 13px;

            background: #0c0c0c;

        }


        .expense-row-info {

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;

        }


        .expense-row-name {

            overflow: hidden;

            color: #dcdcdc;

            font-size: 11px;

            font-weight: 600;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .expense-row-amount {

            color: #888888;

            font-size: 10px;

            font-weight: 700;

        }


        .expense-row-actions {

            display: flex;

            align-items: center;

            gap: 5px;

            flex-shrink: 0;

        }


        .expense-action {

            width: 31px;
            height: 31px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #262626;

            border-radius: 9px;

            background: #141414;

            color: #777777;

            font-size: 14px;

        }


        .expense-action.delete {

            color: #666666;

        }


        .expense-empty {

            padding: 16px 10px;

            border: 1px dashed #292929;

            border-radius: 13px;

            color: #555555;

            font-size: 10px;

            line-height: 1.5;

            text-align: center;

        }


        .add-expense-button {

            width: 100%;
            height: 42px;

            margin-top: 10px;

            border: 1px solid #292929;

            border-radius: 12px;

            background: #111111;

            color: #999999;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.4px;

        }


        .expenses-ratio {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 10px;

            padding: 11px 12px;

            border-radius: 12px;

            background: #141414;

        }


        .expenses-ratio span {

            color: #666666;

            font-size: 9px;

            font-weight: 600;

        }


        .expenses-ratio strong {

            color: #eeeeee;

            font-size: 12px;

            font-weight: 800;

        }


        /* =========================================
           EXPENSES PAGE
        ========================================= */

        .expenses-page .category-summary {

            margin-bottom: 14px;

        }


        .expenses-income-info {

            margin-top: 11px;

            color: #666666;

            font-size: 10px;

            font-weight: 600;

        }


        /* =========================================
           EDITOR
        ========================================= */

        .editor-overlay {

            position: fixed;

            inset: 0;

            z-index: 500;

            display: flex;

            align-items: flex-end;
            justify-content: center;

            padding: 14px;

            background:
                rgba(0,0,0,0.72);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            animation:
                overlayIn 0.2s ease;

        }


        @keyframes overlayIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        .editor {

            position: relative;

            width: 100%;
            max-width: 500px;

            padding: 26px 20px 22px;

            border: 1px solid #292929;

            border-radius: 26px 26px 20px 20px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #0b0b0b
                );

            box-shadow:
                0 -10px 60px rgba(0,0,0,0.55);

            animation:
                editorIn 0.25s cubic-bezier(.2,.8,.2,1);

        }


        @keyframes editorIn {

            from {
                transform: translateY(30px);
            }

            to {
                transform: translateY(0);
            }

        }


        .editor-close {

            position: absolute;

            top: 15px;
            right: 15px;

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #292929;

            border-radius: 50%;

            background: #111111;

            color: #777777;

            font-size: 20px;

        }


        .editor-icon {

            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            border: 1px solid #2a2a2a;

            border-radius: 15px;

            background: #191919;

            font-size: 21px;

        }


        .editor-eyebrow {

            margin-bottom: 5px;

            color: #606060;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        .editor h3 {

            margin: 0 0 23px;

            padding-right: 40px;

            color: #f3f3f3;

            font-size: 21px;

            line-height: 1.1;

            font-weight: 800;

        }


        .editor label {

            display: block;

            margin-bottom: 7px;

            color: #777777;

            font-size: 9px;

            font-weight: 600;

        }


        .editor input {

            width: 100%;
            height: 50px;

            margin-bottom: 15px;

            padding:
                0
                15px;

            border: 1px solid #292929;

            border-radius: 14px;

            outline: none;

            background: #0d0d0d;

            color: #f5f5f5;

            font-family: inherit;

            font-size: 16px;

            font-weight: 600;

            -webkit-appearance: none;

        }


        .editor input:focus {

            border-color: #555555;

            background: #111111;

        }


        .editor-preview {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 4px 0 17px;

            padding: 14px;

            border: 1px solid #242424;

            border-radius: 14px;

            background: #0d0d0d;

        }


        .editor-preview span {

            color: #666666;

            font-size: 9px;

            font-weight: 600;

        }


        .editor-preview strong {

            color: #eeeeee;

            font-size: 16px;

            font-weight: 800;

        }


        .save-button {

            width: 100%;
            height: 52px;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    #f1f1f1,
                    #bdbdbd
                );

            color: #080808;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;

        }


        /* =========================================
           TOAST
        ========================================= */

        .life-message {

            position: fixed;

            left: 50%;
            bottom: 96px;

            z-index: 1000;

            transform:
                translate(-50%, 10px);

            padding:
                12px 18px;

            border: 1px solid #303030;

            border-radius: 14px;

            background:
                rgba(20,20,20,0.95);

            color: #ffffff;

            font-size: 11px;

            font-weight: 600;

            white-space: nowrap;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.5);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

        }


        .life-message.show {

            opacity: 1;

<script>

(function () {

    "use strict";


    /* =========================================
       STORAGE
    ========================================= */

    const STORAGE_KEY =
        "life_game_v2";


    const EXPENSES_KEY =
        "life_game_expenses_v1";


    /* =========================================
       DEFAULT DATA
    ========================================= */

    const defaultData = {

        finance: [

            {
                id: "income",
                icon: "💵",
                name: "Заработано за месяц",
                unit: "₽",
                current: 0,
                target: 100000
            },

            {
                id: "monthlyGoal",
                icon: "🎯",
                name: "Цель на месяц",
                unit: "₽",
                current: 0,
                target: 100000
            },

            {
                id: "yearlyGoal",
                icon: "🏆",
                name: "Цель на год",
                unit: "₽",
                current: 0,
                target: 1200000
            },

            {
                id: "expenses",
                icon: "📉",
                name: "Обязательные расходы",
                unit: "₽",
                current: 0,
                target: 0
            },

            {
                id: "safety",
                icon: "🛡️",
                name: "Подушка безопасности",
                unit: "₽",
                current: 0,
                target: 300000
            }

        ],


        health: [

            {
                id: "routine",
                icon: "⏰",
                name: "Режим дня",
                unit: "%",
                current: 0,
                target: 100
            },

            {
                id: "nutrition",
                icon: "🍎",
                name: "Питание с КБЖУ",
                unit: "%",
                current: 0,
                target: 100
            },

            {
                id: "workouts",
                icon: "🏋️",
                name: "Программа тренировок",
                unit: "тренировок",
                current: 0,
                target: 12
            },

            {
                id: "steps",
                icon: "🚶",
                name: "Шаги в день",
                unit: "шагов",
                current: 0,
                target: 10000
            }

        ],


        development: [

            {
                id: "books",
                icon: "📚",
                name: "Чтение книг",
                unit: "книг",
                current: 0,
                target: 2
            },

            {
                id: "language",
                icon: "🌐",
                name: "Изучение языка",
                unit: "минут",
                current: 0,
                target: 30
            },

            {
                id: "meditation",
                icon: "🧘",
                name: "Медитация",
                unit: "минут",
                current: 0,
                target: 15
            }

        ]

    };


    let data =
        loadData();


    let expenses =
        loadExpenses();


    /* =========================================
       CLONE
    ========================================= */

    function clone(object) {

        return JSON.parse(
            JSON.stringify(object)
        );

    }


    /* =========================================
       LOAD DATA
    ========================================= */

    function loadData() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (saved) {

                const parsed =
                    JSON.parse(saved);


                return mergeData(parsed);

            }

        } catch (error) {

            console.error(
                "LIFE GAME storage error:",
                error
            );

        }


        return clone(defaultData);

    }


    /* =========================================
       MERGE DATA
    ========================================= */

    function mergeData(saved) {

        const result =
            clone(defaultData);


        Object.keys(result).forEach(
            function(category) {

                if (
                    Array.isArray(
                        saved[category]
                    )
                ) {

                    saved[category].forEach(
                        function(savedItem) {

                            const item =
                                result[category].find(
                                    function(element) {

                                        return (
                                            element.id ===
                                            savedItem.id
                                        );

                                    }
                                );


                            if (item) {

                                item.current =
                                    Number(
                                        savedItem.current
                                    ) || 0;


                                item.target =
                                    Number(
                                        savedItem.target
                                    ) || 0;

                            }

                        }
                    );

                }

            }
        );


        return result;

    }


    /* =========================================
       SAVE DATA
    ========================================= */

    function saveData() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );

        } catch (error) {

            console.error(
                "Cannot save data:",
                error
            );

        }

    }


    /* =========================================
       LOAD EXPENSES
    ========================================= */

    function loadExpenses() {

        try {

            const saved =
                localStorage.getItem(
                    EXPENSES_KEY
                );


            if (saved) {

                const parsed =
                    JSON.parse(saved);


                if (Array.isArray(parsed)) {

                    return parsed.map(
                        function(expense) {

                            return {

                                id:
                                    String(
                                        expense.id ||
                                        Date.now()
                                    ),

                                name:
                                    String(
                                        expense.name ||
                                        ""
                                    ),

                                amount:
                                    Number(
                                        expense.amount
                                    ) || 0

                            };

                        }
                    );

                }

            }

        } catch (error) {

            console.error(
                "Expenses storage error:",
                error
            );

        }


        return [];

    }


    /* =========================================
       SAVE EXPENSES
    ========================================= */

    function saveExpenses() {

        try {

            localStorage.setItem(
                EXPENSES_KEY,
                JSON.stringify(expenses)
            );

        } catch (error) {

            console.error(
                "Cannot save expenses:",
                error
            );

        }

    }


    /* =========================================
       CALCULATIONS
    ========================================= */

    function progress(
        current,
        target
    ) {

        const c =
            Number(current) || 0;

        const t =
            Number(target) || 0;


        if (t <= 0) {

            return 0;

        }


        return Math.min(
            100,
            Math.max(
                0,
                Math.round(
                    c / t * 100
                )
            )
        );

    }


    function getIncome() {

        const item =
            data.finance.find(
                function(element) {

                    return element.id === "income";

                }
            );


        return Number(
            item?.current
        ) || 0;

    }


    function getExpensesTotal() {

        return expenses.reduce(
            function(total, expense) {

                return (
                    total +
                    (
                        Number(
                            expense.amount
                        ) || 0
                    )
                );

            },
            0
        );

    }


    function getExpensesPercent() {

        const income =
            getIncome();


        const total =
            getExpensesTotal();


        if (income <= 0) {

            return 0;

        }


        return Math.round(
            total / income * 100
        );

    }


    /* =========================================
       CATEGORY PROGRESS
    ========================================= */

    function categoryProgress(
        category
    ) {

        const items =
            data[category];


        if (!items || !items.length) {

            return 0;

        }


        /*
         * Обязательные расходы НЕ являются
         * целью. Они не должны увеличивать
         * прогресс просто за счёт большой суммы.
         */

        const progressItems =
            items.filter(
                function(item) {

                    return item.id !== "expenses";

                }
            );


        if (!progressItems.length) {

            return 0;

        }


        const total =
            progressItems.reduce(
                function(sum, item) {

                    return (
                        sum +
                        progress(
                            item.current,
                            item.target
                        )
                    );

                },
                0
            );


        return Math.round(
            total / progressItems.length
        );

    }


    function totalProgress() {

        return Math.round(

            (
                categoryProgress("finance") +
                categoryProgress("health") +
                categoryProgress("development")

            ) / 3

        );

    }


    function formatNumber(value) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(
            Number(value) || 0
        );

    }


    /* =========================================
       ESCAPE
    ========================================= */

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       UPDATE EXPENSE METRIC
    ========================================= */

    function updateExpenseMetric() {

        const metric =
            data.finance.find(
                function(item) {

                    return item.id === "expenses";

                }
            );


        if (!metric) {

            return;

        }


        metric.current =
            getExpensesTotal();


        /*
         * target больше не используется
         * для расчёта обязательных расходов.
         */

        metric.target = 0;


        saveData();

    }


    /* =========================================
       HOME
    ========================================= */

    function updateHome() {

        const total =
            totalProgress();


        const overallValue =
            document.querySelector(
                ".overall-value"
            );


        const overallFill =
            document.querySelector(
                ".overall-fill"
            );


        if (overallValue) {

            overallValue.innerHTML =
                total +
                "<span>%</span>";

        }


        if (overallFill) {

            overallFill.style.width =
                total + "%";

        }


        document
            .querySelectorAll(
                ".category-card"
            )
            .forEach(
                function(card) {

                    const category =
                        card.dataset.category;


                    const value =
                        categoryProgress(
                            category
                        );


                    const percent =
                        card.querySelector(
                            ".category-percent"
                        );


                    const fill =
                        card.querySelector(
                            ".progress-fill"
                        );


                    if (percent) {

                        percent.textContent =
                            value + "%";

                    }


                    if (fill) {

                        fill.style.width =
                            value + "%";

                    }

                }
            );

    }


    /* =========================================
       NAVIGATION
    ========================================= */

    function setupNavigation() {

        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            const section =
                                this.dataset.section;


                            setActiveNav(
                                section
                            );


                            if (
                                section ===
                                "home"
                            ) {

                                closeCategory();

                                updateHome();

                            } else {

                                openCategory(
                                    section
                                );

                            }

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                ".category-card"
            )
            .forEach(
                function(card) {

                    card.addEventListener(
                        "click",
                        function() {

                            openCategory(
                                this.dataset.category
                            );

                        }
                    );

                }
            );

    }


    function setActiveNav(
        section
    ) {

        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(
                function(button) {

                    button.classList.toggle(
                        "active",
                        button.dataset.section ===
                        section
                    );

                }
            );

    }


    /* =========================================
       CATEGORY PAGE
    ========================================= */

    function openCategory(
        category
    ) {

        if (!data[category]) {

            return;

        }


        closeCategory();


        const titles = {

            finance:
                "💰 Финансы",

            health:
                "❤️ Здоровье",

            development:
                "🧠 Развитие"

        };


        const page =
            document.createElement(
                "div"
            );


        page.className =
            "category-page";


        if (category === "finance") {

            page.innerHTML =
                renderFinancePage();

        } else {

            const percent =
                categoryProgress(
                    category
                );


            page.innerHTML = `

                <div class="category-page-header">

                    <button
                        class="back-button"
                        type="button"
                    >
                        ←
                    </button>

                    <div>

                        <div class="page-eyebrow">
                            LIFE GAME
                        </div>

                        <h2>
                            ${titles[category]}
                        </h2>

                    </div>

                </div>


                <div class="category-summary">

                    <div class="section-label">
                        CATEGORY PROGRESS
                    </div>

                    <div class="summary-value">
                        ${percent}%
                    </div>

                    <div class="summary-bar">

                        <div
                            class="summary-fill"
                            style="width:${percent}%"
                        ></div>

                    </div>

                </div>


                <div class="metrics-list">

                    ${data[category]
                        .map(
                            function(item) {

                                return renderMetric(
                                    item,
                                    category
                                );

                            }
                        )
                        .join("")}

                </div>

            `;

        }


        document.body.appendChild(
            page
        );


        document.body.classList.add(
            "page-open"
        );


        bindCategoryPage(
            page,
            category
        );

    }


    /* =========================================
       FINANCE PAGE
    ========================================= */

    function renderFinancePage() {

        const percent =
            categoryProgress(
                "finance"
            );


        const income =
            getIncome();


        const totalExpenses =
            getExpensesTotal();


        const expensesPercent =
            getExpensesPercent();


        const regularMetrics =
            data.finance.filter(
                function(item) {

                    return item.id !== "expenses";

                }
            );


        const expensesMetric =
            data.finance.find(
                function(item) {

                    return item.id === "expenses";

                }
            );


        return `

            <div class="category-page-header">

                <button
                    class="back-button"
                    type="button"
                >
                    ←
                </button>

                <div>

                    <div class="page-eyebrow">
                        LIFE GAME
                    </div>

                    <h2>
                        💰 Финансы
                    </h2>

                </div>

            </div>


            <div class="category-summary">

                <div class="section-label">
                    CATEGORY PROGRESS
                </div>

                <div class="summary-value">
                    ${percent}%
                </div>

                <div class="summary-bar">

                    <div
                        class="summary-fill"
                        style="width:${percent}%"
                    ></div>

                </div>

            </div>


            <div class="metrics-list">


                ${regularMetrics
                    .map(
                        function(item) {

                            return renderMetric(
                                item,
                                "finance"
                            );

                        }
                    )
                    .join("")}


                <!-- =================================
                     MANDATORY EXPENSES
                ================================== -->

                <div
                    class="metric-card"
                    data-id="expenses"
                >

                    <div class="metric-top">

                        <div class="metric-title">

                            <div class="metric-icon">
                                ${expensesMetric.icon}
                            </div>

                            <div>

                                <strong>
                                    Обязательные расходы
                                </strong>

                                <span>
                                    ${formatNumber(totalExpenses)}
                                    ₽
                                    ·
                                    ${expensesPercent}%
                                    от заработанного
                                </span>

                            </div>

                        </div>


                        <div class="metric-percent">
                            ${expensesPercent}%
                        </div>

                    </div>


                    <div class="metric-progress">

                        <div
                            class="metric-progress-fill"
                            style="width:${Math.min(
                                expensesPercent,
                                100
                            )}%"
                        ></div>

                    </div>


                    <!-- MY EXPENSES -->

                    <div class="expenses-subblock">

                        <div class="expenses-subblock-header">

                            <div class="expenses-subblock-title">
                                МОИ ОБЯЗАТЕЛЬНЫЕ РАСХОДЫ
                            </div>

                            <div class="expenses-subblock-total">
                                ${formatNumber(totalExpenses)} ₽
                            </div>

                        </div>


                        <div class="expense-list">

                            ${
                                expenses.length
                                    ? expenses
                                        .map(
                                            expenseHTML
                                        )
                                        .join("")
                                    : `
                                        <div class="expense-empty">
                                            Добавь свои обязательные расходы.
                                            Например: аренда, коммунальные,
                                            связь, транспорт или продукты.
                                        </div>
                                    `
                            }

                        </div>


                        <button
                            class="add-expense-button"
                            type="button"
                        >
                            ＋ ДОБАВИТЬ РАСХОД
                        </button>


                        <div class="expenses-ratio">

                            <span>
                                ОТ ЗАРАБОТАННОГО ЗА МЕСЯЦ
                            </span>

                            <strong>
                                ${expensesPercent}%
                            </strong>

                        </div>

                    </div>

                </div>


            </div>

        `;

    }


    /* =========================================
       METRIC
    ========================================= */

    function renderMetric(
        item,
        category
    ) {

        const p =
            progress(
                item.current,
                item.target
            );


        return `

            <div
                class="metric-card"
                data-id="${item.id}"
            >

                <div class="metric-top">

                    <div class="metric-title">

                        <div class="metric-icon">
                            ${item.icon}
                        </div>

                        <div>

                            <strong>
                                ${escapeHTML(item.name)}
                            </strong>

                            <span>
                                ${formatNumber(item.current)}
                                ${item.unit}
                                /
                                ${formatNumber(item.target)}
                                ${item.unit}
                            </span>

                        </div>

                    </div>


                    <div class="metric-percent">
                        ${p}%
                    </div>

                </div>


                <div class="metric-progress">

                    <div
                        class="metric-progress-fill"
                        style="width:${p}%"
                    ></div>

                </div>


                <button
                    class="metric-edit"
                    type="button"
                    data-edit="${item.id}"
                >
                    ✎ ИЗМЕНИТЬ
                </button>

            </div>

        `;

    }


    /* =========================================
       EXPENSE HTML
    ========================================= */

    function expenseHTML(
        expense
    ) {

        return `

            <div class="expense-row">

                <div class="expense-row-info">

                    <div class="expense-row-name">
                        ${escapeHTML(
                            expense.name
                        )}
                    </div>

                    <div class="expense-row-amount">
                        ${formatNumber(
                            expense.amount
                        )} ₽
                    </div>

                </div>


                <div class="expense-row-actions">

                    <button
                        class="expense-action expense-edit"
                        type="button"
                        data-expense="${expense.id}"
                        aria-label="Изменить"
                    >
                        ✎
                    </button>


                    <button
                        class="expense-action delete expense-delete"
                        type="button"
                        data-expense="${expense.id}"
                        aria-label="Удалить"
                    >
                        ×
                    </button>

                </div>

            </div>

        `;

    }


    /* =========================================
       CATEGORY PAGE EVENTS
    ========================================= */

    function bindCategoryPage(
        page,
        category
    ) {

        const backButton =
            page.querySelector(
                ".back-button"
            );


        if (backButton) {

            backButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();


                    closeCategory();

                    updateHome();

                    setActiveNav(
                        "home"
                    );

                }
            );

        }


        /*
         * Финансы
         */

        if (category === "finance") {

            const addButton =
                page.querySelector(
                    ".add-expense-button"
                );


            if (addButton) {

                addButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();
                        event.stopPropagation();

                        openExpenseEditor();

                    }
                );

            }


            page
                .querySelectorAll(
                    ".expense-edit"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            function(event) {

                                event.preventDefault();
                                event.stopPropagation();


                                openExpenseEditor(
                                    this.dataset.expense
                                );

                            }
                        );

                    }
                );


            page
                .querySelectorAll(
                    ".expense-delete"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            function(event) {

                                event.preventDefault();
                                event.stopPropagation();


                                deleteExpense(
                                    this.dataset.expense
                                );

                            }
                        );

                    }
                );

        }


        /*
         * Обычные метрики
         */

        page
            .querySelectorAll(
                ".metric-edit"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            openEditor(
                                category,
                                this.dataset.edit
                            );

                        }
                    );

                }
            );

    }


    /* =========================================
       EXPENSE EDITOR
    ========================================= */

    function openExpenseEditor(
        expenseId = null
    ) {

        const expense =
            expenses.find(
                function(item) {

                    return (
                        String(item.id) ===
                        String(expenseId)
                    );

                }
            );


        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "editor-overlay";


        overlay.innerHTML = `

            <div class="editor">

                <button
                    class="editor-close"
                    type="button"
                >
                    ×
                </button>


                <div class="editor-icon">
                    📉
                </div>


                <div class="editor-eyebrow">
                    ${
                        expense
                            ? "EDIT EXPENSE"
                            : "NEW EXPENSE"
                    }
                </div>


                <h3>
                    ${
                        expense
                            ? "Изменить расход"
                            : "Добавить расход"
                    }
                </h3>


                <label>
                    Название расхода
                </label>


                <input
                    class="expense-name-input"
                    type="text"
                    inputmode="text"
                    maxlength="60"
                    placeholder="Например: Аренда"
                    value="${
                        expense
                            ? escapeHTML(
                                expense.name
                            )
                            : ""
                    }"
                >


                <label>
                    Сумма
                </label>


                <input
                    class="expense-amount-input"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="1"
                    placeholder="0"
                    value="${
                        expense
                            ? expense.amount
                            : ""
                    }"
                >


                <button
                    class="save-button"
                    type="button"
                >
                    СОХРАНИТЬ
                </button>

            </div>

        `;


        document.body.appendChild(
            overlay
        );


        const nameInput =
            overlay.querySelector(
                ".expense-name-input"
            );


        const amountInput =
            overlay.querySelector(
                ".expense-amount-input"
            );


        overlay
            .querySelector(
                ".editor-close"
            )
            .addEventListener(
                "click",
                function() {

                    overlay.remove();

                }
            );


        overlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            }
        );


        overlay
            .querySelector(
                ".save-button"
            )
            .addEventListener(
                "click",
                function() {

                    const name =
                        nameInput.value.trim();


                    const amount =
                        Number(
                            amountInput.value
                        ) || 0;


                    if (!name) {

                        showToast(
                            "Введите название расхода"
                        );

                        nameInput.focus();

                        return;

                    }


                    if (amount <= 0) {

                        showToast(
                            "Введите сумму расхода"
                        );

                        amountInput.focus();

                        return;

                    }


                    if (expense) {

                        expense.name =
                            name;


                        expense.amount =
                            amount;

                    } else {

                        expenses.push({

                            id:
                                Date.now()
                                .toString(),

                            name:
                                name,

                            amount:
                                amount

                        });

                    }


                    saveExpenses();

                    updateExpenseMetric();

                    overlay.remove();


                    const currentPage =
                        document.querySelector(
                            ".category-page"
                        );


                    if (currentPage) {

                        openCategory(
                            "finance"
                        );

                    }


                    updateHome();


                    showToast(
                        "Расход сохранён"
                    );

                }
            );

    }


    /* =========================================
       DELETE EXPENSE
    ========================================= */

    function deleteExpense(
        expenseId
    ) {

        const expense =
            expenses.find(
                function(item) {

                    return (
                        String(item.id) ===
                        String(expenseId)
                    );

                }
            );


        if (!expense) {

            return;

        }


        expenses =
            expenses.filter(
                function(item) {

                    return (
                        String(item.id) !==
                        String(expenseId)
                    );

                }
            );


        saveExpenses();

        updateExpenseMetric();


        openCategory(
            "finance"
        );


        updateHome();


        showToast(
            "Расход удалён"
        );

    }


    /* =========================================
       STANDARD EDITOR
    ========================================= */

    function openEditor(
        category,
        id
    ) {

        const item =
            data[category].find(
                function(element) {

                    return element.id === id;

                }
            );


        if (!item) {

            return;

        }


        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "editor-overlay";


        overlay.innerHTML = `

            <div class="editor">

                <button
                    class="editor-close"
                    type="button"
                >
                    ×
                </button>


                <div class="editor-icon">
                    ${item.icon}
                </div>


                <div class="editor-eyebrow">
                    EDIT GOAL
                </div>


                <h3>
                    ${escapeHTML(item.name)}
                </h3>


                <label>
                    Текущее значение
                </label>


                <input
                    class="current-input"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    value="${item.current}"
                >


                <label>
                    Цель
                </label>


                <input
                    class="target-input"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    value="${item.target}"
                >


                <div class="editor-preview">

                    <span>
                        ПРОГРЕСС
                    </span>

                    <strong
                        class="editor-progress"
                    >
                        ${progress(
                            item.current,
                            item.target
                        )}%
                    </strong>

                </div>


                <button
                    class="save-button"
                    type="button"
                >
                    СОХРАНИТЬ
                </button>

            </div>

        `;


        document.body.appendChild(
            overlay
        );


        const currentInput =
            overlay.querySelector(
                ".current-input"
            );


        const targetInput =
            overlay.querySelector(
                ".target-input"
            );


        const preview =
            overlay.querySelector(
                ".editor-progress"
            );


        function updatePreview() {

            preview.textContent =
                progress(
                    currentInput.value,
                    targetInput.value
                ) + "%";

        }


        currentInput.addEventListener(
            "input",
            updatePreview
        );


        targetInput.addEventListener(
            "input",
            updatePreview
        );


        overlay
            .querySelector(
                ".editor-close"
            )
            .addEventListener(
                "click",
                function() {

                    overlay.remove();

                }
            );


        overlay
            .querySelector(
                ".save-button"
            )
            .addEventListener(
                "click",
                function() {

                    item.current =
                        Math.max(
                            0,
                            Number(
                                currentInput.value
                            ) || 0
                        );


                    item.target =
                        Math.max(
                            0,
                            Number(
                                targetInput.value
                            ) || 0
                        );


                    saveData();


                    overlay.remove();


                    openCategory(
                        category
                    );


                    updateHome();


                    showToast(
                        "Изменения сохранены"
                    );

                }
            );


        overlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            }
        );

    }


    /* =========================================
       CLOSE CATEGORY
    ========================================= */

    function closeCategory() {

        const page =
            document.querySelector(
                ".category-page"
            );


        if (page) {

            page.remove();

        }


        document.body.classList.remove(
            "page-open"
        );

    }


    /* =========================================
       TOAST
    ========================================= */

    function showToast(
        message
    ) {

        const old =
            document.querySelector(
                ".life-message"
            );


        if (old) {

            old.remove();

        }


        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            "life-message";


        toast.textContent =
            message;


        document.body.appendChild(
            toast
        );


        requestAnimationFrame(
            function() {

                toast.classList.add(
                    "show"
                );

            }
        );


        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );


                setTimeout(
                    function() {

                        toast.remove();

                    },
                    250
                );

            },
            1800
        );

    }


    /* =========================================
       DAILY QUEST
    ========================================= */

    function setupQuest() {

        const button =
            document.getElementById(
                "dailyQuest"
            );


        if (!button) {

            return;

        }


        button.addEventListener(
            "click",
            function(event) {

                event.preventDefault();
                event.stopPropagation();


                const overlay =
                    document.createElement(
                        "div"
                    );


                overlay.className =
                    "editor-overlay";


                overlay.innerHTML = `

                    <div class="editor">

                        <button
                            class="editor-close"
                            type="button"
                        >
                            ×
                        </button>


                        <div class="editor-icon">
                            ⚡
                        </div>


                        <div class="editor-eyebrow">
                            DAILY QUEST
                        </div>


                        <h3>
                            Новый день
                        </h3>


                        <p
                            style="
                                color:#777;
                                font-size:13px;
                                line-height:1.5;
                                margin:0 0 20px;
                            "
                        >
                            Здесь появятся ежедневные
                            задания, которые будут
                            приносить тебе XP.
                        </p>


                        <button
                            class="save-button"
                            type="button"
                        >
                            ПОНЯТНО
                        </button>

                    </div>

                `;


                document.body.appendChild(
                    overlay
                );


                overlay
                    .querySelector(
                        ".editor-close"
                    )
                    .addEventListener(
                        "click",
                        function() {

                            overlay.remove();

                        }
                    );


                overlay
                    .querySelector(
                        ".save-button"
                    )
                    .addEventListener(
                        "click",
                        function() {

                            overlay.remove();

                        }
                    );


                overlay.addEventListener(
                    "click",
                    function(event) {

                        if (
                            event.target ===
                            overlay
                        ) {

                            overlay.remove();

                        }

                    }
                );

            }
        );

    }


    /* =========================================
       START
    ========================================= */

    function startApp() {

        /*
         * Синхронизируем старое значение
         * обязательных расходов с новым
         * списком пользовательских расходов.
         */

        updateExpenseMetric();


        setupNavigation();

        setupQuest();

        updateHome();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startApp
        );

    } else {

        startApp();

    }


})();

</script>


</body>

</html>
