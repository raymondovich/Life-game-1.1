<!DOCTYPE html>

<html lang="ru">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<meta
    name="theme-color"
    content="#050505"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<title>LIFE GAME</title>


<link
    rel="stylesheet"
    href="./style.css"
>
```

</head>

<body>

```
<!-- =====================================================
     MAIN APPLICATION
====================================================== -->

<div class="app">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div>

            <div class="eyebrow">
                YOUR LIFE
            </div>

            <h1>
                LIFE GAME
            </h1>

        </div>


        <div class="avatar">
            B
        </div>

    </header>


    <!-- =================================================
         PLAYER
    ================================================== -->

    <section class="hero">

        <div class="hero-top">

            <div>

                <span class="label">
                    PLAYER LEVEL
                </span>

                <div
                    class="level"
                    id="playerLevel"
                >
                    LVL 1
                </div>

            </div>


            <div
                class="xp"
                id="playerXP"
            >
                0 XP
            </div>

        </div>


        <div class="bar">

            <div
                class="fill"
                id="playerXPFill"
                style="width:0%"
            ></div>

        </div>


        <div class="hero-bottom">

            <span id="xpNext">
                100 XP TO NEXT LEVEL
            </span>

            <span id="playerRank">
                BEGINNER
            </span>

        </div>

    </section>


    <!-- =================================================
         LIFE PROGRESS
    ================================================== -->

    <section class="life">

        <div class="section-label">
            LIFE PROGRESS
        </div>


        <div
            class="life-number"
            id="lifeProgress"
        >
            0<span>%</span>
        </div>


        <div class="life-bar">

            <div
                class="fill"
                id="lifeFill"
                style="width:0%"
            ></div>

        </div>

    </section>


    <!-- =================================================
         CATEGORIES
    ================================================== -->

    <main class="categories">


        <!-- FINANCE -->

        <article
            class="category"
            data-category="finance"
        >

            <div class="category-head">

                <div class="category-title">

                    <div class="icon">
                        💰
                    </div>

                    <div class="category-name">

                        <strong>
                            FINANCE
                        </strong>

                        <span>
                            Финансы
                        </span>

                    </div>

                </div>


                <div
                    class="percent"
                    id="financePercent"
                >
                    0%
                </div>

            </div>


            <div class="progress">

                <i
                    id="financeFill"
                    style="width:0%"
                ></i>

            </div>

        </article>


        <!-- DEVELOPMENT -->

        <article
            class="category"
            data-category="development"
        >

            <div class="category-head">

                <div class="category-title">

                    <div class="icon">
                        🧠
                    </div>

                    <div class="category-name">

                        <strong>
                            DEVELOPMENT
                        </strong>

                        <span>
                            Развитие
                        </span>

                    </div>

                </div>


                <div
                    class="percent"
                    id="developmentPercent"
                >
                    0%
                </div>

            </div>


            <div class="progress">

                <i
                    id="developmentFill"
                    style="width:0%"
                ></i>

            </div>

        </article>


        <!-- HEALTH -->

        <article
            class="category"
            data-category="health"
        >

            <div class="category-head">

                <div class="category-title">

                    <div class="icon">
                        ❤️
                    </div>

                    <div class="category-name">

                        <strong>
                            HEALTH
                        </strong>

                        <span>
                            Здоровье · Тренировки
                        </span>

                    </div>

                </div>


                <div
                    class="percent"
                    id="healthPercent"
                >
                    0%
                </div>

            </div>


            <div class="progress">

                <i
                    id="healthFill"
                    style="width:0%"
                ></i>

            </div>

        </article>


    </main>


    <!-- =================================================
         DAILY QUEST
    ================================================== -->

    <button
        class="quest"
        id="dailyQuest"
        type="button"
    >
        ⚡ DAILY QUEST
    </button>


    <!-- =================================================
         CREATOR
    ================================================== -->

    <a
        class="creator"
        href="https://t.me/shkeltinsh"
        target="_blank"
        rel="noopener noreferrer"
    >
        Created by
        <strong>
            &nbsp;@shkeltinsh
        </strong>
    </a>


</div>


<!-- =====================================================
     BOTTOM NAVIGATION
====================================================== -->

<nav class="nav">


    <button
        type="button"
        class="active"
        data-nav="home"
    >

        <span class="nav-icon">
            ⌂
        </span>

        <span class="nav-label">
            Главная
        </span>

    </button>


    <button
        type="button"
        data-nav="finance"
    >

        <span class="nav-icon">
            💰
        </span>

        <span class="nav-label">
            Финансы
        </span>

    </button>


    <button
        type="button"
        data-nav="health"
    >

        <span class="nav-icon">
            ❤️
        </span>

        <span class="nav-label">
            Здоровье
        </span>

    </button>


    <button
        type="button"
        data-nav="development"
    >

        <span class="nav-icon">
            🧠
        </span>

        <span class="nav-label">
            Развитие
        </span>

    </button>


</nav>


<!-- =====================================================
     TOAST
====================================================== -->

<div
    class="toast"
    id="toast"
></div>


<!-- =====================================================
     MODULES
     
     ВАЖНО:
     finance.js использует import.
     Поэтому он подключается как module.

     health.js и development.js используют
     window.LifeGameHealth / window.LifeGameDevelopment
     и подключаются обычным script.
====================================================== -->


<script
    src="./js/sections/health.js"
></script>


<script
    src="./js/sections/development.js"
></script>


<script
    type="module"
    src="./js/sections/finance.js"
></script>


<!-- =====================================================
     MAIN APPLICATION
====================================================== -->

<script
    type="module"
    src="./js/app.js"
></script>
```

</body>

</html>
