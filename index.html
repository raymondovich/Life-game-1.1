<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Life Game</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        :root {
            --bg: #050505;
            --card: #101010;
            --border: #242424;

            --text: #f5f5f5;
            --muted: #666666;

            --white: #ffffff;

            --radius-large: 24px;
        }


        html {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background: var(--bg);
        }


        body {
            margin: 0;
            padding: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(255,255,255,.07),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #050505 50%,
                    #030303 100%
                );

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Inter",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;
        }


        body.page-open {
            overflow: hidden;
        }


        button,
        input {
            font: inherit;
        }


        button {
            border: 0;
            cursor: pointer;
        }


        /* =========================================
           APP
        ========================================= */

        .app {
            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            margin: 0 auto;

            padding:
                24px
                18px
                120px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 28px;
        }


        .eyebrow,
        .label,
        .section-label,
        .page-eyebrow,
        .editor-eyebrow {
            color: #626262;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 2.5px;

            text-transform: uppercase;
        }


        .eyebrow {
            margin-bottom: 5px;
        }


        .header h1 {
            margin: 0;

            color: #f5f5f5;

            font-size: 27px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.2px;
        }


        .avatar {
            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #2a2a2a;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #292929,
                    #0b0b0b
                );

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 12px 30px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.08);
        }


        /* =========================================
           LEVEL CARD
        ========================================= */

        .level-card {
            position: relative;

            margin-bottom: 30px;

            padding: 21px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-large);

            background:
                linear-gradient(
                    145deg,
                    #151515 0%,
                    #0d0d0d 55%,
                    #090909 100%
                );

            box-shadow:
                0 24px 60px rgba(0,0,0,.38),
                inset 0 1px 0 rgba(255,255,255,.035);
        }


        .level-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -130px;
            right: -80px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.035);

            filter: blur(20px);
        }


        .level-top {
            position: relative;

            display: flex;

            align-items: flex-end;
            justify-content: space-between;

            z-index: 1;
        }


        .label {
            display: block;

            margin-bottom: 5px;

            font-size: 9px;
        }


        .level-number {
            color: #f5f5f5;

            font-size: 26px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -1px;
        }


        .xp-value {
            color: #8b8b8b;

            font-size: 11px;
            font-weight: 600;
        }


        .xp-bar {
            position: relative;

            width: 100%;
            height: 5px;

            margin-top: 19px;

            overflow: hidden;

            border-radius: 20px;

            background: #252525;
        }


        .xp-fill {
            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #ffffff
                );

            box-shadow:
                0 0 12px rgba(255,255,255,.25);

            transition:
                width .8s cubic-bezier(.2,.8,.2,1);
        }


        /* =========================================
           OVERALL
        ========================================= */

        .overall-section {
            margin-bottom: 25px;
        }


        .section-label {
            margin-bottom: 4px;
        }


        .overall-value {
            margin-bottom: 12px;

            color: #f5f5f5;

            font-size: 58px;
            line-height: .95;

            font-weight: 800;

            letter-spacing: -4px;
        }


        .overall-value span {
            margin-left: 2px;

            color: #777777;

            font-size: 27px;

            letter-spacing: -1px;
        }


        .overall-bar {
            width: 100%;
            height: 3px;

            overflow: hidden;

            border-radius: 20px;

            background: #1c1c1c;
        }


        .overall-fill {
            width: 0%;

            height: 100%;

            border-radius: inherit;

            background: #eeeeee;

            box-shadow:
                0 0 10px rgba(255,255,255,.18);

            transition:
                width .8s cubic-bezier(.2,.8,.2,1);
        }


        /* =========================================
           CATEGORIES
        ========================================= */

        .categories {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .category-card {
            position: relative;

            padding: 20px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-large);

            background:
                linear-gradient(
                    145deg,
                    #121212,
                    #0b0b0b
                );

            box-shadow:
                0 16px 40px rgba(0,0,0,.22),
                inset 0 1px 0 rgba(255,255,255,.025);

            transition:
                transform .18s ease,
                border-color .18s ease;
        }


        .category-card:active {
            transform: scale(.985);

            border-color: #3a3a3a;
        }


        .category-header {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }


        .category-title {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .category-icon {
            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #282828;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #111111
                );

            font-size: 19px;
        }


        .category-name strong {
            display: block;

            color: #eeeeee;

            font-size: 13px;
            line-height: 1;

            font-weight: 750;

            letter-spacing: 1.1px;
        }


        .category-name span {
            display: block;

            margin-top: 6px;

            color: #626262;

            font-size: 10px;
        }


        .category-percent {
            color: #eeeeee;

            font-size: 20px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -.7px;
        }


        .progress-bar {
            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 20px;

            background: #222222;
        }


        .progress-fill {
            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #f5f5f5
                );

            box-shadow:
                0 0 12px rgba(255,255,255,.15);

            transition:
                width .8s cubic-bezier(.2,.8,.2,1);
        }


        /* =========================================
           DAILY QUEST
        ========================================= */

        .quest-button {
            width: 100%;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-top: 20px;

            border: 1px solid #303030;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #eeeeee,
                    #bdbdbd
                );

            color: #080808;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2px;

            box-shadow:
                0 18px 40px rgba(0,0,0,.35);
        }


        .quest-icon {
            margin-right: 8px;

            font-size: 19px;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .bottom-nav {
            position: fixed;

            left: 50%;
            bottom: 12px;

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 484px;

            height: 69px;

            display: flex;

            align-items: center;
            justify-content: space-around;

            padding: 5px 7px;

            z-index: 100;

            border: 1px solid #242424;

            border-radius: 23px;

            background:
                rgba(14,14,14,.92);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 20px 50px rgba(0,0,0,.65);
        }


        .nav-item {
            min-width: 65px;
            height: 56px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            border-radius: 17px;

            background: transparent;

            color: #555555;
        }


        .nav-item.active {
            color: #ffffff;

            background:
                rgba(255,255,255,.055);
        }


        .nav-icon {
            font-size: 17px;
        }


        .nav-label {
            font-size: 8px;

            font-weight: 500;
        }


        /* =========================================
           CATEGORY PAGE
        ========================================= */

        .category-page {
            position: fixed;

            inset: 0;

            z-index: 200;

            overflow-y: auto;

            padding:
                24px
                18px
                120px;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,.07),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #050505 60%,
                    #030303 100%
                );

            animation:
                pageIn .25s ease;
        }


        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .category-page-header {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 24px;
        }


        .back-button {
            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #292929;

            border-radius: 14px;

            background: #111111;

            color: #ffffff;

            font-size: 20px;
        }


        .page-eyebrow {
            margin-bottom: 5px;
        }


        .category-page h2 {
            margin: 0;

            color: #f5f5f5;

            font-size: 25px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -.8px;
        }


        .category-summary {
            margin-bottom: 18px;

            padding: 22px;

            border: 1px solid #242424;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0c0c0c
                );

            box-shadow:
                0 20px 50px rgba(0,0,0,.35);
        }


        .summary-value {
            margin: 5px 0 15px;

            color: #f5f5f5;

            font-size: 46px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -3px;
        }


        .summary-bar {
            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 20px;

            background: #222222;
        }


        .summary-fill {
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #ffffff
                );

            transition:
                width .5s ease;
        }


        /* =========================================
           METRICS
        ========================================= */

        .metrics-list {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .metric-card {
            padding: 18px;

            border: 1px solid #222222;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #121212,
                    #0a0a0a
                );

            box-shadow:
                0 14px 35px rgba(0,0,0,.22);
        }


        .metric-top {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 15px;
        }


        .metric-title {
            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .metric-icon {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #292929;

            border-radius: 13px;

            background: #171717;

            font-size: 18px;
        }


        .metric-title strong {
            display: block;

            color: #eeeeee;

            font-size: 12px;

            line-height: 1.2;

            font-weight: 700;
        }


        .metric-title span {
            display: block;

            margin-top: 5px;

            color: #666666;

            font-size: 9px;
        }


        .metric-percent {
            color: #eeeeee;

            font-size: 19px;

            font-weight: 800;

            white-space: nowrap;
        }


        .metric-progress {
            width: 100%;
            height: 3px;

            margin-bottom: 15px;

            overflow: hidden;

            border-radius: 20px;

            background: #202020;
        }


        .metric-progress-fill {
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #666666,
                    #eeeeee
                );

            transition:
                width .5s ease;
        }


        .metric-edit {
            width: 100%;
            height: 38px;

            border: 1px solid #292929;

            border-radius: 12px;

            background: #111111;

            color: #8c8c8c;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;
        }


        /* =========================================
           EDITOR
        ========================================= */

        .editor-overlay {
            position: fixed;

            inset: 0;

            z-index: 500;

            display: flex;

            align-items: flex-end;
            justify-content: center;

            padding: 14px;

            background:
                rgba(0,0,0,.72);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            animation:
                overlayIn .2s ease;
        }


        @keyframes overlayIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        .editor {
            position: relative;

            width: 100%;
            max-width: 500px;

            padding: 26px 20px 22px;

            border: 1px solid #292929;

            border-radius: 26px 26px 20px 20px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #0b0b0b
                );

            box-shadow:
                0 -10px 60px rgba(0,0,0,.55);

            animation:
                editorIn .25s cubic-bezier(.2,.8,.2,1);
        }


        @keyframes editorIn {

            from {
                transform: translateY(30px);
            }

            to {
                transform: translateY(0);
            }

        }


        .editor-close {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 34px;
            height: 34px;

            border: 1px solid #292929;

            border-radius: 50%;

            background: #111111;

            color: #777777;

            font-size: 20px;
        }


        .editor-icon {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            border: 1px solid #2a2a2a;

            border-radius: 15px;

            background: #191919;

            font-size: 21px;
        }


        .editor-eyebrow {
            margin-bottom: 5px;
        }


        .editor h3 {
            margin: 0 0 23px;

            padding-right: 40px;

            color: #f3f3f3;

            font-size: 21px;

            line-height: 1.1;

            font-weight: 800;
        }


        .editor label {
            display: block;

            margin-bottom: 7px;

            color: #777777;

            font-size: 9px;

            font-weight: 600;
        }


        .editor input {
            width: 100%;
            height: 50px;

            margin-bottom: 15px;

            padding:
                0
                15px;

            border: 1px solid #292929;

            border-radius: 14px;

            outline: none;

            background: #0d0d0d;

            color: #f5f5f5;

            font-size: 16px;

            font-weight: 600;
        }


        .editor input:focus {
            border-color: #555555;

            background: #111111;
        }


        .editor-preview {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 4px 0 17px;

            padding: 14px;

            border: 1px solid #242424;

            border-radius: 14px;

            background: #0d0d0d;
        }


        .editor-preview span {
            color: #666666;

            font-size: 9px;

            font-weight: 600;
        }


        .editor-preview strong {
            color: #eeeeee;

            font-size: 16px;

            font-weight: 800;
        }


        .save-button {
            width: 100%;
            height: 52px;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    #f1f1f1,
                    #bdbdbd
                );

            color: #080808;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;
        }


        /* =========================================
           TOAST
        ========================================= */

        .life-message {
            position: fixed;

            left: 50%;
            bottom: 96px;

            z-index: 1000;

            transform:
                translate(-50%, 10px);

            padding:
                12px 18px;

            border: 1px solid #303030;

            border-radius: 14px;

            background:
                rgba(20,20,20,.96);

            color: #ffffff;

            font-size: 11px;

            font-weight: 600;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .2s ease,
                transform .2s ease;
        }


        .life-message.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* =========================================
           LEVEL UP
        ========================================= */

        .level-up {
            text-align: center;
        }


        .level-up .editor-icon {
            margin-left: auto;
            margin-right: auto;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #999999
                );

            color: #050505;

            font-size: 24px;
        }


        .level-up h3 {
            margin-bottom: 10px;
        }


        .level-up p {
            margin: 0 0 20px;

            color: #777777;

            font-size: 13px;

            line-height: 1.5;
        }


        .new-level {
            display: block;

            margin-top: 7px;

            color: #ffffff;

            font-size: 38px;

            font-weight: 900;

            letter-spacing: -2px;
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 360px) {

            .app {
                padding-left: 14px;
                padding-right: 14px;
            }


            .header h1 {
                font-size: 24px;
            }


            .overall-value {
                font-size: 51px;
            }


            .category-card {
                padding: 17px;
            }


            .category-icon {
                width: 40px;
                height: 40px;
            }


            .category-name strong {
                font-size: 12px;
            }


            .category-percent {
                font-size: 18px;
            }


            .category-page {
                padding-left: 14px;
                padding-right: 14px;
            }


            .category-page h2 {
                font-size: 22px;
            }


            .metric-card {
                padding: 16px;
            }

        }


        @media (min-width: 700px) {

            .app {
                padding-top: 45px;
            }


            .category-page {
                padding-top: 45px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div>

            <div class="eyebrow">
                YOUR LIFE
            </div>

            <h1>
                LIFE GAME
            </h1>

        </div>


        <div class="avatar">
            B
        </div>

    </header>


    <!-- LEVEL -->

    <section class="level-card">

        <div class="level-top">

            <div>

                <span class="label">
                    CURRENT LEVEL
                </span>

                <div
                    class="level-number"
                    id="levelNumber"
                >
                    LVL 1
                </div>

            </div>


            <div
                class="xp-value"
                id="xpValue"
            >
                0 / 100 XP
            </div>

        </div>


        <div class="xp-bar">

            <div
                class="xp-fill"
                id="xpFill"
            ></div>

        </div>

    </section>


    <!-- LIFE PROGRESS -->

    <section class="overall-section">

        <div class="section-label">
            LIFE PROGRESS
        </div>


        <div
            class="overall-value"
            id="overallValue"
        >
            0<span>%</span>
        </div>


        <div class="overall-bar">

            <div
                class="overall-fill"
                id="overallFill"
            ></div>

        </div>

    </section>


    <!-- CATEGORIES -->

    <main class="categories">


        <article
            class="category-card"
            data-category="finance"
        >

            <div class="category-header">

                <div class="category-title">

                    <div class="category-icon">
                        💰
                    </div>

                    <div class="category-name">

                        <strong>
                            FINANCE
                        </strong>

                        <span>
                            Финансы
                        </span>

                    </div>

                </div>


                <div class="category-percent">
                    0%
                </div>

            </div>


            <div class="progress-bar">

                <div class="progress-fill"></div>

            </div>

        </article>


        <article
            class="category-card"
            data-category="health"
        >

            <div class="category-header">

                <div class="category-title">

                    <div class="category-icon">
                        ❤️
                    </div>

                    <div class="category-name">

                        <strong>
                            HEALTH
                        </strong>

                        <span>
                            Здоровье
                        </span>

                    </div>

    /* =========================================
       HELPERS
    ========================================= */

    function clone(object) {

        return JSON.parse(
            JSON.stringify(object)
        );

    }


    function progress(
        current,
        target
    ) {

        const c =
            Number(current) || 0;

        const t =
            Number(target) || 0;


        if (t <= 0) {
            return 0;
        }


        return Math.min(
            100,
            Math.max(
                0,
                Math.round(
                    c / t * 100
                )
            )
        );

    }


    function formatNumber(value) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(
            Number(value) || 0
        );

    }


    /* =========================================
       CATEGORY PROGRESS
    ========================================= */

    function categoryProgress(
        category
    ) {

        const items =
            data[category];


        if (
            !items ||
            !items.length
        ) {
            return 0;
        }


        const total =
            items.reduce(
                function(sum, item) {

                    return (
                        sum +
                        progress(
                            item.current,
                            item.target
                        )
                    );

                },
                0
            );


        return Math.round(
            total / items.length
        );

    }


    function totalProgress() {

        return Math.round(

            (
                categoryProgress("finance") +
                categoryProgress("health") +
                categoryProgress("development")

            ) / 3

        );

    }


    /* =========================================
       LEVEL SYSTEM
    ========================================= */

    function xpRequiredForLevel(
        level
    ) {

        if (level <= 1) {
            return 0;
        }


        /*
            Level 2 = 100
            Level 3 = 250
            Level 4 = 450
            Level 5 = 700
            etc.
        */

        let total = 0;


        for (
            let i = 1;
            i < level;
            i++
        ) {

            total +=
                100 +
                ((i - 1) * 50);

        }


        return total;

    }


    function getLevelFromXP(
        xp
    ) {

        let level = 1;


        while (
            xp >=
            xpRequiredForLevel(
                level + 1
            )
        ) {

            level++;

        }


        return level;

    }


    function getLevelStartXP(
        level
    ) {

        return xpRequiredForLevel(
            level
        );

    }


    function getNextLevelXP(
        level
    ) {

        return xpRequiredForLevel(
            level + 1
        );

    }


    function updateGameLevel(
        showLevelUp
    ) {

        const previousLevel =
            game.level;


        game.level =
            getLevelFromXP(
                game.xp
            );


        if (
            showLevelUp &&
            game.level >
            previousLevel
        ) {

            showLevelUpModal(
                game.level
            );

        }

    }


    function updateXPUI() {

        const level =
            game.level;


        const startXP =
            getLevelStartXP(
                level
            );


        const nextXP =
            getNextLevelXP(
                level
            );


        const currentLevelXP =
            game.xp -
            startXP;


        const requiredLevelXP =
            nextXP -
            startXP;


        const percentage =
            Math.min(
                100,
                Math.max(
                    0,
                    Math.round(
                        currentLevelXP /
                        requiredLevelXP *
                        100
                    )
                )
            );


        const levelElement =
            document.getElementById(
                "levelNumber"
            );


        const xpElement =
            document.getElementById(
                "xpValue"
            );


        const fill =
            document.getElementById(
                "xpFill"
            );


        if (levelElement) {

            levelElement.textContent =
                "LVL " + level;

        }


        if (xpElement) {

            xpElement.textContent =
                formatNumber(
                    currentLevelXP
                ) +
                " / " +
                formatNumber(
                    requiredLevelXP
                ) +
                " XP";

        }


        if (fill) {

            fill.style.width =
                percentage + "%";

        }

    }


    /* =========================================
       XP REWARDS
    ========================================= */

    function getRewardKey(
        category,
        item
    ) {

        return (
            category +
            "_" +
            item.id
        );

    }


    function calculateXPForProgress(
        category,
        item
    ) {

        const key =
            getRewardKey(
                category,
                item
            );


        const currentProgress =
            progress(
                item.current,
                item.target
            );


        const rewarded =
            Number(
                game.rewardedProgress[key]
            ) || 0;


        const difference =
            currentProgress -
            rewarded;


        if (difference <= 0) {

            return 0;

        }


        return difference * 2;

    }


    function awardXPForChanges(
        previousData
    ) {

        let earnedXP = 0;


        Object.keys(data).forEach(
            function(category) {

                data[category].forEach(
                    function(item) {

                        const oldItem =
                            previousData[
                                category
                            ].find(
                                function(element) {

                                    return (
                                        element.id ===
                                        item.id
                                    );

                                }
                            );


                        const currentProgress =
                            progress(
                                item.current,
                                item.target
                            );


                        const key =
                            getRewardKey(
                                category,
                                item
                            );


                        const previousRewarded =
                            Number(
                                game.rewardedProgress[key]
                            ) || 0;


                        let oldProgress =
                            oldItem
                                ? progress(
                                    oldItem.current,
                                    oldItem.target
                                )
                                : 0;


                        /*
                            Reward only for
                            progress that has
                            actually increased.
                        */

                        const effectiveOld =
                            Math.max(
                                oldProgress,
                                previousRewarded
                            );


                        if (
                            currentProgress >
                            effectiveOld
                        ) {

                            const difference =
                                currentProgress -
                                effectiveOld;


                            const earned =
                                difference * 2;


                            earnedXP +=
                                earned;


                            game.rewardedProgress[key] =
                                currentProgress;

                        }

                    }
                );

            }
        );


        if (earnedXP > 0) {

            game.xp +=
                earnedXP;

            updateGameLevel(true);

            showToast(
                "+" +
                earnedXP +
                " XP"
            );

        }


        updateXPUI();

    }


    /* =========================================
       STORAGE
    ========================================= */

    function loadApplication() {

        data =
            clone(defaultData);


        try {

            let saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            /*
                If v3 doesn't exist,
                import existing v2 data.
            */

            if (!saved) {

                saved =
                    localStorage.getItem(
                        OLD_STORAGE_KEY
                    );

            }


            if (saved) {

                const parsed =
                    JSON.parse(
                        saved
                    );


                if (
                    parsed.data
                ) {

                    mergeSavedData(
                        parsed.data
                    );

                } else {

                    /*
                        Old v2 format.
                    */

                    mergeSavedData(
                        parsed
                    );

                }

            }


            const gameSaved =
                localStorage.getItem(
                    STORAGE_KEY +
                    "_game"
                );


            if (gameSaved) {

                const parsedGame =
                    JSON.parse(
                        gameSaved
                    );


                game.xp =
                    Number(
                        parsedGame.xp
                    ) || 0;


                game.rewardedProgress =
                    parsedGame.rewardedProgress
                    || {};

            }


            game.level =
                getLevelFromXP(
                    game.xp
                );

        } catch (error) {

            console.error(
                "Load error:",
                error
            );

        }

    }


    function mergeSavedData(
        saved
    ) {

        if (!saved) {
            return;
        }


        Object.keys(data).forEach(
            function(category) {

                if (
                    !Array.isArray(
                        saved[category]
                    )
                ) {
                    return;
                }


                saved[category].forEach(
                    function(savedItem) {

                        const item =
                            data[category].find(
                                function(element) {

                                    return (
                                        element.id ===
                                        savedItem.id
                                    );

                                }
                            );


                        if (item) {

                            item.current =
                                Number(
                                    savedItem.current
                                ) || 0;


                            item.target =
                                Number(
                                    savedItem.target
                                ) || 0;

                        }

                    }
                );

            }
        );

    }


    function saveApplication() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );


            localStorage.setItem(
                STORAGE_KEY +
                "_game",
                JSON.stringify(game)
            );

        } catch (error) {

            console.error(
                "Save error:",
                error
            );

        }

    }

    function updateHome() {

        const overallValue =
            document.getElementById(

        const overallFill =
            document.getElementById(
                "overallFill"
            );


        if (overallValue) {

            overallValue.innerHTML =
                total +
                "<span>%</span>";

        }


        if (overallFill) {

            overallFill.style.width =
                total + "%";

        }


        document
            .querySelectorAll(
                ".category-card"
            )
            .forEach(
                function(card) {

                    const category =
                        card.dataset.category;


                    const value =
                        categoryProgress(
                            category
                        );


                    const percent =
                        card.querySelector(
                            ".category-percent"
                        );


                    const fill =
                        card.querySelector(
                            ".progress-fill"
                        );


                    if (percent) {

                        percent.textContent =
                            value + "%";

                    }


                    if (fill) {

                        fill.style.width =
                            value + "%";

                    }

                }
            );


        updateXPUI();

    }


    /* =========================================
       NAVIGATION
    ========================================= */

    function setupNavigation() {

        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            const section =
                                this.dataset.section;


                            if (
                                section ===
                                "home"

                                closeCategory();

                                setActiveNav(
                                    "home"
                                );

                            } else {

                                openCategory(
                                    section

                                setActiveNav(

                }

        document

                function(card) {

                    card.addEventListener(
                        "click",

                                this.dataset.category

                            setActiveNav(
                                this.dataset.category

                        }

                }
            );

    }

    /* =========================================
       CATEGORY PAGE
    ========================================= */

    function openCategory(
        category

        closeCategory();


        document.body.classList.add(
            "page-open"
        );


        const titles = {

            finance:

            health:
                "❤️ Здоровье",

            development:
                "🧠 Развитие"

        };


        const page =
            document.createElement(
                "div"
            );


        page.className =
            "category-page";


        const percent =
            categoryProgress(
                category
            );


        page.innerHTML = `

            <div class="category-page-header">

                <button
                    class="back-button"
                    type="button"
                >
                    ←
                </button>

                <div>

                    <div class="page-eyebrow">

                        ${titles[category]}

            </div>

                    CATEGORY PROGRESS

                <div class="summary-value">
                    ${percent}%
                </div>

                <div class="summary-bar">

                    <div
                        class="summary-fill"
                        style="width:${percent}%"
                    ></div>

                </div>

            </div>


            <div class="metrics-list">

                ${data[category]
                    .map(
                        function(item) {

                            const p =
                                progress(
                                    item.current,
                                    item.target
                                );


                            return `

                                <div
                                    class="metric-card"
                                >

                                    <div class="metric-top">

                                        <div class="metric-title">

                                            <div class="metric-icon">
                                                ${item.icon}
                                            </div>

                                            <div>

                                                <strong>
                                                    ${item.name}
                                                </strong>

                                                <span>
                                                    ${formatNumber(
                                                        item.current
                                                    )}
                                                    ${item.unit}
                                                    /
                                                    ${formatNumber(
                                                        item.target
                                                    )}
                                                    ${item.unit}
                                                </span>

                                            </div>

                                        </div>


                                        <div class="metric-percent">
                                            ${p}%
                                        </div>

                                    </div>


                                    <div class="metric-progress">

                                        <div
                                            class="metric-progress-fill"
                                            style="width:${p}%"
                                        ></div>

                                    </div>


                                    <button
                                        class="metric-edit"
                                        type="button"
                                        data-edit="${item.id}"
                                    >
                                        ✎ ИЗМЕНИТЬ
                                    </button>

                                </div>

                            `;

                        }
                    )
                    .join("")}

            </div>

        `;


        document.body.appendChild(
            page
        );


        page
            .querySelector(
                ".back-button"
            )
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();

                    closeCategory();

                    setActiveNav(
                        "home"
                    );

                    updateHome();

                }
            );


        page
            .querySelectorAll(
                ".metric-edit"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            openEditor(
                                category,
                                this.dataset.edit
                            );

                        }
                    );

                }
            );

    }


    function closeCategory() {

        const page =
            document.querySelector(
                ".category-page"

        if (page) {

            page.remove();

        }


        document.body.classList.remove(
            "page-open"
        );

    }


    /* =========================================
       EDITOR
    ========================================= */

    function openEditor(
        category,
        id
    ) {

        const item =
            data[category].find(
                function(element) {

                    return (
                        element.id === id
                    );

                }
            );


        if (!item) {
            return;
        }


        const previousData =
            clone(data);


        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "editor-overlay";


        overlay.innerHTML = `

            <div class="editor">

                <button
                    class="editor-close"
                    type="button"
                >
                    ×
                </button>


                <div class="editor-icon">
                    ${item.icon}
                </div>


                <div class="editor-eyebrow">
                    EDIT GOAL
                </div>


                <h3>
                    ${item.name}
                </h3>


                <label>
                    Текущее значение
                </label>


                <input
                    class="current-input"
                    type="number"
                    inputmode="decimal"
                    value="${item.current}"
                >


                <label>
                    Цель
                </label>


                <input
                    class="target-input"
                    type="number"
                    inputmode="decimal"
                    value="${item.target}"
                >


                <div class="editor-preview">

                    <span>
                        ПРОГРЕСС
                    </span>

                    <strong
                        class="editor-progress"
                    >
                        ${progress(
                            item.current,
                            item.target
                        )}%
                    </strong>

                </div>


                <button
                    class="save-button"
                    type="button"
                >
                    СОХРАНИТЬ
                </button>

            </div>

        `;


        document.body.appendChild(
            overlay
        );


        const currentInput =
            overlay.querySelector(
                ".current-input"
            );


        const targetInput =
            overlay.querySelector(
                ".target-input"
            );


        const preview =
            overlay.querySelector(
                ".editor-progress"
            );


        function updatePreview() {

            preview.textContent =
                progress(
                    currentInput.value,
                    targetInput.value
                ) + "%";

        }


        currentInput.addEventListener(
            "input",
            updatePreview
        );


        targetInput.addEventListener(
            "input",
            updatePreview
        );


        overlay
            .querySelector(
                ".editor-close"
            )
            .addEventListener(
                "click",
                function() {

                    overlay.remove();

                }
            );


        overlay
            .querySelector(
                ".save-button"
            )
            .addEventListener(
                "click",
                function() {

                    item.current =
                        Number(
                            currentInput.value
                        ) || 0;


                    item.target =
                        Number(
                            targetInput.value
                        ) || 0;


                    awardXPForChanges(
                        previousData
                    );


                    saveApplication();


                    overlay.remove();


                    openCategory(
                        category
                    );


                    updateHome();

                }
            );


        overlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            }
        );

    }


    /* =========================================

    ========================================= */

    function showLevelUpModal(

        setTimeout(
            function() {

                const overlay =
                    document.createElement(
                        "div"
                    );


                overlay.className =
                    "editor-overlay";


                overlay.innerHTML = `

                    <div class="editor level-up">

                        <button

                            type="button"
                        >
                            ×
                        </button>


                        <div class="editor-icon">
                            ↑
                        </div>


                        <div class="editor-eyebrow">
                            LEVEL UP
                        </div>


                        <h3>
                            Новый уровень
                        </h3>


                        <p>
                            Отличная работа.<br>
                            Ты продолжаешь прокачивать свою жизнь.
                        </p>


                        <span class="new-level">
                            LVL ${level}
                        </span>


                        <button
                            class="save-button"
                            type="button"
                        >
                            ПРОДОЛЖИТЬ
                        </button>

                    </div>

                `;


                document.body.appendChild(
                    overlay
                );


                function close() {

                    overlay.remove();

                }


                overlay
                    .querySelector(
                        ".editor-close"
                    )
                    .addEventListener(
                        "click",
                        close
                    );


                overlay
                    .querySelector(
                        ".save-button"
                    )
                    .addEventListener(
                        "click",
                        close
                    );


                overlay.addEventListener(
                    "click",
                    function(event) {

                        if (
                            event.target ===
                            overlay
                        ) {

                            close();

                        }

                    }
                );

            },
            350
        );

    }


    /* =========================================
       TOAST
    ========================================= */

    function showToast(
        message
    ) {

        let toast =
            document.querySelector(
                ".life-message"
            );


        if (!toast) {

            toast =
                document.createElement(
                    "div"
                );


            toast.className =
                "life-message";


            document.body.appendChild(
                toast
            );

        }


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            toast._timer
        );


        toast._timer =
            setTimeout(
                function() {

                    toast.classList.remove(
                        "show"
                    );

                },
                1800
            );

    }


    /* =========================================
       DAILY QUEST
    ========================================= */

    function setupQuest() {

        const button =
            document.getElementById(
                "dailyQuest"
            );


        if (!button) {
            return;
        }


        button.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                const overlay =
                    document.createElement(
                        "div"
                    );


                overlay.className =
                    "editor-overlay";


                overlay.innerHTML = `

                    <div class="editor">

                        <button
                            class="editor-close"
                            type="button"
                        >
                            ×
                        </button>


                        <div class="editor-icon">
                            ⚡
                        </div>


                        <div class="editor-eyebrow">
                            DAILY QUEST
                        </div>


                        <h3>
                            Новый день
                        </h3>


                        <p
                            style="
                                color:#777;
                                font-size:13px;
                                line-height:1.5;
                                margin:0 0 20px;
                            "
                        >
                            Здесь появятся ежедневные
                            задания, которые будут
                            приносить тебе XP.
                        </p>


                        <button
                            class="save-button"
                            type="button"
                        >
                            ПОНЯТНО
                        </button>

                    </div>

                `;


                document.body.appendChild(
                    overlay
                );


                overlay
                    .querySelector(
                        ".editor-close"
                    )
                    .addEventListener(
                        "click",
                        function() {

                            overlay.remove();

                        }
                    );


                overlay
                    .querySelector(
                        ".save-button"
                    )
                    .addEventListener(
                        "click",
                        function() {

                            overlay.remove();

                        }
                    );

            }
        );

    }


    /* =========================================
       START
    ========================================= */

    function startApp() {

        loadApplication();

        setupNavigation();

        setupQuest();

        updateGameLevel(false);

        updateXPUI();

        updateHome();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startApp
        );

    } else {

        startApp();

    }

})();

</script>


</body>

</html>
