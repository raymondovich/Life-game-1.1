'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m]));

function loadState(){

try{
let r=localStorage.getItem(SK);
return r?normalize(JSON.parse(r)):clone(DEFAULT);
}catch(e){
return clone(DEFAULT);
}

}

function normalize(s){

let r=clone(DEFAULT);

if(!s||typeof s!=='object')return r;

if(s.player)
Object.keys(r.player).forEach(k=>{
if(s.player[k]!==undefined)
r.player[k]=Math.max(0,num(s.player[k]));
});

Object.keys(r.categories).forEach(c=>{

if(s.categories?.[c])
Object.keys(r.categories[c]).forEach(k=>{
if(s.categories[c][k]!==undefined)
r.categories[c][k]=s.categories[c][k];
});

});

if(Array.isArray(s.quests))
r.quests=s.quests.map(q=>({
id:String(q.id||''),
category:String(q.category||'discipline'),
title:String(q.title||'Quest'),
xp:Math.max(0,num(q.xp)),
done:Boolean(q.done)
}));

return r;

}

function loadExpenses(){

try{

let r=JSON.parse(localStorage.getItem(EK)||'[]');

return Array.isArray(r)
?r.map(e=>({
id:String(e.id||Date.now()+Math.random()),
name:String(e.name||''),
amount:Math.max(0,num(e.amount))
}))
:[];

}catch(e){
return[];
}

}

function loadUI(){

try{

let r=JSON.parse(localStorage.getItem(UK)||'{}');

return{
expensesCollapsed:Boolean(r.expensesCollapsed)
};

}catch(e){

return{
expensesCollapsed:false
};

}

}

expenses=loadExpenses(),

function save(){

localStorage.setItem(SK,JSON.stringify(state));
localStorage.setItem(EK,JSON.stringify(expenses));
localStorage.setItem(UK,JSON.stringify(ui));

}

function xpForLevel(l){
return Math.round(100*Math.pow(Math.max(1,num(l)),1.42));
}

function levelFromXP(x){

let l=1;

while(x>=xpForLevel(l+1)&&l<10000)l++;

return l;

}

function updateLevels(){

Object.keys(META).forEach(c=>{
state.categories[c].level=
levelFromXP(Math.max(0,num(state.categories[c].xp)));
});

state.player.level=
levelFromXP(Math.max(0,num(state.player.xp)));

}

function addPlayerXP(a){

state.player.xp=
Math.max(0,num(state.player.xp)+Math.round(num(a)));

state.player.level=
levelFromXP(state.player.xp);

}

function addCatXP(c,a){

let v=Math.max(0,Math.round(num(a)));

state.categories[c].xp=
Math.max(0,num(state.categories[c].xp)+v);

state.categories[c].level=
levelFromXP(state.categories[c].xp);

addPlayerXP(Math.round(v*.65));

save();

}

function removeCatXP(c,a){

let v=Math.max(0,Math.round(num(a)));

state.categories[c].xp=
Math.max(0,state.categories[c].xp-v);

state.categories[c].level=
levelFromXP(state.categories[c].xp);

state.player.xp=
Math.max(0,state.player.xp-Math.round(v*.65));

state.player.level=
levelFromXP(state.player.xp);

save();

}

function incomeXP(v){

let level=Math.max(1,state.categories.finance.level);

return v>0
?Math.max(1,Math.round(v/50000*100/Math.pow(level,.72)))
:0;

}

function applyIncome(oldV,newV){

let d=Math.max(
0,
incomeXP(newV)-incomeXP(oldV)
);

if(d)addCatXP('finance',d);
else save();

}

function expensesTotal(){
return expenses.reduce((a,e)=>a+num(e.amount),0);
}

function income(){
return num(state.categories.finance.monthlyIncome);
}

function expensePct(){
return income()
?Math.round(expensesTotal()/income()*100)
:0;
}

function savings(){
return Math.max(0,income()-expensesTotal());
}

function mp(a,b,over100=false){

let v=b>0
?Math.round(num(a)/num(b)*100)
:0;

return over100
?Math.max(0,v)
:clamp(v,0,100);

}

function financeProgress(){

let c=state.categories.finance,
i=income(),
g=Math.max(1,num(c.monthlyGoal));

return Math.round(
(
mp(i,g,true)+
mp(i*12,c.yearlyGoal)+
(i?clamp(Math.round(savings()/i*100),0,100):0)
)/3
);

}

function progress(c){

if(c==='finance')return financeProgress();

if(c==='training')
return mp(
state.categories.training.workouts,
state.categories.training.monthlyTarget
);

if(c==='development'){

let x=state.categories.development;

return Math.round(
(
mp(x.books,2)+
mp(x.languageMinutes,30)+
mp(x.meditationMinutes,15)
)/3
);

}

if(c==='discipline'){

let x=state.categories.discipline,
t=x.completed+x.failed;

return t
?clamp(Math.round(x.completed/t*100),0,100)
:0;

}

if(c==='health'){

let x=state.categories.health;

return Math.round(
(
clamp(num(x.routine),0,100)+
clamp(num(x.nutrition),0,100)+
mp(x.steps,10000)
)/3
);

}

return 0;

}

function totalProgress(){

return Math.round(
Object.keys(META).reduce(
(a,c)=>a+progress(c),
0
)/5
);

}

function rank(l){

return l>=90?'LEGEND':
l>=75?'ELITE':
l>=60?'MASTER':
l>=45?'VETERAN':
l>=30?'ADVANCED':
l>=15?'PLAYER':
'BEGINNER';

}

function swipes(p){

p.querySelectorAll('.expense-swipe').forEach(w=>{

let r=w.querySelector('.expense');

if(!r)return;

let sx=0,
sy=0,
dx=0,
drag=false,
moved=false;

const reveal=82;

function closeRow(){

r.style.transition=
'transform .22s cubic-bezier(.2,.8,.2,1)';

r.style.transform=
'translateX(0)';

r.classList.remove('swiped');

dx=0;

}

function openRow(){

r.style.transition=
'transform .22s cubic-bezier(.2,.8,.2,1)';

r.style.transform=
`translateX(-${reveal}px)`;

r.classList.add('swiped');

dx=-reveal;

}

r.addEventListener(
'touchstart',
e=>{

if(e.touches.length!==1)return;

sx=e.touches[0].clientX;
sy=e.touches[0].clientY;

dx=
r.classList.contains('swiped')
?-reveal
:0;

drag=true;
moved=false;

r.style.transition='none';

},
{passive:true}
);

r.addEventListener(
'touchmove',
e=>{

if(!drag||e.touches.length!==1)return;

const x=
e.touches[0].clientX-sx;

const y=
e.touches[0].clientY-sy;

if(
Math.abs(y)>Math.abs(x)&&
Math.abs(y)>8
){

drag=false;
r.style.transition='';

return;

}

moved=true;

let base=
r.classList.contains('swiped')
?-reveal
:0;

let next=
Math.min(
0,
Math.max(-reveal,base+x)
);

dx=next;

r.style.transform=
`translateX(${next}px)`;

},
{passive:true}
);

r.addEventListener(
'touchend',
()=>{

if(!drag)return;

drag=false;

r.style.transition='';

if(dx<=-reveal*.45){

openRow();

}else{

closeRow();

}

}
);

r.addEventListener(
'touchcancel',
()=>{

drag=false;
closeRow();

}
);

w.querySelector(
'.expense-delete-reveal'
)?.addEventListener(
'click',
()=>{

if(r.classList.contains('swiped')){

deleteExpense(
w.dataset.swipeId
);

}

}
);

r.querySelectorAll('button').forEach(
btn=>{
btn.addEventListener(
'click',
e=>e.stopPropagation()
);
}
);

});

}

<div class="modal-icon">
📉
</div>

<div class="modal-label">
${e?'EDIT EXPENSE':'NEW EXPENSE'}
</div>

<h3>
${e?'Изменить расход':'Добавить расход'}
</h3>

<label>
Название
</label>

<input
id="name"
type="text"
maxlength="60"
placeholder="Например: Аренда"
value="${e?esc(e.name):''}"
>

<label>
Сумма
</label>

<input
id="amount"
type="number"
inputmode="decimal"
min="0"
value="${e?e.amount:''}"
>

<button class="primary" id="save">
СОХРАНИТЬ
</button>

`);

let o=document.querySelector('.overlay');

o.querySelector('#save').onclick=()=>{

let n=
o.querySelector('#name').value.trim();

let a=
Math.max(
0,
num(o.querySelector('#amount').value)
);

if(!n)
return toast(
'Введите название расхода'
);

if(a<=0)
return toast(
'Введите сумму расхода'
);

if(e){

e.name=n;
e.amount=a;

}else{

expenses.push({
id:Date.now().toString(),
name:n,
amount:a
});

}

save();

closeModal();

renderHome();

openCategory('finance');

toast(
'Расход сохранён'
);

};

}

function deleteExpense(id){

expenses=
expenses.filter(
e=>String(e.id)!==String(id)
);

save();

renderHome();

openCategory('finance');

toast(
'Расход удалён'
);

}

function modal(content){

closeModal();

let o=document.createElement('div');

o.className='overlay';

o.innerHTML=`

<div class="modal">

<button class="close">
×
</button>

${content}

</div>
`;

document.body.appendChild(o);

document.body.classList.add('locked');

o.querySelector('.close').onclick=
closeModal;

o.onclick=e=>{
if(e.target===o)
closeModal();
};

}

function closeModal(){

document.querySelector('.overlay')?.remove();

if(!document.getElementById('activePage'))
document.body.classList.remove('locked');

}

function closePage(){

document.getElementById('activePage')?.remove();

if(!document.querySelector('.overlay'))
document.body.classList.remove('locked');

}

function setHome(){

document
.querySelectorAll('[data-nav]')
.forEach(
b=>b.classList.toggle(
'active',
b.dataset.nav==='home'
)
);

}

let tt;

function toast(m){

let t=document.querySelector('.toast');

if(t)t.remove();

t=document.createElement('div');

t.className='toast';

t.textContent=m;

document.body.appendChild(t);

requestAnimationFrame(
()=>t.classList.add('show')
);

clearTimeout(tt);

tt=setTimeout(
()=>{
t.classList.remove('show');

setTimeout(
()=>t.remove(),
220
);

},
1800
);

}

function quests(){

closePage();

let p=document.createElement('div');

p.className='page';
p.id='activePage';

p.innerHTML=`

<div class="page-inner">

<div class="page-head">

<button class="back">
←
</button>

<div>

<div class="page-eyebrow">
LIFE GAME
</div>

<h2>
⚡ Daily Quest
</h2>

</div>

</div>

<div class="quest-card">

<div class="section-label">
TODAY'S QUESTS
</div>

${state.quests.map(
(q,i)=>`

<div class="quest-item">

<div class="quest-row">

<div class="quest-title">
${esc(q.title)}
</div>

<div class="quest-xp">
+${q.xp} XP
</div>

</div>

<button
class="complete ${q.done?'done':''}"
data-q="${i}"
>
${q.done?'✓ ВЫПОЛНЕНО':'ВЫПОЛНИТЬ'}
</button>

</div>

`
).join('')}

</div>

</div>
`;

document.body.appendChild(p);

document.body.classList.add('locked');

p.querySelector('.back').onclick=()=>{
closePage();
setHome();
};

p.querySelectorAll('[data-q]').forEach(
b=>b.onclick=()=>{

let q=
state.quests[
num(b.dataset.q)
];

if(!q||q.done)return;

q.done=true;

let x=
state.categories[
q.category
];

x.streak++;

x.bestStreak=
Math.max(
x.bestStreak,
x.streak
);

let a=
Math.round(
q.xp*(1+x.streak*.08)
);

addCatXP(
q.category,
a
);

state.player.rating++;

save();

toast(
'Quest выполнен · +'+a+' XP'
);

quests();

renderHome();

}
);

}

document
.querySelectorAll('[data-nav]')
.forEach(
b=>b.onclick=()=>{

let c=b.dataset.nav;

document
.querySelectorAll('[data-nav]')
.forEach(
x=>x.classList.toggle(
'active',
x.dataset.nav===c
)
);

if(c==='home'){

closePage();

renderHome();

}else{

openCategory(c);

}

}
);

document
.querySelectorAll('.category')
.forEach(
c=>c.onclick=()=>{

setHome();

document
.querySelector(
`[data-nav="${c.dataset.category}"]`
)
?.classList.add('active');

openCategory(
c.dataset.category
);

}
);

document
.getElementById('dailyQuest')
.onclick=quests;

updateLevels();

save();

renderHome();

})();
</script>

<div class="toast"></div>

</body>
</html>
