```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>LIFE GAME</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
}

:root{
    --bg:#050505;
    --card:#101010;
    --border:#252525;
    --text:#f5f5f5;
    --muted:#626262;
    --radius:22px
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#050505;
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased
}

body{
    overflow-x:hidden
}

body.locked{
    overflow:hidden
}

button,
input{
    font-family:inherit
}

button{
    border:0;
    cursor:pointer
}

button:active{
    transform:scale(.985)
}

.app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    margin:auto;
    padding:24px 18px 155px
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px
}

.eyebrow,
.section-label,
.page-eyebrow{
    color:#606060;
    font-size:8px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase
}

.eyebrow{
    margin-bottom:6px
}

.header h1{
    margin:0;
    font-size:27px;
    line-height:1;
    font-weight:800;
    letter-spacing:-1.2px
}

.avatar{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #2c2c2c;
    border-radius:50%;
    background:linear-gradient(145deg,#292929,#0b0b0b);
    font-size:14px;
    font-weight:800;
    box-shadow:
        0 12px 30px #0007,
        inset 0 1px #ffffff14
}

.hero{
    padding:22px;
    margin-bottom:25px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,#161616,#0a0a0a);
    box-shadow:
        0 25px 65px #0006,
        inset 0 1px #ffffff09
}

.hero-top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between
}

.label{
    display:block;
    margin-bottom:6px;
    color:#626262;
    font-size:8px;
    font-weight:700;
    letter-spacing:2px
}

.level{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px
}

.xp{
    color:#909090;
    font-size:11px;
    font-weight:700
}

.bar{
    height:4px;
    margin-top:18px;
    background:#242424;
    border-radius:20px;
    overflow:hidden
}

.fill{
    height:100%;
    width:0;
    border-radius:inherit;
    background:linear-gradient(90deg,#777,#fff);
    transition:width .65s cubic-bezier(.2,.8,.2,1)
}

.hero-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    color:#646464;
    font-size:9px;
    font-weight:600
}

.life{
    margin-bottom:25px
}

.life-number{
    font-size:58px;
    font-weight:800;
    line-height:.95;
    letter-spacing:-4px;
    margin:7px 0 12px
}

.life-number span{
    font-size:27px;
    color:#777;
    letter-spacing:-1px
}

.life-bar{
    height:3px;
    background:#1c1c1c;
    border-radius:20px;
    overflow:hidden
}

.categories{
    display:flex;
    flex-direction:column;
    gap:12px
}

.category{
    padding:19px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,#131313,#0a0a0a);
    box-shadow:
        0 16px 40px #0004,
        inset 0 1px #ffffff06;
    cursor:pointer
}

.category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px
}

.category-title{
    display:flex;
    align-items:center;
    gap:12px
}

.icon{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:14px;
    background:linear-gradient(145deg,#1b1b1b,#111);
    font-size:19px
}

.category-name strong{
    display:block;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px
}

.category-name span{
    display:block;
    margin-top:6px;
    color:#606060;
    font-size:9px;
    font-weight:600
}

.percent{
    font-size:20px;
    font-weight:800
}

.progress{
    height:4px;
    background:#222;
    border-radius:20px;
    overflow:hidden
}

.progress i{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg,#777,#f5f5f5);
    border-radius:inherit;
    transition:width .65s cubic-bezier(.2,.8,.2,1)
}

.quest{
    width:100%;
    height:58px;
    margin-top:18px;
    border:1px solid #303030;
    border-radius:18px;
    background:linear-gradient(145deg,#eee,#bdbdbd);
    color:#080808;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px
}

.creator{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:42px;
    margin-top:16px;
    border:1px solid #202020;
    border-radius:14px;
    background:#0b0b0b;
    color:#686868;
    text-decoration:none;
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    transition:.2s ease
}

.creator strong{
    color:#aaa;
    font-weight:800
}

.creator:active{
    transform:scale(.985);
    background:#111
}

/* NAV */

.nav{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:530px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5px 6px;
    z-index:100;
    border:1px solid #242424;
    border-radius:23px;
    background:rgba(14,14,14,.96)!important;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:0 20px 50px rgba(0,0,0,.65)!important
}

.nav button{
    min-width:58px;
    height:55px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border-radius:16px;
    background:transparent!important;
    color:#555!important;
    -webkit-appearance:none!important;
    appearance:none!important
}

.nav button.active{
    color:#fff!important;
    background:rgba(255,255,255,.055)!important
}

.nav button:focus,
.nav button:focus-visible{
    outline:none!important;
    box-shadow:none!important
}

.nav-icon{
    font-size:17px;
    line-height:1
}

.nav-label{
    font-size:7px;
    font-weight:600
}

/* PAGES */

.page{
    position:fixed;
    inset:0;
    z-index:200;
    overflow-y:auto;
    padding:24px 18px 155px;
    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff12,
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #080808,
            #050505 60%,
            #030303
        );
    animation:pageIn .22s ease
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(10px)
    }
    to{
        opacity:1;
        transform:translateY(0)
    }
}

.page-inner{
    max-width:560px;
    margin:auto
}

.page-head{
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:22px
}

.back{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:14px;
    background:#111;
    color:#fff;
    font-size:20px
}

.page h2{
    margin:0;
    font-size:25px;
    font-weight:800;
    letter-spacing:-.8px
}

.summary{
    padding:21px;
    margin-bottom:14px;
    border:1px solid #242424;
    border-radius:22px;
    background:linear-gradient(145deg,#151515,#0c0c0c);
    box-shadow:0 20px 50px #0006
}

.summary-number{
    font-size:45px;
    font-weight:800;
    line-height:1;
    letter-spacing:-3px;
    margin:8px 0 15px
}

.cards{
    display:flex;
    flex-direction:column;
    gap:11px
}

.metric{
    padding:18px;
    border:1px solid #222;
    border-radius:20px;
    background:linear-gradient(145deg,#121212,#0a0a0a);
    box-shadow:0 14px 35px #0004
}

.metric-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px
}

.metric-left{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0
}

.metric-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border:1px solid #292929;
    border-radius:13px;
    background:#171717;
    font-size:18px
}

.metric-text strong{
    display:block;
    font-size:12px;
    font-weight:750;
    line-height:1.2
}

.metric-text span{
    display:block;
    margin-top:5px;
    color:#666;
    font-size:9px;
    line-height:1.25
}

.metric-percent{
    font-size:19px;
    font-weight:800;
    white-space:nowrap
}

.metric-bar{
    height:3px;
    margin-bottom:14px;
    background:#202020;
    border-radius:20px;
    overflow:hidden
}

.metric-bar i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#666,#eee);
    border-radius:inherit
}

.edit,
.add{
    width:100%;
    height:38px;
    border:1px solid #292929;
    border-radius:12px;
    background:#111;
    color:#8d8d8d;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.5px
}

.finance-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #222
}

.finance-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px
}

.finance-line:last-child{
    margin-bottom:0
}

.finance-line span{
    color:#666;
    font-size:8px;
    font-weight:700;
    letter-spacing:1.5px
}

.finance-line strong{
    font-size:13px;
    font-weight:800
}

/* EXPENSES */

.expenses{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #222
}

.expenses-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    margin-bottom:11px;
    padding:0;
    cursor:pointer;
    user-select:none;
    -webkit-appearance:none;
    appearance:none;
    border:0;
    color:inherit;
    background:transparent
}

.expenses-title:active{
    transform:none
}

.expenses-title-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0
}

.expenses-title span{
    color:#777;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.6px
}

.expenses-title strong{
    font-size:12px;
    font-weight:800
}

.collapse-chevron{
    display:none!important
}

.expenses.collapsed .collapse-chevron{
    display:none!important
}

.expense-content{
    overflow:hidden;
    max-height:900px;
    transition:
        max-height .28s cubic-bezier(.2,.8,.2,1),
        opacity .18s ease
}

.expenses.collapsed .expense-content{
    max-height:0;
    opacity:0
}

.expense-list{
    display:flex;
    flex-direction:column;
    gap:7px
}

.expense-swipe{
    position:relative;
    overflow:hidden;
    border-radius:13px;
    background:#ff3b30;
    touch-action:pan-y
}

.expense-delete-reveal{
    position:absolute;
    inset:0 0 0 auto;
    width:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ff3b30!important;
    color:#fff;
    font-size:0
}

.expense-delete-reveal::after{
    content:"×";
    font-size:24px;
    font-weight:300;
    line-height:1
}

.expense{
    position:relative;
    z-index:2;
    min-height:47px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px 8px 12px;
    border:1px solid #1f1f1f;
    border-radius:13px;
    background:#0c0c0c;
    transform:translateX(0);
    transition:transform .2s ease;
    will-change:transform
}

.expense.swiped{
    transform:translateX(-76px);
    box-shadow:-8px 0 18px rgba(0,0,0,.18)
}

.expense-info{
    min-width:0
}

.expense-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11px;
    font-weight:600
}

.expense-amount{
    margin-top:3px;
    color:#777;
    font-size:10px;
    font-weight:700
}

.expense-actions{
    display:flex;
    gap:5px
}

.expense-delete{
    display:none!important
}

.small-btn{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #262626;
    border-radius:9px;
    background:#141414;
    color:#777;
    font-size:14px
}

.ratio{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    padding:11px 12px;
    border-radius:12px;
    background:#141414
}

.ratio span{
    color:#666;
    font-size:8px;
    font-weight:700
}

.ratio strong{
    font-size:13px;
    font-weight:800
}

.notice{
    padding:14px;
    margin-top:12px;
    border:1px solid #222;
    border-radius:14px;
    background:#0d0d0d;
    color:#666;
    font-size:9px;
    line-height:1.5
}

/* QUEST */

.quest-card{
    padding:20px;
    border:1px solid #282828;
    border-radius:20px;
    background:linear-gradient(145deg,#171717,#0b0b0b)
}

.quest-item{
    padding:14px;
    margin-top:9px;
    border:1px solid #222;
    border-radius:14px;
    background:#0d0d0d
}

.quest-item:first-child{
    margin-top:0
}

.quest-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
}

.quest-title{
    font-size:11px;
    font-weight:700
}

.quest-xp{
    font-size:10px;
    color:#aaa;
    font-weight:800
}

.complete{
    width:100%;
    height:37px;
    margin-top:10px;
    border:1px solid #292929;
    border-radius:11px;
    background:#151515;
    color:#bbb;
    font-size:8px;
    font-weight:800;
    letter-spacing:1px
}

.complete.done{
    background:#eee;
    color:#080808
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:14px;
    background:#000bd;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    animation:fade .18s ease
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

.modal{
    position:relative;
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    padding:25px 20px 21px;
    border:1px solid #292929;
    border-radius:26px 26px 20px 20px;
    background:linear-gradient(145deg,#171717,#0b0b0b);
    box-shadow:0 -10px 60px #0009;
    animation:modalIn .22s cubic-bezier(.2,.8,.2,1)
}

@keyframes modalIn{
    from{transform:translateY(25px)}
    to{transform:translateY(0)}
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:34px;
    height:34px;
    border:1px solid #292929;
    border-radius:50%;
    background:#111;
    color:#777;
    font-size:20px
}

.modal-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    border:1px solid #2a2a2a;
    border-radius:15px;
    background:#191919;
    font-size:21px
}

.modal-label{
    margin-bottom:5px;
    color:#606060;
    font-size:8px;
    font-weight:800;
    letter-spacing:2px
}

.modal h3{
    margin:0 0 21px;
    padding-right:40px;
    font-size:21px;
    line-height:1.1;
    font-weight:800
}

.modal label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font-size:9px;
    font-weight:600
}

.modal input{
    width:100%;
    height:50px;
    margin-bottom:14px;
    padding:0 15px;
    border:1px solid #292929;
    border-radius:14px;
    outline:none;
    background:#0d0d0d;
    color:#f5f5f5;
    font-size:16px;
    font-weight:600
}

.modal input:focus{
    border-color:#555;
    background:#111
}

.modal-preview{
    display:flex;
    justify-content:space-between;
    padding:13px;
    margin:3px 0 16px;
    border:1px solid #242424;
    border-radius:14px;
    background:#0d0d0d
}

.modal-preview span{
    color:#666;
    font-size:9px;
    font-weight:600
}

.modal-preview strong{
    font-size:16px
}

.primary{
    width:100%;
    height:52px;
    border-radius:15px;
    background:linear-gradient(145deg,#f1f1f1,#bdbdbd);
    color:#080808;
    font-size:9px;
    font-weight:900;
    letter-spacing:2px
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    z-index:1000;
    transform:translate(-50%,10px);
    padding:12px 18px;
    border:1px solid #303030;
    border-radius:14px;
    background:#141414f5;
    color:#fff;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.2s
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0)
}

.training-divider{
    margin:4px 0 2px;
    padding:12px 2px 4px;
    color:#606060;
    font-size:8px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase
}

@media(max-width:360px){

    .app{
        padding-left:14px;
        padding-right:14px
    }

    .header h1{
        font-size:24px
    }

    .life-number{
        font-size:51px
    }

    .category{
        padding:17px
    }

    .nav-label{
        font-size:6px
    }

}

@media(min-width:700px){

    .app{
        padding-top:45px
    }

    .page{
        padding-top:35px
    }

}

</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div>

            <div class="eyebrow">
                YOUR LIFE
            </div>

            <h1>
                LIFE GAME
            </h1>

        </div>

        <div class="avatar">
            B
        </div>

    </header>


    <section class="hero">

        <div class="hero-top">

            <div>

                <span class="label">
                    PLAYER LEVEL
                </span>

                <div
                    class="level"
                    id="playerLevel"
                >
                    LVL 1
                </div>

            </div>

            <div
                class="xp"
                id="playerXP"
            >
                0 XP
            </div>

        </div>


        <div class="bar">

            <div
                class="fill"
                id="playerXPFill"
            ></div>

        </div>


        <div class="hero-bottom">

            <span id="xpNext">
                100 XP TO NEXT LEVEL
            </span>

            <span id="playerRank">
                BEGINNER
            </span>

        </div>

    </section>


    <section class="life">

        <div class="section-label">
            LIFE PROGRESS
        </div>

        <div
            class="life-number"
            id="lifeProgress"
        >
            0<span>%</span>
        </div>

        <div class="life-bar">

            <div
                class="fill"
                id="lifeFill"
            ></div>

        </div>

    </section>


    <main class="categories">

        <article
            class="category"
            data-category="finance"
        >

            <div class="category-head">

                <div class="category-title">

                    <div class="icon">
                        💰
                    </div>

                    <div class="category-name">

                        <strong>
                            FINANCE
                        </strong>

                        <span>
                            Финансы
                        </span>

                    </div>

                </div>

                <div
                    class="percent"
                    id="financePercent"
                >
                    0%
                </div>

            </div>
