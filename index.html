<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>LIFE GAME</title>


    <style>

        /* =========================================
           LIFE GAME — PREMIUM BLACK
        ========================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        :root {

            --bg: #050505;
            --bg-soft: #090909;

            --card: #101010;
            --card-light: #151515;

            --border: #242424;
            --border-light: #303030;

            --text: #f5f5f5;
            --text-soft: #a0a0a0;
            --text-muted: #626262;

            --white: #ffffff;

            --radius-large: 24px;
            --radius-medium: 18px;

        }


        html {

            margin: 0;
            padding: 0;

            min-height: 100%;

            background: var(--bg);

        }


        body {

            margin: 0;
            padding: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #050505 45%,
                    #030303 100%
                );

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Inter",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;

            overflow-x: hidden;

        }


        body.page-open {
            overflow: hidden;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        button {
            border: 0;
            cursor: pointer;
        }


        /* =========================================
           APP
        ========================================= */

        .app {

            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            margin: 0 auto;

            padding:
                24px
                18px
                120px;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 28px;

        }


        .eyebrow {

            margin-bottom: 5px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        .header h1 {

            margin: 0;

            color: var(--text);

            font-size: 27px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.2px;

        }


        .avatar {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #2a2a2a;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #292929,
                    #0b0b0b
                );

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 12px 30px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);

        }


        /* =========================================
           LEVEL
        ========================================= */

        .level-card {

            position: relative;

            margin-bottom: 30px;

            padding: 21px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-large);

            background:
                linear-gradient(
                    145deg,
                    #151515 0%,
                    #0d0d0d 55%,
                    #090909 100%
                );

            box-shadow:
                0 24px 60px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.035);

        }


        .level-top {

            position: relative;

            display: flex;

            align-items: flex-end;
            justify-content: space-between;

            z-index: 1;

        }


        .label {

            display: block;

            margin-bottom: 5px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 2px;

        }


        .level-number {

            color: var(--text);

            font-size: 26px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -1px;

        }


        .xp-value {

            color: #8b8b8b;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.5px;

        }


        .xp-bar {

            position: relative;

            width: 100%;
            height: 4px;

            margin-top: 19px;

            overflow: hidden;

            border-radius: 20px;

            background: #252525;

        }


        .xp-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #ffffff
                );

            transition:
                width 0.8s cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================
           OVERALL
        ========================================= */

        .overall-section {
            margin-bottom: 25px;
        }


        .section-label {

            margin-bottom: 3px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 2.5px;

        }


        .overall-value {

            margin-bottom: 12px;

            color: var(--text);

            font-size: 58px;
            line-height: 0.95;

            font-weight: 800;

            letter-spacing: -4px;

        }


        .overall-value span {

            margin-left: 2px;

            color: #777777;

            font-size: 27px;

            letter-spacing: -1px;

        }


        .overall-bar {

            width: 100%;
            height: 3px;

            overflow: hidden;

            border-radius: 20px;

            background: #1c1c1c;

        }


        .overall-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background: #eeeeee;

            box-shadow:
                0 0 10px rgba(255,255,255,0.18);

            transition:
                width 0.8s cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================
           CATEGORIES
        ========================================= */

        .categories {

            display: flex;

            flex-direction: column;

            gap: 13px;

        }


        .category-card {

            position: relative;

            padding: 20px;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-large);

            background:
                linear-gradient(
                    145deg,
                    #121212,
                    #0b0b0b
                );

            cursor: pointer;

            box-shadow:
                0 16px 40px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.025);

            transition:
                transform 0.18s ease,
                border-color 0.18s ease;

        }


        .category-card:active {

            transform: scale(0.985);

            border-color: #3a3a3a;

        }


        .category-header {

            position: relative;

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;

            z-index: 1;

        }


        .category-title {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .category-icon {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #282828;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #111111
                );

            font-size: 19px;

        }


        .category-name strong {

            display: block;

            color: #eeeeee;

            font-size: 13px;
            line-height: 1;

            font-weight: 750;

            letter-spacing: 1.1px;

        }


        .category-name span {

            display: block;

            margin-top: 6px;

            color: var(--text-muted);

            font-size: 10px;

            font-weight: 500;

        }


        .category-percent {

            color: #eeeeee;

            font-size: 20px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.7px;

        }


        .category-level {

            margin-top: 7px;

            color: #555555;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        .progress-bar {

            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 20px;

            background: #222222;

        }


        .progress-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #f5f5f5
                );

            transition:
                width 0.8s cubic-bezier(.2,.8,.2,1);

        }


        /* =========================================
           DAILY QUEST
        ========================================= */

        .quest-button {

            width: 100%;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-top: 20px;

            border: 1px solid #303030;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #eeeeee,
                    #bdbdbd
                );

            color: #080808;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2px;

            box-shadow:
                0 18px 40px rgba(0,0,0,0.35);

        }


        .quest-icon {

            margin-right: 8px;

            font-size: 19px;

        }


        /* =========================================
           BOTTOM NAV
        ========================================= */

        .bottom-nav {

            position: fixed;

            left: 50%;
            bottom: 12px;

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 484px;

            height: 69px;

            display: flex;

            align-items: center;
            justify-content: space-around;

            padding: 5px 7px;

            z-index: 100;

            border: 1px solid #242424;

            border-radius: 23px;

            background:
                rgba(14,14,14,0.92);

            backdrop-filter: blur(24px);

            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.65);

        }


        .nav-item {

            min-width: 58px;
            height: 56px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            border-radius: 17px;

            background: transparent;

            color: #555555;

        }


        .nav-item.active {

            color: #ffffff;

            background:
                rgba(255,255,255,0.055);

        }


        .nav-icon {

            font-size: 17px;

            line-height: 1;

        }


        .nav-label {

            font-size: 8px;

            font-weight: 500;

        }


        /* =========================================
           CATEGORY PAGE
        ========================================= */

        .category-page {

            position: fixed;

            inset: 0;

            z-index: 200;

            overflow-y: auto;

            padding:
                24px
                18px
                120px;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,0.07),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #050505 60%,
                    #030303 100%
                );

            animation:
                pageIn 0.25s ease;

        }


        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .category-page-header {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 24px;

        }


        .back-button {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #292929;

            border-radius: 14px;

            background: #111111;

            color: #ffffff;

            font-size: 20px;

        }


        .page-eyebrow {

            margin-bottom: 5px;

            color: #5f5f5f;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 2.5px;

        }


        .category-page h2 {

            margin: 0;

            color: #f5f5f5;

            font-size: 25px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.8px;

        }


        .category-summary {

            margin-bottom: 18px;

            padding: 22px;

            border: 1px solid #242424;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0c0c0c
                );

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

        }


        .summary-value {

            margin-bottom: 15px;

            color: #f5f5f5;

            font-size: 46px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -3px;

        }


        .summary-meta {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;

            color: #666666;

            font-size: 9px;

            font-weight: 700;

        }


        .summary-meta strong {

            color: #dddddd;

            font-size: 11px;

        }


        .summary-bar {

            width: 100%;
            height: 4px;

            overflow: hidden;

            border-radius: 20px;

            background: #222222;

        }


        .summary-fill {

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #777777,
                    #ffffff
                );

            transition:
                width 0.5s ease;

        }


        /* =========================================
           METRICS
        ========================================= */

        .metrics-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .metric-card {

            padding: 18px;

            border: 1px solid #222222;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #121212,
                    #0a0a0a
                );

            box-shadow:
                0 14px 35px rgba(0,0,0,0.22);

        }


        .metric-top {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 15px;

        }


        .metric-title {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .metric-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 1px solid #292929;

            border-radius: 13px;

            background: #171717;

            font-size: 18px;

        }


        .metric-title strong {

            display: block;

            color: #eeeeee;

            font-size: 12px;

            line-height: 1.2;

            font-weight: 700;

        }


        .metric-title span {

            display: block;

            margin-top: 5px;

            color: #666666;

            font-size: 9px;

            line-height: 1.2;

        }


        .metric-percent {

            color: #eeeeee;

            font-size: 19px;

            font-weight: 800;

            white-space: nowrap;

        }


        .metric-progress {

            width: 100%;
            height: 3px;

            margin-bottom: 15px;

            overflow: hidden;

            border-radius: 20px;

            background: #202020;

        }


        .metric-progress-fill {

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #666666,
                    #eeeeee
                );

            transition:
                width 0.5s ease;

        }


        .metric-edit {

            width: 100%;
            height: 38px;

            border: 1px solid #292929;

            border-radius: 12px;

            background: #111111;

            color: #8c8c8c;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        /* =========================================
           CATEGORY XP PANEL
        ========================================= */

        .category-xp-panel {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-top: 14px;

        }


        .xp-stat {

            padding: 13px 10px;

            border: 1px solid #202020;

            border-radius: 14px;

            background: #0d0d0d;

        }


        .xp-stat span {

            display: block;

            margin-bottom: 5px;

            color: #555555;

            font-size: 7px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .xp-stat strong {

            color: #eeeeee;

            font-size: 12px;

            font-weight: 800;

        }


        /* =========================================
           STREAK
        ========================================= */

        .streak-card {

            margin-bottom: 14px;

            padding: 17px;

            border: 1px solid #252525;

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    #141414,
                    #0b0b0b
                );

        }


        .streak-top {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 10px;

        }


        .streak-title {

            color: #777777;

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.8px;

        }


        .streak-value {

            color: #eeeeee;

            font-size: 14px;

            font-weight: 800;

        }


        .streak-description {

            color: #5e5e5e;

            font-size: 9px;

            line-height: 1.45;

        }


        /* =========================================
           EXPENSES
        ========================================= */

        .expenses-subblock {

            margin-top: 15px;

            padding-top: 16px;

            border-top: 1px solid #222222;

        }


        .expenses-subblock-header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 12px;

        }


        .expenses-subblock-title {

            color: #777777;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 1.8px;

            text-transform: uppercase;

        }


        .expenses-subblock-total {

            color: #eeeeee;

            font-size: 12px;

            font-weight: 800;

        }


        .expense-list {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .expense-row {

            min-height: 48px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding:
                8px
                10px
                8px
                12px;

            border: 1px solid #1f1f1f;

            border-radius: 13px;

            background: #0c0c0c;

        }


        .expense-row-info {

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 3px;

        }


        .expense-row-name {

            overflow: hidden;

            color: #dcdcdc;

            font-size: 11px;

            font-weight: 600;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .expense-row-amount {

            color: #888888;

            font-size: 10px;

            font-weight: 700;

        }


        .expense-row-actions {

            display: flex;

            align-items: center;

            gap: 5px;

            flex-shrink: 0;

        }


        .expense-action {

            width: 31px;
            height: 31px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #262626;

            border-radius: 9px;

            background: #141414;

            color: #777777;

            font-size: 14px;

        }


        .expense-empty {

            padding: 16px 10px;

            border: 1px dashed #292929;

            border-radius: 13px;

            color: #555555;

            font-size: 10px;

            line-height: 1.5;

            text-align: center;

        }


        .add-expense-button {

            width: 100%;
            height: 42px;

            margin-top: 10px;

            border: 1px solid #292929;

            border-radius: 12px;

            background: #111111;

            color: #999999;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.4px;

        }


        .expenses-ratio {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 10px;

            padding: 11px 12px;

            border-radius: 12px;

            background: #141414;

        }


        .expenses-ratio span {

            color: #666666;

            font-size: 9px;

            font-weight: 600;

        }


        .expenses-ratio strong {

            color: #eeeeee;

            font-size: 12px;

            font-weight: 800;

        }


        /* =========================================
           SIMULATOR
        ========================================= */

        .simulator-button {

            width: 100%;
            height: 48px;

            margin-top: 10px;

            border: 1px solid #2b2b2b;

            border-radius: 14px;

            background: #101010;

            color: #d0d0d0;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        .simulator-result {

            margin-top: 14px;

            padding: 17px;

            border: 1px solid #222222;

            border-radius: 18px;

            background: #0c0c0c;

        }


        .simulator-result-title {

            margin-bottom: 12px;

            color: #666666;

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.8px;

        }


        .simulator-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;

        }


        .simulator-stat {

            padding: 12px;

            border: 1px solid #1e1e1e;

            border-radius: 13px;

            background: #111111;

        }


        .simulator-stat span {

            display: block;

            margin-bottom: 5px;

            color: #5b5b5b;

            font-size: 8px;

        }


        .simulator-stat strong {

            color: #eeeeee;

            font-size: 13px;

            font-weight: 800;

        }


        /* =========================================
           HISTORY
        ========================================= */

        .history-list {

            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-top: 14px;

        }


        .history-row {

            display: grid;

            grid-template-columns:
                55px
                1fr
                auto;

            align-items: center;

            gap: 10px;

            padding: 12px;

            border: 1px solid #1d1d1d;

            border-radius: 13px;

            background: #0d0d0d;

        }


        .history-month {

            color: #777777;

            font-size: 9px;

            font-weight: 800;

        }


        .history-income {

            color: #dddddd;

            font-size: 11px;

            font-weight: 700;

        }


        .history-xp {

            color: #888888;

            font-size: 10px;

            font-weight: 800;

        }


        /* =========================================
           EDITOR
        ========================================= */

        .editor-overlay {

            position: fixed;

            inset: 0;

            z-index: 500;

            display: flex;

            align-items: flex-end;
            justify-content: center;

            padding: 14px;

            background:
                rgba(0,0,0,0.72);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            animation:
                overlayIn 0.2s ease;

        }


        .editor {

            position: relative;

            width: 100%;
            max-width: 500px;

            max-height: calc(100vh - 28px);

            overflow-y: auto;

<script>

(function () {

    "use strict";


    /* =========================================

    const STORAGE_KEY =

    const OLD_STORAGE_KEY =
        "life_game_v2";

    const EXPENSES_KEY =
        "life_game_expenses_v1";


    /* =========================================
       ECONOMY CONFIGURATION
    ========================================= */

    const ECONOMY = {

        /*
         * XP, необходимый для перехода
         * с уровня L на L+1.
         *
         * Формула растёт постепенно,
         * поэтому 1-100 — только первая
         * большая часть прогрессии.
         */

        levelXP: function (level) {

            const l =
                Math.max(
                    1,
                    Number(level) || 1
                );

            return Math.round(
                100 *
                Math.pow(
                    l,
                    1.38
                )
            );

        },


        /*
         * Finance.
         *
         * Чем выше уровень —
         * тем меньше коэффициент XP.
         *
         * Но рост дохода относительно
         * предыдущего месяца возвращает
         * дополнительный XP.
         */

        finance: {

            baseXP: 100,

            levelDecay: 0.018,

            growthBonus: 0.60,

            savingsBonus: 0.20,

            maxMonthlyXP: 5000

        /*
         * Training.
         *
         * Та же философия:
         * одинаковая тренировка на
         * высоком уровне ценится меньше,
         * но рост нагрузки/результата
         * даёт бонус.
         */

        training: {

            baseXP: 45,

            levelDecay: 0.014,

            growthBonus: 0.35,

            maxActionXP: 500

        },


        /*
         * Development.
         *
         * Стабильный XP.
         */

        development: {

            actionXP: 30,

            streakBonus: 0.10,

            maxActionXP: 300

        },


        /*
         * Остальные категории.
         */

        discipline: {

            actionXP: 25,

            streakBonus: 0.12

            actionXP: 25,

            streakBonus: 0.10

    /* =========================================

    ========================================= */

            title: "Финансы",

        training: {

    /* =========================================

                current: 0,

                target: 8

            }

        ]

    };


    /* =========================================
       STATE
    ========================================= */

    let data =
        loadData();

    let expenses =
        loadExpenses();


    /* =========================================
       CLONE
    ========================================= */

    function clone(object) {

        return JSON.parse(
            JSON.stringify(object)
        );

    }


    /* =========================================
       LOAD DATA
    ========================================= */

    function loadData() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (saved) {

                const parsed =
                    JSON.parse(saved);


                return mergeData(
                    parsed
                );

            }


            /*
             * Мягкая миграция старой версии.
             *
             * Старые значения сохраняются,
             * новая экономика начинает
             * с чистого XP.
             */

            const oldSaved =
                localStorage.getItem(
                    OLD_STORAGE_KEY
                );


            if (oldSaved) {

                const oldParsed =
                    JSON.parse(oldSaved);


                const migrated =
                    clone(defaultData);


                if (
                    Array.isArray(
                        oldParsed.finance
                    )
                ) {

                    oldParsed.finance.forEach(
                        function(oldItem) {

                            const target =
                                migrated.finance.find(
                                    function(item) {

                                        return (
                                            item.id ===
                                            oldItem.id
                                        );

                                    }
                                );


                            if (target) {

                                target.current =
                                    Number(
                                        oldItem.current
                                    ) || 0;

                                target.target =
                                    Number(
                                        oldItem.target
                                    ) || 0;

                            }

                        }
                    );

                }


                if (
                    Array.isArray(
                        oldParsed.health
                    )
                ) {

                    oldParsed.health.forEach(
                        function(oldItem) {

                            const target =
                                migrated.health.find(
                                    function(item) {

                                        return (
                                            item.id ===
                                            oldItem.id
                                        );

                                    }
                                );


                            if (target) {

                                target.current =
                                    Number(
                                        oldItem.current
                                    ) || 0;

                                target.target =
                                    Number(
                                        oldItem.target
                                    ) || 0;

                            }

                        }
                    );

                }


                if (
                    Array.isArray(
                        oldParsed.development
                    )
                ) {

                    oldParsed.development.forEach(
                        function(oldItem) {

                            const target =
                                migrated.development.find(
                                    function(item) {

                                        return (
                                            item.id ===
                                            oldItem.id
                                        );

                                    }
                                );


                            if (target) {

                                target.current =
                                    Number(
                                        oldItem.current
                                    ) || 0;

                                target.target =
                                    Number(
                                        oldItem.target
                                    ) || 0;

                            }

                        }
                    );

                }


                return migrated;

            }

        } catch (error) {

            console.error(
                "LIFE GAME storage error:",
                error
            );

        }


        return clone(
            defaultData
        );

    }


    /* =========================================
       MERGE DATA
    ========================================= */

    function mergeData(saved) {

        const result =
            clone(defaultData);


        if (
            saved.meta
        ) {

            result.meta =
                Object.assign(
                    result.meta,
                    saved.meta
                );

        }


        if (
            saved.categories
        ) {

            Object.keys(
                result.categories
            ).forEach(
                function(category) {

                    if (
                        saved.categories[category]
                    ) {

                        result.categories[category] =
                            Object.assign(
                                result.categories[category],
                                saved.categories[category]
                            );

                    }

                }
            );

        }


        Object.keys(
            result
        ).forEach(
            function(section) {

                if (
                    !Array.isArray(
                        result[section]
                    )
                ) {

                    return;

                }


                if (
                    Array.isArray(
                        saved[section]
                    )
                ) {

                    saved[section].forEach(
                        function(savedItem) {

                            const item =
                                result[section].find(
                                    function(element) {

                                        return (
                                            element.id ===
                                            savedItem.id
                                        );

                                    }
                                );


                            if (item) {

                                item.current =
                                    Number(
                                        savedItem.current
                                    ) || 0;


                                item.target =
                                    Number(
                                        savedItem.target
                                    ) || 0;

                            }

                        }
                    );

                }

            }
        );


        /*
         * Защита от NaN и старых
         * повреждённых значений.
         */

        Object.keys(
            result.categories
        ).forEach(
            function(category) {

                const state =
                    result.categories[category];


                state.xp =
                    Number(state.xp) || 0;


                state.level =
                    Math.max(
                        1,
                        Number(state.level) || 1
                    );


                state.streak =
                    Math.max(
                        0,
                        Number(state.streak) || 0
                    );


                state.bestStreak =
                    Math.max(
                        0,
                        Number(state.bestStreak) || 0
                    );

            }
        );


        result.meta.characterXP =
            Number(
                result.meta.characterXP
            ) || 0;


        result.meta.negativeXP =
            Number(
                result.meta.negativeXP
            ) || 0;


        return result;

    }

    /* =========================================
       BASIC CALCULATIONS
    ========================================= */

    function progress(
        current,
        target
    ) {

        const c =
            Number(current) || 0;

        const t =
            Number(target) || 0;


        if (t <= 0) {

            return 0;

        }


        return Math.min(
            100,
            Math.max(
                0,
                Math.round(
                    c / t * 100
                )
            )
        );

    }


    function formatNumber(value) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(
            Number(value) || 0
        );

    }


    function formatXP(value) {

        const n =
            Math.round(
                Number(value) || 0
            );


        return formatNumber(n);

    }


    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       FINANCE
    ========================================= */

    function getIncome() {

        const item =
            data.finance.find(
                function(element) {

                    return (
                        element.id ===
                        "income"
                    );

                }
            );


        return Number(
            item?.current
        ) || 0;

    }


    function getExpensesTotal() {

        return expenses.reduce(
            function(total, expense) {

                return (
                    total +
                    (
                        Number(
                            expense.amount
                        ) || 0
                    )
                );

            },
            0
        );

    }


    function getExpensesPercent() {

        const income =
            getIncome();


        const total =
            getExpensesTotal();


        if (income <= 0) {

            return 0;

        }


        return Math.round(
            total / income * 100
        );

    }


    function getSavings() {

        return Math.max(
            0,
            getIncome() -
            getExpensesTotal()
        );

    }


    /* =========================================
       CATEGORY PROGRESS
    ========================================= */

    function categoryProgress(
        category
    ) {

        const items =
            data[category];


        if (
            !Array.isArray(items) ||
            !items.length
        ) {

            return 0;

        }


        const progressItems =
            items.filter(
                function(item) {

                    return (
                        item.id !==
                        "expenses"
                    );

                }
            );


        if (!progressItems.length) {

            return 0;

        }


        const total =
            progressItems.reduce(
                function(sum, item) {

                    return (
                        sum +
                        progress(
                            item.current,
                            item.target
                        )
                    );

                },
                0
            );


        return Math.round(
            total /
            progressItems.length
        );

    }


    /* =========================================
       LEVEL ENGINE
    ========================================= */

    function getLevelFromXP(
        xp
    ) {

        let level = 1;

        let remaining =
            Math.max(
                0,
                Number(xp) || 0
            );


        /*
         * Практический цикл.
         * При огромном XP уровень всё равно
         * продолжает расти.
         */

        while (
            remaining >=
            ECONOMY.levelXP(level)
        ) {

            remaining -=
                ECONOMY.levelXP(level);

            level++;


            if (level > 100000) {

                break;

            }

        }


        return {

            level,
            remaining,
            required:
                ECONOMY.levelXP(level)

        };

    }


    function normalizeCategoryLevel(
        category
    ) {

        const state =
            data.categories[category];


        if (!state) {

            return;

        }


        const info =
            getLevelFromXP(
                state.xp
            );


        state.level =
            info.level;

    }


    function getCategoryLevelInfo(
        category
    ) {

        const state =
            data.categories[category];


        if (!state) {

            return {
                level: 1,
                currentXP: 0,
                requiredXP:
                    ECONOMY.levelXP(1),
                percent: 0
            };

        }


        const info =
            getLevelFromXP(
                state.xp
            );


        return {

            level:
                info.level,

            currentXP:
                info.remaining,

            requiredXP:
                info.required,

            percent:
                Math.min(
                    100,
                    Math.round(
                        info.remaining /
                        info.required *
                        100
                    )
                )

        };

    }


    /* =========================================
       GLOBAL LEVEL
       ========================================= */

    function calculateCharacterXP() {

        const categories =
            Object.keys(
                data.categories
            );


        const total =
            categories.reduce(
                function(sum, category) {

                    return (
                        sum +
                        Math.max(
                            0,
                            Number(
                                data.categories[
                                    category
                                ].xp
                            ) || 0
                        )
                    );

                },
                0
            );


        data.meta.characterXP =
            Math.max(
                0,
                total -
                (
                    Number(
                        data.meta.negativeXP
                    ) || 0
                )
            );


        return data.meta.characterXP;

    }


    function getGlobalLevelInfo() {

        const xp =
            calculateCharacterXP();


        return getLevelFromXP(
            xp
        );

    }


    /* =========================================
       STREAK ENGINE
    ========================================= */

    function todayKey() {

        const date =
            new Date();


        return [
            date.getFullYear(),
            String(
                date.getMonth() + 1
            ).padStart(2, "0"),
            String(
                date.getDate()
            ).padStart(2, "0")
        ].join("-");

    }


    function dateDifference(
        a,
        b
    ) {

        if (!a || !b) {

            return null;

        }


        const first =
            new Date(
                a + "T00:00:00"
            );


        const second =
            new Date(
                b + "T00:00:00"
            );


        return Math.round(
            (
                second -
                first
            ) /
            86400000
        );

    }


    function updateStreak(
        category
    ) {

        const state =
            data.categories[category];


        const today =
            todayKey();


        if (
            state.lastActionDate ===
            today
        ) {

            return state.streak;

        }


        const difference =
            dateDifference(
                state.lastActionDate,
                today
            );


        if (
            difference === 1
        ) {

            state.streak += 1;

        } else {

            state.streak = 1;

        }


        state.bestStreak =
            Math.max(
                state.bestStreak,
                state.streak
            );


        state.lastActionDate =
            today;


        return state.streak;

    }


    function streakMultiplier(
        streak
    ) {

        const s =
            Math.max(
                0,
                Number(streak) || 0
            );


        /*
         * 1 день = 1.00
         * 7 дней ≈ 1.18
         * 30 дней ≈ 1.45
         * дальше рост замедляется.
         */

        return (
            1 +
            Math.min(
                0.60,
                Math.log1p(s) *
                0.055
            )
        );

    }


    /* =========================================
       FINANCE XP
       ========================================= */

    function calculateFinanceXP(
        income,
        previousIncome,
        expensesAmount
    ) {

        const current =
            Math.max(
                0,
                Number(income) || 0
            );


        if (current <= 0) {

            return 0;

        }


        const state =
            data.categories.finance;


        const levelInfo =
            getCategoryLevelInfo(
                "finance"
            );


        const level =
            levelInfo.level;


        /*
         * Базовый XP.
         *
         * 50 000 ₽ на низком уровне
         * даёт больше XP, чем те же
         * 50 000 ₽ на высоком уровне.
         */

        const incomeUnits =
            current / 50000;


        const decay =
            1 /
            (
                1 +
                ECONOMY.finance.levelDecay *
                Math.pow(
                    Math.max(
                        0,
                        level - 1
                    ),
                    1.18
                )
            );


        let xp =
            ECONOMY.finance.baseXP *
            incomeUnits *
            decay;


        /*
         * Рост дохода относительно
         * предыдущего месяца.
         */

        if (
            previousIncome > 0 &&
            current > previousIncome
        ) {

            const growth =
                (
                    current -
                    previousIncome
                ) /
                previousIncome;


            xp *=
                1 +
                Math.min(
                    1.5,
                    growth *
                    ECONOMY.finance.growthBonus
                );

        }


        /*
         * Чем меньше расходы относительно
         * дохода, тем выше эффективность.
         */

        if (current > 0) {

            const savingsRate =
                Math.max(
                    0,
                    (
                        current -
                        expensesAmount
                    ) /
                    current
                );


            xp *=
                1 +
                Math.min(
                    ECONOMY.finance.savingsBonus,
                    savingsRate *
                    ECONOMY.finance.savingsBonus
                );

        }


        return Math.min(
            ECONOMY.finance.maxMonthlyXP,
            Math.max(
                0,
                Math.round(xp)
            )
        );

    }


    /* =========================================
       TRAINING XP
       ========================================= */

    function calculateTrainingXP(
        load,
        previousLoad
    ) {

        const current =
            Math.max(
                0,
                Number(load) || 0
            );


        if (current <= 0) {

            return 0;

        }


        const levelInfo =
            getCategoryLevelInfo(
                "training"
            );


        const level =
            levelInfo.level;


        const decay =
            1 /
            (
                1 +
                ECONOMY.training.levelDecay *
                Math.pow(
                    Math.max(
                        0,
                        level - 1
                    ),
                    1.15
                )
            );


        let xp =
            ECONOMY.training.baseXP *
            (
                current /
                1000
            ) *
            decay;


        if (
            previousLoad > 0 &&
            current > previousLoad
        ) {

            const growth =
                (
                    current -
                    previousLoad
                ) /
                previousLoad;


            xp *=
                1 +
                Math.min(
                    1,
                    growth *
                    ECONOMY.training.growthBonus
                );

        }


        return Math.min(
            ECONOMY.training.maxActionXP,
            Math.max(
                0,
                Math.round(xp)
            )
        );

    }


    /* =========================================
       ADD XP
       ========================================= */

    function addXP(
        category,
        amount,
        reason = ""
    ) {

        const value =
            Number(amount) || 0;


        if (!data.categories[category]) {

            return;

        }


        if (value > 0) {

            const before =
                getCategoryLevelInfo(
                    category
                ).level;


            data.categories[category].xp +=
                value;


            normalizeCategoryLevel(
                category
            );


            const after =
                getCategoryLevelInfo(
                    category
                ).level;


            calculateCharacterXP();

            saveData();


            if (
                after > before
            ) {

                showToast(
                    `${CATEGORY_META[category].icon} ${CATEGORY_META[category].code} LVL ${after}`
                );

            } else if (reason) {

                showToast(
                    `+${formatXP(value)} XP · ${reason}`
                );

            }

        }

    }


    /* =========================================
       REMOVE XP
       ========================================= */

    function removeXP(
        category,
        amount,
        reason = ""
    ) {

        const value =
            Math.abs(
                Number(amount) || 0
            );


        if (!data.categories[category]) {

            return;

        }


        const before =
            getCategoryLevelInfo(
                category
            ).level;


        data.categories[category].xp =
            Math.max(
                0,
                data.categories[category].xp -
                value
            );


        data.meta.negativeXP +=
            value;


        normalizeCategoryLevel(
            category
        );


        const after =
            getCategoryLevelInfo(
                category
            ).level;


        calculateCharacterXP();

        saveData();


        if (
            after < before
        ) {

            showToast(
                `-${formatXP(value)} XP · уровень снижен`
            );

        } else if (reason) {

            showToast(
                `-${formatXP(value)} XP · ${reason}`
            );

        }

    }


    /* =========================================
       FINANCE MONTHLY ACTION
       ========================================= */

    function registerFinanceMonth() {

        const income =
            getIncome();


        if (income <= 0) {

            showToast(
                "Сначала укажи заработок за месяц"
            );

            return;

        }


        const state =
            data.categories.finance;


        const previousIncome =
            Number(
                state.previousIncome
            ) || 0;


        const totalExpenses =
            getExpensesTotal();


        const streak =
            updateStreak(
                "finance"
            );


        const multiplier =
            streakMultiplier(
                streak
            );


        const rawXP =
            calculateFinanceXP(
                income,
                previousIncome,
                totalExpenses
            );


        const finalXP =
            Math.round(
                rawXP *
                multiplier
            );


        addXP(
            "finance",
            finalXP,
            `${streak} дн. streak`
        );


        const now =
            new Date();


        const month =
            [
                now.getFullYear(),
                String(
                    now.getMonth() + 1
                ).padStart(2, "0")
            ].join("-");


        state.monthlyHistory.push({

            month: month,

            income: income,

            expenses: totalExpenses,

            savings:
                Math.max(
                    0,
                    income -
                    totalExpenses
                ),

            xp: finalXP

        });


        /*
         * Храним историю, но не даём ей
         * бесконтрольно разрастаться.
         */

        if (
            state.monthlyHistory.length >
            240
        ) {

            state.monthlyHistory =
                state.monthlyHistory.slice(
                    -240
                );

        }


        state.previousIncome =
            income;


        saveData();

        updateHome();

        showToast(
            `FINANCE +${formatXP(finalXP)} XP`
        );

    }


    /* =========================================
       TRAINING ACTION
       ========================================= */

    function registerTraining() {

        const loadItem =
            data.training.find(
                function(item) {

                    return (
                        item.id ===
                        "load"
                    );

                }
            );


        const load =
            Number(
                loadItem?.current
            ) || 0;


        if (load <= 0) {

            showToast(
                "Укажи объём нагрузки"
            );

            return;

        }


        const state =
            data.categories.training;


        const previousLoad =
            Number(
                state.previousLoad
            ) || 0;


        const streak =
            updateStreak(
                "training"
            );


        const multiplier =
            streakMultiplier(
                streak
            );


        const rawXP =
            calculateTrainingXP(
                load,
                previousLoad
            );


        const finalXP =
            Math.round(
                rawXP *
                multiplier
            );


        addXP(
            "training",
            finalXP,
            `${streak} дн. streak`
        );


        state.previousLoad =
            load;


        saveData();

        updateHome();

    }


    /* =========================================
       DEVELOPMENT ACTION
    ========================================= */

    function registerDevelopment(
        itemId
    ) {

        const item =
            data.development.find(
                function(element) {

                    return (
                        element.id ===
                        itemId
                    );

                }
            );


        if (!item) {

            return;

        }


        const value =
            Number(
                item.current
            ) || 0;


        if (value <= 0) {

            showToast(
                "Сначала укажи выполненное значение"
            );

            return;

        }


        const state =
            data.categories.development;


        const streak =
            updateStreak(
                "development"
            );


        const multiplier =
            streakMultiplier(
                streak
            );


        const completion =
            Math.min(
                1,
                value /
                Math.max(
                    1,
                    Number(
                        item.target
                    ) || 1
                )
            );


        const xp =
            Math.round(
                ECONOMY.development.actionXP *
                completion *
                multiplier
            );


        addXP(
            "development",
            Math.min(
                ECONOMY.development.maxActionXP,
                xp
            ),
            `${streak} дн. streak`
        );


        saveData();

    }


    /* =========================================
       CATEGORY PROGRESS
       ========================================= */

    function totalProgress() {

        const categories =
            Object.keys(
                CATEGORY_META
            );


        const total =
            categories.reduce(
                function(sum, category) {

                    return (
                        sum +
                        categoryProgress(
                            category
                        )
                    );

                },
                0
            );


        return Math.round(
            total /
            categories.length
        );

    }


    /* =========================================
       UPDATE HOME
       ========================================= */

    function updateHome() {

        const global =
            getGlobalLevelInfo();


        const globalLevel =
            document.getElementById(
                "globalLevel"
            );


        const globalXP =
            document.getElementById(
                "globalXP"
            );


        const globalXPFill =
            document.getElementById(
                "globalXPFill"
            );

            globalLevel.textContent =
                "LVL " +
                global.level;

        }


        if (globalXP) {

            globalXP.textContent =
                formatXP(
                    global.remaining
                ) +
                " / " +
                formatXP(
                    global.required
                ) +
                " XP";

        }


        if (globalXPFill) {

            globalXPFill.style.width =
                global.percent + "%";

        }


        const total =
            totalProgress();


        const overallValue =
            document.getElementById(
                "overallValue"
            );


        const overallFill =
            document.getElementById(
                "overallFill"
            );


        if (overallValue) {

            overallValue.innerHTML =
                total +
                "<span>%</span>";

        }


        if (overallFill) {

            overallFill.style.width =
                total + "%";

        }


        Object.keys(
            CATEGORY_META
        ).forEach(
            function(category) {

                const value =
                    categoryProgress(
                        category
                    );


                const level =
                    getCategoryLevelInfo(
                        category
                    ).level;


                const percent =
                    document.getElementById(
                        "homePercent" +
                        capitalize(category)
                    );


                const fill =
                    document.getElementById(
                        "homeFill" +
                        capitalize(category)
                    );


                const levelElement =
                    document.getElementById(
                        "homeLevel" +
                        capitalize(category)
                    );


                if (percent) {

                    percent.textContent =
                        value + "%";

                }


                if (fill) {

                    fill.style.width =
                        value + "%";

                }


                if (levelElement) {

                    levelElement.textContent =
                        "LVL " +
                        level;

                }

            }
        );

    }


    function capitalize(
        value
    ) {

        return (
            value.charAt(0).toUpperCase() +
            value.slice(1)
        );

    }


    /* =========================================
       NAVIGATION
    ========================================= */

    function setupNavigation() {

        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            const section =
                                this.dataset.section;


                            setActiveNav(
                                section
                            );


                            if (
                                section ===
                                "home"
                            ) {

                                closeCategory();

                                updateHome();

                            } else {

                                openCategory(
                                    section
                                );

                            }

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                ".category-card"
            )
            .forEach(
                function(card) {

                    card.addEventListener(
                        "click",
                        function() {

                            openCategory(
                                this.dataset.category
                            );

                        }
                    );

                }
            );

    }


    function setActiveNav(
        section
    ) {

        document
            .querySelectorAll(
                ".nav-item"
            )
            .forEach(
                function(button) {

                    button.classList.toggle(
                        "active",
                        button.dataset.section ===
                        section
                    );

                }
            );

    }

    ) {

        ) {

            return;

        }


        closeCategory();


        const page =
            document.createElement(
                "div"
            );


        page.className =
            "category-page";


        if (

        );

            "page-open"
        );


        bindCategoryPage(

        );

    /* =========================================
       PAGE EVENTS
    ========================================= */

    function bindCategoryPage(
        page,
        category
    ) {

        const backButton =
            page.querySelector(
                ".back-button"
            );


        if (backButton) {

            backButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();
                    event.stopPropagation();


                    closeCategory();

                    updateHome();

                    setActiveNav(
                        "home"
                    );

                }
            );

        }


        /*
         * Finance
         */

        if (
            category ===
            "finance"
        ) {

            const addButton =
                page.querySelector(
                    ".add-expense-button"
                );


            if (addButton) {

                addButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();
                        event.stopPropagation();

                        openExpenseEditor();

                    }
                );

            }


            page
                .querySelectorAll(
                    ".expense-edit"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            function(event) {

                                event.preventDefault();
                                event.stopPropagation();


                                openExpenseEditor(
                                    this.dataset.expense
                                );

                            }
                        );

                    }
                );


            page
                .querySelectorAll(
                    ".expense-delete"
                )
                .forEach(
                    function(button) {

                        button.addEventListener(
                            "click",
                            function(event) {

                                event.preventDefault();
                                event.stopPropagation();


                                deleteExpense(
                                    this.dataset.expense
                                );

                            }
                        );

                    }
                );


            const simulator =
                page.querySelector(
                    "[data-action='simulator']"
                );


            if (simulator) {

                simulator.addEventListener(
                    "click",
                    function() {

                        openFinanceSimulator();

                    }
                );

            }

        }


        /*
         * Metric editing
         */

        page
            .querySelectorAll(
                ".metric-edit"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();
                            event.stopPropagation();


                            openEditor(
                                category,
                                this.dataset.edit
                            );

                        }
                    );

                }
            );

    }


    /* =========================================
       STANDARD EDITOR
    ========================================= */

    function openEditor(
        category,
        id
    ) {

        const item =
            data[category].find(
                function(element) {

                    return (
                        element.id ===
                        id
                    );

                }
            );


        if (!item) {

            return;

        }


        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "editor-overlay";


        overlay.innerHTML = `

            <div class="editor">

                <button
                    class="editor-close"
                    type="button"
                >
                    ×
                </button>


                <div class="editor-icon">
                    ${item.icon}
                </div>


                <div class="editor-eyebrow">
                    EDIT GOAL
                </div>


                <h3>
                    ${escapeHTML(
                        item.name
                    )}
                </h3>


                <label>
                    Текущее значение
                </label>


                <input
                    class="current-input"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    value="${item.current}"
                >


                <label>
                    Цель
                </label>


                <input
                    class="target-input"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    value="${item.target}"
                >


                <div class="editor-preview">

                    <span>
                        ПРОГРЕСС
                    </span>

                    <strong
                        class="editor-progress"
                    >
                        ${progress(
                            item.current,
                            item.target
                        )}%
                    </strong>

                </div>


                <button
                    class="save-button"
                    type="button"
                >
                    СОХРАНИТЬ
                </button>


                ${
                    (
                        category !== "finance" &&
                        category !== "training"
                    )
                        ? `
                            <button
                                class="secondary-button"
                                type="button"
                                data-complete="1"
                            >
                                + ЗАВЕРШИТЬ ДЕЙСТВИЕ И ПОЛУЧИТЬ XP
                            </button>
                        `
                        : ""
                }

            </div>

        `;


        document.body.appendChild(
            overlay
        );


        const currentInput =
            overlay.querySelector(
                ".current-input"
            );


        const targetInput =
            overlay.querySelector(
                ".target-input"
            );


        const preview =
            overlay.querySelector(
                ".editor-progress"
            );


        function updatePreview() {

            preview.textContent =
                progress(
                    currentInput.value,
                    targetInput.value
                ) + "%";

        }


        currentInput.addEventListener(
            "input",
            updatePreview
        );


        targetInput.addEventListener(
            "input",
            updatePreview
        );


        overlay
            .querySelector(
                ".editor-close"
            )
            .addEventListener(
                "click",
                function() {

                    overlay.remove();

                }
            );


        const completeButton =
            overlay.querySelector(
                "[data-complete='1']"
            );


        if (completeButton) {

            completeButton.addEventListener(
                "click",
                function() {

                    item.current =
                        Math.max(
                            0,
                            Number(
                                currentInput.value
                            ) || 0
                        );


                    item.target =
                        Math.max(
                            0,
                            Number(
                                targetInput.value
                            ) || 0
                        );


                    saveData();


                    if (
                        category ===
                        "development"
                    ) {

                        registerDevelopment(
                            item.id
                        );

                    } else {

                        const state =
                            data.categories[
                                category
                            ];


                        const streak =
                            updateStreak(
                                category
                            );


                        const completion =
                            Math.min(
                                1,
                                item.current /
                                Math.max(
                                    1,
                                    item.target
                                )
                            );


                        const config =
                            ECONOMY[
                                category
                            ];


                        const base =
                            Number(
                                config?.actionXP
                            ) || 20;


                        const xp =
                            Math.round(
                                base *
                                completion *
                                streakMultiplier(
                                    streak
                                )
                            );


                        addXP(
                            category,
                            xp,
                            `${streak} дн. streak`
                        );

                    }


                    overlay.remove();

                    openCategory(
                        category
                    );

                    updateHome();

                }
            );

        }


        overlay
            .querySelector(
                ".save-button"
            )
            .addEventListener(
                "click",
                function() {

                    item.current =
                        Math.max(
                            0,
                            Number(
                                currentInput.value
                            ) || 0
                        );


                    item.target =
                        Math.max(
                            0,
                            Number(
                                targetInput.value
                            ) || 0
                        );


                    saveData();


                    overlay.remove();


                    openCategory(
                        category
                    );


                    updateHome();


                    showToast(
                        "Изменения сохранены"
                    );

                }
            );


        overlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            }
        );

    }

                    if (amount <= 0) {

                        showToast(

                    if (expense) {

                    saveExpenses();

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.remove();

                }

            }
        );

    }


    /* =========================================
       UPDATE EXPENSE METRIC
    ========================================= */

    function updateExpenseMetric() {

        const metric =
            data.finance.find(
                function(item) {

                    return (
                        item.id ===
                        "expenses"
                    );

                }
            );


        if (!metric) {

            return;

        }


        metric.current =
            getExpensesTotal();


        metric.target = 0;


        saveData();

    }


    /* =========================================
