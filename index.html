    ========================================= */

    function deleteExpense(
        expenseId
    ) {

        const expense =
            expenses.find(
                function(item) {

                    return (
                        String(item.id) ===
                        String(expenseId)
                    );

                }
            );


        if (!expense) {

            return;

        }


        expenses =
            expenses.filter(
                function(item) {

                    return (
                        String(item.id) !==
                        String(expenseId)
                    );

                }
            );


        saveExpenses();

        updateExpenseMetric();


        openCategory(
            "finance"
        );


        updateHome();


        showToast(
            "Расход удалён"
        );

    }


    /* =========================================
       120 MONTH FINANCE SIMULATOR
       ========================================= */

    function simulateFinance(
        startingIncome,
        expenseRate,
        monthlyGrowth
    ) {

        const months = [];

        let income =
            Number(
                startingIncome
            ) || 0;


        const rate =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(
                        expenseRate
                    ) || 0
                )
            );


        const growth =
            Number(
                monthlyGrowth
            ) || 0;


        let cumulativeXP = 0;

        let previousIncome = 0;

        let simulatedLevel = 1;


        for (
            let month = 1;
            month <= 120;
            month++
        ) {

            const expensesAmount =
                income *
                rate /
                100;


            /*
             * Используем тот же принцип
             * diminishing returns, что и
             * в реальной экономике.
             */

            const decay =
                1 /
                (
                    1 +
                    ECONOMY.finance.levelDecay *
                    Math.pow(
                        Math.max(
                            0,
                            simulatedLevel - 1
                        ),
                        1.18
                    )
                );


            const units =
                income /
                50000;


            let xp =
                ECONOMY.finance.baseXP *
                units *
                decay;


            if (
                previousIncome > 0 &&
                income > previousIncome
            ) {

                const increase =
                    (
                        income -
                        previousIncome
                    ) /
                    previousIncome;


                xp *=
                    1 +
                    Math.min(
                        1.5,
                        increase *
                        ECONOMY.finance.growthBonus
                    );

            }


            const savingsRate =
                income > 0
                    ? Math.max(
                        0,
                        (
                            income -
                            expensesAmount
                        ) /
                        income
                    )
                    : 0;


            xp *=
                1 +
                Math.min(
                    ECONOMY.finance.savingsBonus,
                    savingsRate *
                    ECONOMY.finance.savingsBonus
                );


            xp =
                Math.min(
                    ECONOMY.finance.maxMonthlyXP,
                    Math.max(
                        0,
                        Math.round(xp)
                    )
                );


            cumulativeXP +=
                xp;


            while (
                cumulativeXP >=
                ECONOMY.levelXP(
                    simulatedLevel
                )
            ) {

                cumulativeXP -=
                    ECONOMY.levelXP(
                        simulatedLevel
                    );

                simulatedLevel++;

            }


            months.push({

                month,

                income,

                expenses:
                    expensesAmount,

                savings:
                    income -
                    expensesAmount,

                xp,

                level:
                    simulatedLevel

            });


            previousIncome =
                income;


            income *=
                1 +
                growth /
                100;

        }


        return months;

    }
