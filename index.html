```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>LIFE GAME</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
}

:root{
    --bg:#050505;
    --card:#101010;
    --border:#252525;
    --text:#f5f5f5;
    --muted:#626262;
    --radius:22px
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#050505;
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased
}

body{
    overflow-x:hidden
}

.locked{
    overflow:hidden
}

button,
input{
    font-family:inherit
}

button{
    border:0;
    cursor:pointer
}

button:active{
    transform:scale(.985)
}

.app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    margin:auto;
    padding:24px 18px 155px
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px
}

.eyebrow,
.section-label,
.page-eyebrow{
    color:#606060;
    font-size:8px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase
}

.eyebrow{
    margin-bottom:6px
}

.header h1{
    margin:0;
    font-size:27px;
    line-height:1;
    font-weight:800;
    letter-spacing:-1.2px
}

.avatar{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #2c2c2c;
    border-radius:50%;
    background:linear-gradient(145deg,#292929,#0b0b0b);
    font-size:14px;
    font-weight:800;
    box-shadow:
        0 12px 30px #0007,
        inset 0 1px #ffffff14
}

.hero{
    padding:22px;
    margin-bottom:25px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,#161616,#0a0a0a);
    box-shadow:
        0 25px 65px #0006,
        inset 0 1px #ffffff09
}

.hero-top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between
}

.label{
    display:block;
    margin-bottom:6px;
    color:#626262;
    font-size:8px;
    font-weight:700;
    letter-spacing:2px
}

.level{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px
}

.xp{
    color:#909090;
    font-size:11px;
    font-weight:700
}

.bar{
    height:4px;
    margin-top:18px;
    background:#242424;
    border-radius:20px;
    overflow:hidden
}

.fill{
    height:100%;
    width:0;
    border-radius:inherit;
    background:linear-gradient(90deg,#777,#fff);
    transition:width .65s cubic-bezier(.2,.8,.2,1)
}

.hero-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    color:#646464;
    font-size:9px;
    font-weight:600
}

.life{
    margin-bottom:25px
}

.life-number{
    font-size:58px;
    font-weight:800;
    line-height:.95;
    letter-spacing:-4px;
    margin:7px 0 12px
}

.life-number span{
    font-size:27px;
    color:#777;
    letter-spacing:-1px
}

.life-bar{
    height:3px;
    background:#1c1c1c;
    border-radius:20px;
    overflow:hidden
}

.categories{
    display:flex;
    flex-direction:column;
    gap:12px
}

.category{
    padding:19px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,#131313,#0a0a0a);
    box-shadow:
        0 16px 40px #0004,
        inset 0 1px #ffffff06
}

.category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px
}

.category-title{
    display:flex;
    align-items:center;
    gap:12px
}

.icon{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:14px;
    background:linear-gradient(145deg,#1b1b1b,#111);
    font-size:19px
}

.category-name strong{
    display:block;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px
}

.category-name span{
    display:block;
    margin-top:6px;
    color:#606060;
    font-size:9px;
    font-weight:600
}

.percent{
    font-size:20px;
    font-weight:800
}

.progress{
    height:4px;
    background:#222;
    border-radius:20px;
    overflow:hidden
}

.progress i{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg,#777,#f5f5f5);
    border-radius:inherit;
    transition:width .65s cubic-bezier(.2,.8,.2,1)
}

.quest{
    width:100%;
    height:58px;
    margin-top:18px;
    border:1px solid #303030;
    border-radius:18px;
    background:linear-gradient(145deg,#eee,#bdbdbd);
    color:#080808;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px
}

.creator{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:42px;
    margin-top:16px;
    border:1px solid #202020;
    border-radius:14px;
    background:#0b0b0b;
    color:#686868;
    text-decoration:none;
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    transition:.2s ease
}

.creator strong{
    color:#aaa;
    font-weight:800
}

.creator:active{
    transform:scale(.985);
    background:#111
}

/* NAV */

.nav{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:530px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5px 6px;
    z-index:100;
    border:1px solid #242424;
    border-radius:23px;
    background:rgba(14,14,14,.96)!important;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:0 20px 50px rgba(0,0,0,.65)!important
}

.nav button{
    min-width:58px;
    height:55px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border-radius:16px;
    background:transparent!important;
    color:#555!important;
    -webkit-appearance:none!important;
    appearance:none!important
}

.nav button.active{
    color:#fff!important;
    background:rgba(255,255,255,.055)!important
}

.nav button:focus,
.nav button:focus-visible{
    outline:none!important;
    box-shadow:none!important
}

.nav-icon{
    font-size:17px;
    line-height:1
}

.nav-label{
    font-size:7px;
    font-weight:600
}

/* PAGES */

.page{
    position:fixed;
    inset:0;
    z-index:200;
    overflow-y:auto;
    padding:24px 18px 155px;
    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff12,
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #080808,
            #050505 60%,
            #030303
        );
    animation:pageIn .22s ease
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(10px)
    }
    to{
        opacity:1;
        transform:translateY(0)
    }
}

.page-inner{
    max-width:560px;
    margin:auto
}

.page-head{
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:22px
}

.back{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:14px;
    background:#111;
    color:#fff;
    font-size:20px
}

.page h2{
    margin:0;
    font-size:25px;
    font-weight:800;
    letter-spacing:-.8px
}

.summary{
    padding:21px;
    margin-bottom:14px;
    border:1px solid #242424;
    border-radius:22px;
    background:linear-gradient(145deg,#151515,#0c0c0c);
    box-shadow:0 20px 50px #0006
}

.summary-number{
    font-size:45px;
    font-weight:800;
    line-height:1;
    letter-spacing:-3px;
    margin:8px 0 15px
}

.cards{
    display:flex;
    flex-direction:column;
    gap:11px
}

.metric{
    padding:18px;
    border:1px solid #222;
    border-radius:20px;
    background:linear-gradient(145deg,#121212,#0a0a0a);
    box-shadow:0 14px 35px #0004
}

.metric-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px
}

.metric-left{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0
}

.metric-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border:1px solid #292929;
    border-radius:13px;
    background:#171717;
    font-size:18px
}

.metric-text strong{
    display:block;
    font-size:12px;
    font-weight:750;
    line-height:1.2
}

.metric-text span{
    display:block;
    margin-top:5px;
    color:#666;
    font-size:9px;
    line-height:1.25
}

.metric-percent{
    font-size:19px;
    font-weight:800;
    white-space:nowrap
}

.metric-bar{
    height:3px;
    margin-bottom:14px;
    background:#202020;
    border-radius:20px;
    overflow:hidden
}

.metric-bar i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#666,#eee);
    border-radius:inherit
}

.edit,
.add{
    width:100%;
    height:38px;
    border:1px solid #292929;
    border-radius:12px;
    background:#111;
    color:#8d8d8d;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.5px
}

.finance-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #222
}

.finance-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px
}

.finance-line:last-child{
    margin-bottom:0
}

.finance-line span{
    color:#666;
    font-size:8px;
    font-weight:700;
    letter-spacing:1.5px
}

.finance-line strong{
    font-size:13px;
    font-weight:800
}

/* EXPENSES */

.expenses{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #222
}

.expenses-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    margin-bottom:11px;
    padding:0;
    cursor:pointer;
    user-select:none;
    -webkit-appearance:none;
    appearance:none;
    border:0;
    color:inherit;
    background:transparent
}

.expenses-title:active{
    transform:none
}

.expenses-title-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0
}

.expenses-title span{
    color:#777;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.6px
}

.expenses-title strong{
    font-size:12px;
    font-weight:800
}

.collapse-chevron{
    display:none!important
}

.expenses.collapsed .collapse-chevron{
    display:none!important
}

.expense-content{
    overflow:hidden;
    max-height:900px;
    transition:
        max-height .28s cubic-bezier(.2,.8,.2,1),
        opacity .18s ease
}

.expenses.collapsed .expense-content{
    max-height:0;
    opacity:0
}

.expense-list{
    display:flex;
    flex-direction:column;
    gap:7px
}

.expense-swipe{
    position:relative;
    overflow:hidden;
    border-radius:13px;
    background:#ff3b30;
    touch-action:pan-y
}

.expense-delete-reveal{
    position:absolute;
    inset:0 0 0 auto;
    width:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ff3b30!important;
    color:#fff;
    font-size:0
}

.expense-delete-reveal::after{
    content:"×";
    font-size:24px;
    font-weight:300;
    line-height:1
}

.expense{
    position:relative;
    z-index:2;
    min-height:47px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px 8px 12px;
    border:1px solid #1f1f1f;
    border-radius:13px;
    background:#0c0c0c;
    transform:translateX(0);
    transition:transform .2s ease;
    will-change:transform
}

.expense.swiped{
    transform:translateX(-76px);
    box-shadow:-8px 0 18px rgba(0,0,0,.18)
}

.expense-info{
    min-width:0
}

.expense-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11px;
    font-weight:600
}

.expense-amount{
    margin-top:3px;
    color:#777;
    font-size:10px;
    font-weight:700
}

.expense-actions{
    display:flex;
    gap:5px
}

.expense-delete{
    display:none!important
}

.small-btn{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #262626;
    border-radius:9px;
    background:#141414;
    color:#777;
    font-size:14px
}

.ratio{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    padding:11px 12px;
    border-radius:12px;
    background:#141414
}

.ratio span{
    color:#666;
    font-size:8px;
    font-weight:700
}

.ratio strong{
    font-size:13px;
    font-weight:800
}

.notice{
    padding:14px;
    margin-top:12px;
    border:1px solid #222;
    border-radius:14px;
    background:#0d0d0d;
    color:#666;
    font-size:9px;
    line-height:1.5
}

/* QUEST */

.quest-card{
    padding:20px;
    border:1px solid #282828;
    border-radius:20px;
    background:linear-gradient(145deg,#171717,#0b0b0b)
}

.quest-item{
    padding:14px;
    margin-top:9px;
    border:1px solid #222;
    border-radius:14px;
    background:#0d0d0d
}

.quest-item:first-child{
    margin-top:0
}

.quest-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
}

.quest-title{
    font-size:11px;
    font-weight:700
}

.quest-xp{
    font-size:10px;
    color:#aaa;
    font-weight:800
}

.complete{
    width:100%;
    height:37px;
    margin-top:10px;
    border:1px solid #292929;
    border-radius:11px;
    background:#151515;
    color:#bbb;
    font-size:8px;
    font-weight:800;
    letter-spacing:1px
}

.complete.done{
    background:#eee;
    color:#080808
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:14px;
    background:#000bd;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    animation:fade .18s ease
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

.modal{
    position:relative;
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    padding:25px 20px 21px;
    border:1px solid #292929;
    border-radius:26px 26px 20px 20px;
    background:linear-gradient(145deg,#171717,#0b0b0b);
    box-shadow:0 -10px 60px #0009;
    animation:modalIn .22s cubic-bezier(.2,.8,.2,1)
}

@keyframes modalIn{
    from{transform:translateY(25px)}
    to{transform:translateY(0)}
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:34px;
    height:34px;
    border:1px solid #292929;
    border-radius:50%;
    background:#111;
    color:#777;
    font-size:20px
}

.modal-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    border:1px solid #2a2a2a;
    border-radius:15px;
    background:#191919;
    font-size:21px
}

.modal-label{
    margin-bottom:5px;
    color:#606060;
    font-size:8px;
    font-weight:800;
    letter-spacing:2px
}

.modal h3{
    margin:0 0 21px;
    padding-right:40px;
    font-size:21px;
    line-height:1.1;
    font-weight:800
}

.modal label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font-size:9px;
    font-weight:600
}

.modal input{
    width:100%;
    height:50px;
    margin-bottom:14px;
    padding:0 15px;
    border:1px solid #292929;
    border-radius:14px;
    outline:none;
    background:#0d0d0d;
    color:#f5f5f5;
    font-size:16px;
    font-weight:600
}

.modal input:focus{
    border-color:#555;
    background:#111
}

.modal-preview{
    display:flex;
    justify-content:space-between;
    padding:13px;
    margin:3px 0 16px;
    border:1px solid #242424;
    border-radius:14px;
    background:#0d0d0d
}

.modal-preview span{
    color:#666;
    font-size:9px;
    font-weight:600
}

.modal-preview strong{
    font-size:16px
}

.primary{
    width:100%;
    height:52px;
    border-radius:15px;
    background:linear-gradient(145deg,#f1f1f1,#bdbdbd);
    color:#080808;
    font-size:9px;
    font-weight:900;
    letter-spacing:2px
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    z-index:1000;
    transform:translate(-50%,10px);
    padding:12px 18px;
    border:1px solid #303030;
    border-radius:14px;
    background:#141414f5;
    color:#fff;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.2s
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0)
}

.training-divider{
    margin:4px 0 2px;
    padding:12px 2px 4px;
    color:#606060;
    font-size:8px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase
}

@media(max-width:360px){

    .app{
        padding-left:14px;
        padding-right:14px
    }

    .header h1{
        font-size:24px
    }

    .life-number{
        font-size:51px
    }

    .category{
        padding:17px
    }

    .nav-label{
        font-size:6px
    }

}

@media(min-width:700px){

    .app{
        padding-top:45px
    }

    .page{
        padding-top:35px
    }

}

</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div>

            <div class="eyebrow">
                YOUR LIFE
            </div>

            <h1>
                LIFE GAME
            </h1>

        </div>

        <div class="avatar">
            B
        </div>

    </header>


    <section class="hero">

        <div class="hero-top">

            <div>

                <span class="label">
                    PLAYER LEVEL
                </span>

                <div
                    class="level"
                    id="playerLevel"
                >
                    LVL 1
                </div>

            </div>

            <div
                class="xp"
                id="playerXP"
            >
                0 XP
            </div>

        </div>


        <div class="bar">

            <div
                class="fill"
                id="playerXPFill"
            ></div>

        </div>


        <div class="hero-bottom">

            <span id="xpNext">
                100 XP TO NEXT LEVEL
            </span>

            <span id="playerRank">
                BEGINNER
            </span>

        </div>

    </section>


    <section class="life">

        <div class="section-label">
            LIFE PROGRESS
        </div>

        <div
            class="life-number"
            id="lifeProgress"
        >
            0<span>%</span>
        </div>

        <div class="life-bar">

            <div
                class="fill"
                id="lifeFill"
            ></div>

        </div>

    </section>


    <main class="categories">

        <article
            class="category"
            data-category="finance"
        >

            <div class="category-head">

                <div class="category-title">

                    <div class="icon">
                        💰
                    </div>

                    <div class="category-name">

                        <strong>
                            FINANCE
                        </strong>

                        <span>
                            Финансы
                        </span>

                    </div>

                </div>

                <div
                    class="percent"
                    id="financePercent"
                >
                    0%
                </div>

            </div>

            <div class="progress">

                <i

(function(){

'use strict';


/* =====================================================

const SK='life_game_core_v3';

const UK='life_game_ui_v1';


const META={

    development:{
        icon:'🧠',
        title:'Развитие'
    },

        icon:'❤️',
        title:'Здоровье'
    }

};


const DEFAULT={

    version:3,

    player:{
        xp:0,
        level:1,
        rating:0,
        premiumBonusXP:0
    },

    categories:{

        finance:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            monthlyIncome:0,
            monthlyGoal:100000,
            yearlyGoal:1200000,
            savings:0
        },

        training:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            workouts:0,
            monthlyTarget:12
        },

        development:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            books:0,
            languageMinutes:0,
            meditationMinutes:0
        },

        health:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            routine:0,
            nutrition:0,
            steps:0
        },

        discipline:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            completed:0,
            failed:0
        }

    },

    simulator:{
        currentMonth:1,
        months:120,
        history:[]
    },

    quests:[

        {
            id:'finance_income',
            category:'finance',
            title:'Зафиксировать доход за месяц',
            xp:35,
            done:false
        },

        {
            id:'training',
            category:'training',
            title:'Выполнить тренировку',
            xp:30,
            done:false
        },

        {
            id:'development',
            category:'development',
            title:'30 минут развития',
            xp:25,
            done:false
        },

        {
            id:'health',
            category:'health',
            title:'Выполнить полезную привычку',
            xp:20,
            done:false
        }

    ]

};


const clone=function(o){
    return JSON.parse(JSON.stringify(o));
};


const num=function(v){
    return Number.isFinite(Number(v))
        ? Number(v)
        : 0;
};


const clamp=function(v,a,b){
    return Math.min(
        b,
        Math.max(
            a,
            v
        )
    );
};


const fmt=function(v){
    return new Intl.NumberFormat(
        'ru-RU'
    ).format(
        num(v)
    );
};


const esc=function(v){

    return String(v).replace(
        /[&<>"']/g,
        function(m){

            return {
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'
            }[m];

        }
    );

};


/* =====================================================
   STATE
   ===================================================== */

function normalize(s){

    let r=clone(DEFAULT);

    if(!s || typeof s!=='object'){
        return r;
    }

    if(s.player){

        Object.keys(r.player).forEach(function(k){

            if(s.player[k]!==undefined){

                r.player[k]=Math.max(
                    0,
                    num(s.player[k])
                );

            }

        });

    }


    Object.keys(r.categories).forEach(function(c){

        if(
            s.categories &&
            s.categories[c]
        ){

            Object.keys(
                r.categories[c]
            ).forEach(function(k){

                if(
                    s.categories[c][k]!==undefined
                ){

                    r.categories[c][k]=
                        s.categories[c][k];

                }

            });

        }

    });


    if(Array.isArray(s.quests)){

        r.quests=s.quests.map(function(q){

            return {

                id:String(q.id||''),

                category:String(
                    q.category||'health'
                ),

                title:String(
                    q.title||'Quest'
                ),

                xp:Math.max(
                    0,
                    num(q.xp)
                ),

                done:Boolean(q.done)

            };

        });

    }


    return r;

}


function loadState(){

    try{

        const r=
            localStorage.getItem(SK);

        return r
            ? normalize(JSON.parse(r))
            : clone(DEFAULT);

    }catch(e){

        return clone(DEFAULT);

    }

}


function loadExpenses(){

    try{

        const r=
            JSON.parse(
                localStorage.getItem(
                    EK
                )||'[]'
            );

        return Array.isArray(r)
            ? r.map(function(e){

                return {

                    id:String(
                        e.id ||
                        Date.now()+
                        Math.random()
                    ),

                    name:String(
                        e.name||''
                    ),

                    amount:Math.max(
                        0,
                        num(e.amount)
                    )

                };

            })
            : [];

    }catch(e){

        return [];

    }

}


function loadUI(){

    try{

        const r=
            JSON.parse(
                localStorage.getItem(
                    UK
                )||'{}'
            );

        return {

            expensesCollapsed:
                Boolean(
                    r.expensesCollapsed
                )

        };

    }catch(e){

        return {
            expensesCollapsed:false
        };

    }

}


let state=loadState();
let expenses=loadExpenses();
let ui=loadUI();


function save(){

    localStorage.setItem(
        SK,
        JSON.stringify(state)
    );

    localStorage.setItem(
        EK,
        JSON.stringify(expenses)
    );

    localStorage.setItem(
        UK,
        JSON.stringify(ui)
    );

}


/* =====================================================
   XP
   ===================================================== */

function xpForLevel(l){

    return Math.round(
        100*
        Math.pow(
            Math.max(
                1,
                num(l)
            ),
            1.42
        )
    );

}


function levelFromXP(x){

    let l=1;

    while(
        x>=xpForLevel(l+1) &&
        l<10000
    ){

        l++;

    }

    return l;

}


function updateLevels(){

    Object.keys(
        state.categories
    ).forEach(function(c){

        state.categories[c].level=
            levelFromXP(
                Math.max(
                    0,
                    num(
                        state.categories[c].xp
                    )
                )
            );

    });


    state.player.level=
        levelFromXP(
            Math.max(
                0,
                num(
                    state.player.xp
                )
            )
        );

}


function addPlayerXP(a){

    state.player.xp=
        Math.max(
            0,
            num(state.player.xp)+
            Math.round(num(a))
        );

    state.player.level=
        levelFromXP(
            state.player.xp
        );

}


function addCatXP(c,a){

    const v=Math.max(
        0,
        Math.round(num(a))
    );


    if(!state.categories[c]){
        return;
    }


    state.categories[c].xp=
        Math.max(
            0,
            num(
                state.categories[c].xp
            )+
            v
        );


    state.categories[c].level=
        levelFromXP(
            state.categories[c].xp
        );


    addPlayerXP(
        Math.round(v*.65)
    );


    save();

}


function incomeXP(v){

    const level=Math.max(
        1,
        state.categories.finance.level
    );

    return v>0
        ? Math.max(
            1,
            Math.round(
                v/
                50000*
                100/
                Math.pow(
                    level,
                    .72
                )
            )
        )
        : 0;

}


function applyIncome(oldV,newV){

    const d=Math.max(
        0,
        incomeXP(newV)-
        incomeXP(oldV)
    );


    if(d){

        addCatXP(
            'finance',
            d
        );

    }else{

        save();

    }

}


/* =====================================================
   DEVELOPMENT MODULE
   ===================================================== */

function developmentProgress(){

    if(
        window.LifeGameDevelopment &&
        typeof
        window.LifeGameDevelopment.progress===

/* =====================================================
   HEALTH MODULE
   ===================================================== */

function healthProgress(){

    if(
        window.LifeGameHealth &&
        typeof
        window.LifeGameHealth.progress===
        'function'
    ){

        return window.LifeGameHealth.progress(
            state
        );

    }


    const h=
        state.categories.health;


    return Math.round(
        (
            clamp(
                num(h.routine),
                0,
                100
            )+
            clamp(
                num(h.nutrition),
                0,
                100
            )+
            clamp(
                Math.round(
                    num(h.steps)/
                    10000*
                    100
                ),
                0,
                100
            )
        )/3
    );

}


/* =====================================================
   PROGRESS
   ===================================================== */

function progress(c){

    if(c==='finance'){

        if(

            typeof
            window.LifeGameFinance.progress===
            'function'
        ){

            return window.LifeGameFinance.progress(
                state,
                expenses

        }

        return 0;

    }


    if(c==='development'){

        return developmentProgress();

    }


    if(c==='health'){

        return healthProgress();

    }


    return 0;

}


function totalProgress(){

    return Math.round(
        (
            progress('finance')+
            progress('development')+
            progress('health')
        )/3
    );

}


function rank(l){

    return l>=90
        ? 'LEGEND'
        : l>=75
        ? 'ELITE'
        : l>=60
        ? 'MASTER'
        : l>=45
        ? 'VETERAN'
        : l>=30
        ? 'ADVANCED'
        : l>=15
        ? 'PLAYER'

}

/* =====================================================

   ===================================================== */

function bindPage(p,c){

    p.querySelectorAll(
        '[data-edit]'
    ).forEach(function(b){

        b.onclick=function(){

            openEditor(
                c,
                b.dataset.edit
            );

        };

    });


    /* FINANCE */

    if(c==='finance'){

        const toggle=
            p.querySelector(
                '#expensesToggle'
            );


        if(toggle){

            toggle.addEventListener(
                'click',
                function(e){

                    e.stopPropagation();

                    ui.expensesCollapsed=
                        !ui.expensesCollapsed;

                    save();

                    openCategory(
                        'finance'
                    );

                }
            );

        }


        const add=
            p.querySelector(
                '#addExpense'
            );


        if(add){

            add.addEventListener(
                'click',
                function(){

                    openExpense();

                }
            );

        }


        p.querySelectorAll(
            '.expense-edit'
        ).forEach(function(b){

            b.onclick=function(){

                openExpense(
                    b.dataset.id
                );

            };

        });


        swipes(p);

    }


    /* HEALTH */

    if(c==='health'){

        const workout=
            p.querySelector(
                '#completeWorkout'
            );


        if(workout){

            workout.addEventListener(
                'click',
                function(){

                    const t=
                        state.categories.training;


                    const base=
                        Math.max(
                            5,
                            Math.round(
                                80/
                                Math.pow(
                                    Math.max(
                                        1,
                                        t.level
                                    ),
                                    .58
                                )
                            )
                        );


                    t.workouts++;

                    t.streak++;


                    t.bestStreak=
                        Math.max(
                            t.bestStreak,
                            t.streak
                        );


                    const q=
                        Math.round(
                            base*
                            (
                                1+
                                t.streak*.08
                            )
                        );


                    addCatXP(
                        'training',
                        q
                    );


                    const h=
                        state.categories.health;


                    h.streak++;


                    h.bestStreak=
                        Math.max(
                            h.bestStreak,
                            h.streak
                        );


                    save();


                    toast(
                        'Тренировка выполнена · +'+
                        q+
                        ' XP'
                    );


                    openCategory(
                        'health'
                    );

                    renderHome();

                }
            );

        }

    }

}


/* =====================================================
   SWIPE DELETE
   ===================================================== */

function swipes(p){

    p.querySelectorAll(
        '.expense-swipe'
    ).forEach(function(w){

        const r=
            w.querySelector(
                '.expense'
            );


        if(!r)
            return;


        let sx=0;
        let sy=0;
        let dx=0;
        let drag=false;

        const reveal=82;


        function closeRow(){

            r.style.transition=
                'transform .22s cubic-bezier(.2,.8,.2,1)';

            r.style.transform=
                'translateX(0)';

            r.classList.remove(
                'swiped'
            );

            dx=0;

        }


        function openRow(){

            r.style.transition=
                'transform .22s cubic-bezier(.2,.8,.2,1)';

            r.style.transform=
                'translateX(-'+
                reveal+
                'px)';

            r.classList.add(
                'swiped'
            );

            dx=-reveal;

        }


        r.addEventListener(
            'touchstart',
            function(e){

                if(
                    e.touches.length!==1
                )
                    return;


                sx=
                    e.touches[0].clientX;

                sy=
                    e.touches[0].clientY;


                dx=
                    r.classList.contains(
                        'swiped'
                    )
                    ? -reveal
                    : 0;


                drag=true;

                r.style.transition=
                    'none';

            },
            {
                passive:true
            }
        );


        r.addEventListener(
            'touchmove',
            function(e){

                if(
                    !drag ||
                    e.touches.length!==1
                )
                    return;


                const x=
                    e.touches[0].clientX-
                    sx;

                const y=
                    e.touches[0].clientY-
                    sy;


                if(
                    Math.abs(y)>
                    Math.abs(x) &&
                    Math.abs(y)>8
                ){

                    drag=false;

                    r.style.transition='';

                    return;

                }


                const base=
                    r.classList.contains(
                        'swiped'
                    )
                    ? -reveal
                    : 0;


                const next=
                    Math.min(
                        0,
                        Math.max(
                            -reveal,
                            base+x
                        )
                    );


                dx=next;


                r.style.transform=
                    'translateX('+
                    next+
                    'px)';

            },
            {
                passive:true
            }
        );


        r.addEventListener(
            'touchend',
            function(){

                if(!drag)
                    return;


                drag=false;

                r.style.transition='';


                if(
                    dx<=-reveal*.45
                ){

                    openRow();

                }else{

                    closeRow();

                }

            }
        );


        r.addEventListener(
            'touchcancel',
            function(){

                drag=false;

                closeRow();

            }
        );


        const deleteReveal=
            w.querySelector(
                '.expense-delete-reveal'
            );


        if(deleteReveal){

            deleteReveal.addEventListener(
                'click',
                function(){

                    if(
                        r.classList.contains(
                            'swiped'
                        )
                    ){

                        deleteExpense(
                            w.dataset.swipeId
                        );

                    }

                }
            );

        }


        r.querySelectorAll(
            'button'
        ).forEach(function(btn){

            btn.addEventListener(
                'click',
                function(e){

                    e.stopPropagation();

                }
            );

        });

    });

}

/* =====================================================
   EXPENSE
   ===================================================== */

function openExpense(id){

    const e=
        expenses.find(function(x){

            return String(x.id)===
                String(id);

        });


    modal(`

        <div class="modal-icon">
            📉
        </div>

        <div class="modal-label">
            ${
                e
                    ? 'EDIT EXPENSE'
                    : 'NEW EXPENSE'
            }
        </div>

        <h3>
            ${
                e
                    ? 'Изменить расход'
                    : 'Добавить расход'
            }
        </h3>

        <label>
            Название
        </label>

        <input
            id="name"
            type="text"
            maxlength="60"
            placeholder="Например: Аренда"
            value="${
                e
                    ? esc(e.name)
                    : ''
            }"
        >

        <label>
            Сумма
        </label>

        <input
            id="amount"
            type="number"
            inputmode="decimal"
            min="0"
            value="${
                e
                    ? e.amount
                    : ''
            }"
        >

        <button
            class="primary"
            id="save"
        >
            СОХРАНИТЬ
        </button>

    `);


    const o=
        document.querySelector(
            '.overlay'
        );


    o.querySelector(
        '#save'
    ).onclick=function(){

        const n=
            o.querySelector(
                '#name'
            ).value.trim();


        const a=
            Math.max(
                0,
                num(
                    o.querySelector(
                        '#amount'
                    ).value
                )
            );


        if(!n){

            toast(
                'Введите название расхода'
            );

            return;

        }


        if(a<=0){

            toast(
                'Введите сумму расхода'
            );

            return;

        }


        if(e){

            e.name=n;
            e.amount=a;

        }else{

            expenses.push({

                id:
                    Date.now()
                    .toString(),

                name:n,

                amount:a

            });

        }


        save();

        closeModal();

        renderHome();

        openCategory(
            'finance'
        );

        toast(
            'Расход сохранён'
        );

    };

}


/* =====================================================
   DELETE EXPENSE
   ===================================================== */

function deleteExpense(id){

    expenses=
        expenses.filter(function(e){

            return String(e.id)!==
                String(id);

        });


    save();

    renderHome();

    openCategory(
        'finance'
    );

    toast(
        'Расход удалён'
    );

}


/* =====================================================
   MODAL
   ===================================================== */

function modal(content){

    closeModal();


    const o=
        document.createElement(
            'div'
        );


    o.className='overlay';


    o.innerHTML=`

        <div class="modal">

            <button class="close">
                ×
            </button>

            ${content}

        </div>

    `;


    document.body.appendChild(o);


    document.body.classList.add(
        'locked'
    );


    o.querySelector(
        '.close'
    ).onclick=
        closeModal;


    o.onclick=function(e){

        if(
            e.target===o
        ){

            closeModal();

        }

    };

}


function closeModal(){

    document.querySelector(
        '.overlay'
    )?.remove();


    if(
        !document.getElementById(
            'activePage'
        )
    ){

        document.body.classList.remove(
            'locked'
        );

    }

}


function closePage(){

    document.getElementById(
        'activePage'
    )?.remove();


    if(
        !document.querySelector(
            '.overlay'
        )
    ){

        document.body.classList.remove(
            'locked'
        );

    }

}


function setHome(){

    document.querySelectorAll(
        '[data-nav]'
    ).forEach(function(b){

        b.classList.toggle(
            'active',
            b.dataset.nav==='home'
        );

    });

}


/* =====================================================
   TOAST
   ===================================================== */

let tt;


function toast(m){

    let t=
        document.querySelector(
            '.toast'
        );


    if(t)
        t.remove();


    t=
        document.createElement(
            'div'
        );


    t.className='toast';

    t.textContent=m;


    document.body.appendChild(t);


    requestAnimationFrame(function(){

        t.classList.add(
            'show'
        );

    });


    clearTimeout(tt);


    tt=setTimeout(function(){

        t.classList.remove(
            'show'
        );


        setTimeout(function(){

            t.remove();

        },220);

    },1800);

}


/* =====================================================
   DAILY QUESTS
   ===================================================== */

function quests(){

    closePage();


    const p=
        document.createElement(
            'div'
        );


    p.className='page';
    p.id='activePage';


    p.innerHTML=`

        <div class="page-inner">

            <div class="page-head">

                <button class="back">
                    ←
                </button>

                <div>

                    <div class="page-eyebrow">
                        LIFE GAME
                    </div>

                    <h2>
                        ⚡ Daily Quest
                    </h2>

                </div>

            </div>


            <div class="quest-card">

                <div class="section-label">
                    TODAY'S QUESTS
                </div>

                ${
                    state.quests
                        .map(function(q,i){

                            return `

                                <div
                                    class="quest-item"
                                >

                                    <div
                                        class="quest-row"
                                    >

                                        <div
                                            class="quest-title"
                                        >
                                            ${esc(q.title)}
                                        </div>

                                        <div
                                            class="quest-xp"
                                        >
                                            +${q.xp} XP
                                        </div>

                                    </div>


                                    <button
                                        class="complete ${
                                            q.done
                                                ? 'done'
                                                : ''
                                        }"
                                        data-q="${i}"
                                    >

                                        ${
                                            q.done
                                                ? '✓ ВЫПОЛНЕНО'
                                                : 'ВЫПОЛНИТЬ'
                                        }

                                    </button>

                                </div>

                            `;

                        })
                        .join('')
                }

            </div>


            ${creatorHTML()}

        </div>

    `;


    document.body.appendChild(p);

    document.body.classList.add(
        'locked'
    );


    p.querySelector(
        '.back'
    ).onclick=function(){

        closePage();

        setHome();

    };


    p.querySelectorAll(
        '[data-q]'
    ).forEach(function(b){

        b.onclick=function(){

            const q=
                state.quests[
                    num(
                        b.dataset.q
                    )
                ];


            if(
                !q ||
                q.done
            )
                return;


            q.done=true;


            let category=
                q.category;


            if(
                !state.categories[category]
            ){

                category='health';

            }


            const x=
                state.categories[
                    category
                ];


            x.streak++;


            x.bestStreak=
                Math.max(
                    x.bestStreak,
                    x.streak
                );


            const a=
                Math.round(
                    q.xp*
                    (
                        1+
                        x.streak*.08
                    )
                );


            addCatXP(
                category,
                a
            );


            state.player.rating++;


            save();


            toast(
                'Quest выполнен · +'+
                a+
                ' XP'
            );


            quests();

            renderHome();

        };

    });

}


/* =====================================================
   HOME
   ===================================================== */

function renderHome(){

    updateLevels();


    document.getElementById(
        'playerLevel'
    ).textContent=
        'LVL '+
        state.player.level;


    document.getElementById(
        'playerXP'
    ).textContent=
        fmt(
            state.player.xp
        )+
        ' XP';


    const cur=
        xpForLevel(
            state.player.level
        );


    const next=
        xpForLevel(
            state.player.level+1
        );


    document.getElementById(
        'playerXPFill'
    ).style.width=
        clamp(
            (
                state.player.xp-cur
            )/
            Math.max(
                1,
                next-cur
            )*
            100,
            0,
            100
        )+
        '%';


    document.getElementById(
        'xpNext'
    ).textContent=
        fmt(
            Math.max(
                0,
                next-state.player.xp
            )
        )+
        ' XP TO NEXT LEVEL';


    document.getElementById(
        'playerRank'
    ).textContent=
        rank(
            state.player.level
        );


    const total=
        totalProgress();


    document.getElementById(
        'lifeProgress'
    ).innerHTML=
        total+
        '<span>%</span>';


    document.getElementById(
        'lifeFill'
    ).style.width=
        clamp(
            total,
            0,
            100
        )+
        '%';


    [
        'finance',
        'development',
        'health'
    ].forEach(function(c){

        const p=
            progress(c);


        document.getElementById(
            c+'Percent'
        ).textContent=
            p+
            '%';


        document.getElementById(
            c+'Fill'
        ).style.width=
            clamp(
                p,
                0,
                100
            )+
            '%';

    });

}

    b.onclick=function(){

updateLevels();

);
