<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>LIFE GAME</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#050505;
    --bg2:#090909;
    --card:#101010;
    --card2:#151515;
    --border:#252525;
    --border2:#303030;
    --text:#f5f5f5;
    --soft:#a0a0a0;
    --muted:#626262;
    --white:#fff;
    --danger:#a8a8a8;
    --radius:22px;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#050505;
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        "Helvetica Neue",
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

body{
    overflow-x:hidden;
}

body.locked{
    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:active{
    transform:scale(.985);
}

.app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    margin:auto;
    padding:24px 18px 115px;
}

/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}

.eyebrow,
.section-label,
.page-eyebrow{
    color:#606060;
    font-size:8px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

.eyebrow{
    margin-bottom:6px;
}

.header h1{
    margin:0;
    font-size:27px;
    line-height:1;
    font-weight:800;
    letter-spacing:-1.2px;
}

.avatar{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #2c2c2c;
    border-radius:50%;
    background:linear-gradient(145deg,#292929,#0b0b0b);
    font-size:14px;
    font-weight:800;
    box-shadow:
        0 12px 30px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
}

/* =========================
   HERO
========================= */

.hero{
    padding:22px;
    margin-bottom:25px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,#161616,#0a0a0a);
    box-shadow:
        0 25px 65px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.035);
}

.hero-top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
}

.label{
    display:block;
    margin-bottom:6px;
    color:#626262;
    font-size:8px;
    font-weight:700;
    letter-spacing:2px;
}

.level{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.xp{
    color:#909090;
    font-size:11px;
    font-weight:700;
}

.bar{
    height:4px;
    margin-top:18px;
    background:#242424;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0;
    border-radius:inherit;
    background:linear-gradient(90deg,#777,#fff);
    transition:
        width .65s cubic-bezier(.2,.8,.2,1);
}

.hero-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    color:#646464;
    font-size:9px;
    font-weight:600;
}

/* =========================
   LIFE
========================= */

.life{
    margin-bottom:25px;
}

.life-number{
    font-size:58px;
    font-weight:800;
    line-height:.95;
    letter-spacing:-4px;
    margin:7px 0 12px;
}

.life-number span{
    font-size:27px;
    color:#777;
    letter-spacing:-1px;
}

.life-bar{
    height:3px;
    background:#1c1c1c;
    border-radius:20px;
    overflow:hidden;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.category{
    padding:19px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg,#131313,#0a0a0a);
    box-shadow:
        0 16px 40px rgba(0,0,0,.23),
        inset 0 1px 0 rgba(255,255,255,.025);
    transition:.18s ease;
}

.category:active{
    border-color:#3a3a3a;
}

.category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.category-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:14px;
    background:linear-gradient(145deg,#1b1b1b,#111);
    font-size:19px;
}

.category-name strong{
    display:block;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
}

.category-name span{
    display:block;
    margin-top:6px;
    color:#606060;
    font-size:9px;
    font-weight:600;
}

.percent{
    font-size:20px;
    font-weight:800;
}

.progress{
    height:4px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.progress i{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg,#777,#f5f5f5);
    border-radius:inherit;
    transition:
        width .65s cubic-bezier(.2,.8,.2,1);
}

/* =========================
   DAILY QUEST BUTTON
========================= */

.quest{
    width:100%;
    height:58px;
    margin-top:18px;
    border:1px solid #303030;
    border-radius:18px;
    background:linear-gradient(145deg,#eee,#bdbdbd);
    color:#080808;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
}

/* =========================
   NAVIGATION
========================= */

.nav{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:530px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5px 6px;
    z-index:100;
    border:1px solid #242424;
    border-radius:23px;
    background:rgba(14,14,14,.94);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:0 20px 50px rgba(0,0,0,.65);
}

.nav button{
    min-width:58px;
    height:55px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border-radius:16px;
    background:transparent;
    color:#555;
}

.nav button.active{
    color:#fff;
    background:rgba(255,255,255,.055);
}

.nav-icon{
    font-size:17px;
    line-height:1;
}

.nav-label{
    font-size:7px;
    font-weight:600;
}

/* =========================
   PAGES
========================= */

.page{
    position:fixed;
    inset:0;
    z-index:200;
    overflow-y:auto;
    padding:24px 18px 120px;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.07),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #080808,
            #050505 60%,
            #030303
        );
    animation:pageIn .22s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.page-inner{
    max-width:560px;
    margin:auto;
}

.page-head{
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:22px;
}

.back{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:14px;
    background:#111;
    color:#fff;
    font-size:20px;
}

.page h2{
    margin:0;
    font-size:25px;
    font-weight:800;
    letter-spacing:-.8px;
}

/* =========================
   SUMMARY
========================= */

.summary{
    padding:21px;
    margin-bottom:14px;
    border:1px solid #242424;
    border-radius:22px;
    background:linear-gradient(145deg,#151515,#0c0c0c);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.summary-number{
    font-size:45px;
    font-weight:800;
    line-height:1;
    letter-spacing:-3px;
    margin:8px 0 15px;
}

.cards{
    display:flex;
    flex-direction:column;
    gap:11px;
}

/* =========================
   METRIC
========================= */

.metric{
    padding:18px;
    border:1px solid #222;
    border-radius:20px;
    background:linear-gradient(145deg,#121212,#0a0a0a);
    box-shadow:0 14px 35px rgba(0,0,0,.22);
}

.metric-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.metric-left{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.metric-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border:1px solid #292929;
    border-radius:13px;
    background:#171717;
    font-size:18px;
}

.metric-text strong{
    display:block;
    font-size:12px;
    font-weight:750;
    line-height:1.2;
}

.metric-text span{
    display:block;
    margin-top:5px;
    color:#666;
    font-size:9px;
    line-height:1.25;
}

.metric-percent{
    font-size:19px;
    font-weight:800;
    white-space:nowrap;
}

.metric-bar{
    height:3px;
    margin-bottom:14px;
    background:#202020;
    border-radius:20px;
    overflow:hidden;
}

.metric-bar i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#666,#eee);
    border-radius:inherit;
}

.edit{
    width:100%;
    height:38px;
    border:1px solid #292929;
    border-radius:12px;
    background:#111;
    color:#8d8d8d;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.5px;
}

.edit:active{
    background:#191919;
}

/* =========================
   FINANCE
========================= */

.finance-box{
    margin-top:14px;
    padding-top:15px;
    border-top:1px solid #222;
}

.finance-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}

.finance-line span{
    color:#666;
    font-size:8px;
    font-weight:700;
    letter-spacing:1.5px;
}

.finance-line strong{
    font-size:13px;
    font-weight:800;
}

.expenses{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #222;
}

.expenses-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:11px;
}

.expenses-title span{
    color:#777;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.6px;
}

.expense-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.expense{
    min-height:47px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px 8px 12px;
    border:1px solid #1f1f1f;
    border-radius:13px;
    background:#0c0c0c;
}

.expense-info{
    min-width:0;
}

.expense-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11px;
    font-weight:600;
}

.expense-amount{
    margin-top:3px;
    color:#777;
    font-size:10px;
    font-weight:700;
}

.expense-actions{
    display:flex;
    gap:5px;
}

.small-btn{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #262626;
    border-radius:9px;
    background:#141414;
    color:#777;
    font-size:14px;
}

.small-btn:active{
    background:#1d1d1d;
}

.add{
    width:100%;
    height:42px;
    margin-top:10px;
    border:1px solid #292929;
    border-radius:12px;
    background:#111;
    color:#999;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.4px;
}

.ratio{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    padding:11px 12px;
    border-radius:12px;
    background:#141414;
}

.ratio span{
    color:#666;
    font-size:8px;
    font-weight:700;
}

.ratio strong{
    font-size:13px;
    font-weight:800;
}

/* =========================
   STREAK
========================= */

.streak{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    margin-bottom:12px;
    border:1px solid #242424;
    border-radius:17px;
    background:#0d0d0d;
}

.streak span{
    color:#777;
    font-size:9px;
    font-weight:700;
}

.streak strong{
    font-size:17px;
}

/* =========================
   QUEST PAGE
========================= */

.quest-card{
    padding:20px;
    border:1px solid #282828;
    border-radius:20px;
    background:linear-gradient(145deg,#171717,#0b0b0b);
}

.quest-item{
    padding:14px;
    margin-top:9px;
    border:1px solid #222;
    border-radius:14px;
    background:#0d0d0d;
}

.quest-item:first-child{
    margin-top:0;
}

.quest-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.quest-title{
    font-size:11px;
    font-weight:700;
}

.quest-xp{
    font-size:10px;
    color:#aaa;
    font-weight:800;
}

.complete{
    width:100%;
    height:37px;
    margin-top:10px;
    border:1px solid #292929;
    border-radius:11px;
    background:#151515;
    color:#bbb;
    font-size:8px;
    font-weight:800;
    letter-spacing:1px;
}

.complete.done{
    background:#eee;
    color:#080808;
}

/* =========================
   MODAL
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:14px;
    background:rgba(0,0,0,.74);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    animation:fade .18s ease;
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

.modal{
    position:relative;
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    padding:25px 20px 21px;
    border:1px solid #292929;
    border-radius:26px 26px 20px 20px;
    background:linear-gradient(145deg,#171717,#0b0b0b);
    box-shadow:0 -10px 60px rgba(0,0,0,.55);
    animation:modalIn .22s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalIn{
    from{
        transform:translateY(25px);
    }

    to{
        transform:translateY(0);
    }
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:34px;
    height:34px;
    border:1px solid #292929;
    border-radius:50%;
    background:#111;
    color:#777;
    font-size:20px;
}

.modal-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    border:1px solid #2a2a2a;
    border-radius:15px;
    background:#191919;
    font-size:21px;
}

.modal-label{
    margin-bottom:5px;
    color:#606060;
    font-size:8px;
    font-weight:800;
    letter-spacing:2px;
}

.modal h3{
    margin:0 0 21px;
    padding-right:40px;
    font-size:21px;
    line-height:1.1;
    font-weight:800;
}

.modal label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font-size:9px;
    font-weight:600;
}

.modal input{
    width:100%;
    height:50px;
    margin-bottom:14px;
    padding:0 15px;
    border:1px solid #292929;
    border-radius:14px;
    outline:none;
    background:#0d0d0d;
    color:#f5f5f5;
    font-size:16px;
    font-weight:600;
    -webkit-appearance:none;
    appearance:none;
}

.modal input:focus{
    border-color:#555;
    background:#111;
}

.modal input::placeholder{
    color:#555;
}

.modal-preview{
    display:flex;
    justify-content:space-between;
    padding:13px;
    margin:3px 0 16px;
    border:1px solid #242424;
    border-radius:14px;
    background:#0d0d0d;
}

.modal-preview span{
    color:#666;
    font-size:9px;
    font-weight:600;
}

.modal-preview strong{
    font-size:16px;
}

.primary{
    width:100%;
    height:52px;
    border-radius:15px;
    background:linear-gradient(145deg,#f1f1f1,#bdbdbd);
    color:#080808;
    font-size:9px;
    font-weight:900;
    letter-spacing:2px;
}

.primary:active{
    background:linear-gradient(145deg,#fff,#ccc);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    z-index:1000;
    transform:translate(-50%,10px);
    padding:12px 18px;
    border:1px solid #303030;
    border-radius:14px;
    background:rgba(20,20,20,.96);
    color:#fff;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   NOTICE
========================= */

.notice{
    padding:14px;
    margin-top:12px;
    border:1px solid #222;
    border-radius:14px;
    background:#0d0d0d;
    color:#666;
    font-size:9px;
    line-height:1.5;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:360px){

    .app{
        padding-left:14px;
        padding-right:14px;
    }

    .header h1{
        font-size:24px;
    }

    .life-number{
        font-size:51px;
    }

    .category{
        padding:17px;
    }

    .nav-label{
        font-size:6px;
    }
}

@media(min-width:700px){

    .app{
        padding-top:45px;
    }

    .page{
        padding-top:35px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div>
        <div class="eyebrow">YOUR LIFE</div>
        <h1>LIFE GAME</h1>
    </div>

    <div class="avatar" id="avatar">B</div>
</header>

<section class="hero">

    <div class="hero-top">

        <div>
            <span class="label">PLAYER LEVEL</span>
            <div class="level" id="playerLevel">LVL 1</div>
        </div>

        <div class="xp" id="playerXP">0 XP</div>

    </div>

    <div class="bar">
        <div class="fill" id="playerXPFill"></div>
    </div>

    <div class="hero-bottom">
        <span id="xpNext">100 XP TO NEXT LEVEL</span>
        <span id="playerRank">BEGINNER</span>
    </div>

</section>

<section class="life">

    <div class="section-label">LIFE PROGRESS</div>

    <div class="life-number" id="lifeProgress">
        0<span>%</span>
    </div>

    <div class="life-bar">
        <div class="fill" id="lifeFill"></div>
    </div>

</section>

<main class="categories">

    <article class="category" data-category="finance">

        <div class="category-head">

            <div class="category-title">

                <div class="icon">💰</div>

                <div class="category-name">
                    <strong>FINANCE</strong>
                    <span>Финансы</span>
                </div>

            </div>

            <div class="percent" id="financePercent">0%</div>

        </div>

        <div class="progress">
            <i id="financeFill"></i>
        </div>

    </article>

    <article class="category" data-category="training">

        <div class="category-head">

            <div class="category-title">

                <div class="icon">🏋️</div>

                <div class="category-name">
                    <strong>TRAINING</strong>
                    <span>Тренировки</span>
                </div>

            </div>

            <div class="percent" id="trainingPercent">0%</div>

        </div>

        <div class="progress">
            <i id="trainingFill"></i>
        </div>

    </article>

    <article class="category" data-category="development">

        <div class="category-head">

            <div class="category-title">

                <div class="icon">🧠</div>

                <div class="category-name">
                    <strong>DEVELOPMENT</strong>
                    <span>Развитие</span>
                </div>

<script>
(function(){

"use strict";

/* =====================================================
   LIFE GAME ENGINE
===================================================== */

const STORAGE_KEY = "life_game_core_v3";
const EXPENSES_KEY = "life_game_expenses_v3";

const CATEGORY_META = {

    finance:{
        icon:"💰",
        title:"Финансы",
        subtitle:"Управление деньгами"
    },

    training:{
        icon:"🏋️",
        title:"Тренировки",
        subtitle:"Физическая форма"
    },

    development:{
        icon:"🧠",
        title:"Развитие",
        subtitle:"Знания и навыки"
    },

    discipline:{
        icon:"⚡",
        title:"Дисциплина",
        subtitle:"Сила исполнения"
    },

    health:{
        icon:"❤️",
        title:"Здоровье",
        subtitle:"Ежедневное состояние"
    }

};

/* =====================================================
   XP
===================================================== */

const XP = {

    financeBase:100,

    trainingBase:80,

    developmentAction:25,

    disciplineAction:20,

    healthAction:20,

    questBase:35,

    streakMultiplier:0.08,

    penaltyMultiplier:0.25

};

/* =====================================================
   DEFAULT STATE
===================================================== */

const DEFAULT_STATE = {

    version:3,

    player:{
        xp:0,
        level:1,
        rating:0,
        premiumBonusXP:0
    },

    categories:{

        finance:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,

            /*
             * IMPORTANT:
             * The correct property for monthly income
             * is monthlyIncome.
             */
            monthlyIncome:0,

            monthlyGoal:100000,
            yearlyGoal:1200000,
            savings:0
        },

        training:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            workouts:0,
            monthlyTarget:12
        },

        development:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            books:0,
            languageMinutes:0,
            meditationMinutes:0
        },

        discipline:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            completed:0,
            failed:0
        },

        health:{
            xp:0,
            level:1,
            streak:0,
            bestStreak:0,
            routine:0,
            nutrition:0,
            steps:0
        }

    },

    simulator:{
        currentMonth:1,
        months:120,
        history:[]
    },

    quests:[

        {
            id:"finance_income",
            category:"finance",
            title:"Зафиксировать доход за месяц",
            xp:35,
            done:false
        },

        {
            id:"training",
            category:"training",
            title:"Выполнить тренировку",
            xp:30,
            done:false
        },

        {
            id:"development",
            category:"development",
            title:"30 минут развития",
            xp:25,
            done:false
        },

        {
            id:"discipline",
            category:"discipline",
            title:"Закрыть главное дело дня",
            xp:20,
            done:false
        },

        {
            id:"health",
            category:"health",
            title:"Выполнить полезную привычку",
            xp:20,
            done:false
        }

    ]

};

let state = loadState();
let expenses = loadExpenses();

/* =====================================================
   UTILITIES
===================================================== */

function clone(obj){

    return JSON.parse(
        JSON.stringify(obj)
    );

}

function number(value){

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}

function clamp(value,min,max){

    return Math.min(
        max,
        Math.max(min,value)
    );

}

function format(value){

    return new Intl.NumberFormat(
        "ru-RU"
    ).format(
        number(value)
    );

}

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =====================================================
   STORAGE
===================================================== */

function save(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

        localStorage.setItem(
            EXPENSES_KEY,
            JSON.stringify(expenses)
        );

    }catch(error){

        console.error(
            "LIFE GAME SAVE ERROR",
            error
        );

    }

}

function loadState(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(raw){

            return normalizeState(
                JSON.parse(raw)
            );

        }

    }catch(error){

        console.error(
            "LIFE GAME LOAD ERROR",
            error
        );

    }

    return clone(DEFAULT_STATE);

}

function normalizeState(saved){

    const result =
        clone(DEFAULT_STATE);

    if(
        !saved ||
        typeof saved!=="object"
    ){

        return result;

    }

    /* PLAYER */

    if(saved.player){

        result.player.xp =
            Math.max(
                0,
                number(saved.player.xp)
            );

        result.player.level =
            Math.max(
                1,
                number(saved.player.level)
            );

        result.player.rating =
            Math.max(
                0,
                number(saved.player.rating)
            );

        result.player.premiumBonusXP =
            Math.max(
                0,
                number(saved.player.premiumBonusXP)
            );

    }

    /* CATEGORIES */

    Object.keys(
        result.categories
    ).forEach(category=>{

        if(
            saved.categories &&
            saved.categories[category]
        ){

            Object.keys(
                result.categories[category]
            ).forEach(key=>{

                if(
                    saved.categories[category][key]
                    !==undefined
                ){

                    result.categories[category][key] =
                        saved.categories[category][key];

                }

            });

        }

    });

    /*
     * Legacy compatibility.
     *
     * If an older version ever saved "income",
     * migrate it to "monthlyIncome".
     */
    if(
        saved.categories &&
        saved.categories.finance
    ){

        const finance =
            saved.categories.finance;

        if(
            finance.monthlyIncome === undefined &&
            finance.income !== undefined
        ){

            result.categories.finance.monthlyIncome =
                Math.max(
                    0,
                    number(finance.income)
                );

        }

    }

    /* SIMULATOR */

    if(saved.simulator){

        result.simulator.currentMonth =
            Math.max(
                1,
                number(
                    saved.simulator.currentMonth
                )
            );

        result.simulator.months = 120;

        result.simulator.history =
            Array.isArray(
                saved.simulator.history
            )
            ? saved.simulator.history
            : [];

    }

    /* QUESTS */

    if(Array.isArray(saved.quests)){

        result.quests =
            saved.quests.map(q=>({

                id:String(
                    q.id || ""
                ),

                category:String(
                    q.category || "discipline"
                ),

                title:String(
                    q.title || "Quest"
                ),

                xp:Math.max(
                    0,
                    number(q.xp)
                ),

                done:Boolean(q.done)

            }));

    }

    return result;

}

function loadExpenses(){

    try{

        const raw =
            localStorage.getItem(
                EXPENSES_KEY
            );

        if(raw){

            const parsed =
                JSON.parse(raw);

            if(Array.isArray(parsed)){

                return parsed.map(e=>({

                    id:String(
                        e.id ||
                        Date.now()+Math.random()
                    ),

                    name:String(
                        e.name || ""
                    ),

                    amount:Math.max(
                        0,
                        number(e.amount)
                    )

                }));

            }

        }

    }catch(error){

        console.error(
            "EXPENSE LOAD ERROR",
            error
        );

    }

    return [];

}

/* =====================================================
   LEVEL SYSTEM
===================================================== */

function xpForLevel(level){

    const l =
        Math.max(
            1,
            number(level)
        );

    return Math.round(
        100*Math.pow(
            l,
            1.42
        )
    );

}

function levelFromXP(xp){

    let level = 1;
    let safety = 0;

    while(
        xp >= xpForLevel(level+1) &&
        safety < 10000
    ){

        level++;
        safety++;

    }

    return level;

}

function updatePlayerLevel(){

    state.player.level =
        levelFromXP(
            state.player.xp
        );

}

function categoryLevel(category){

    return Math.max(
        1,
        number(
            state.categories[category].level
        )
    );

}

function updateCategoryLevel(category){

    const c =
        state.categories[category];

    c.level =
        levelFromXP(c.xp);

}

function addPlayerXP(amount){

    const value =
        Math.max(
            0,
            Math.round(
                number(amount)
            )
        );

    state.player.xp += value;

    updatePlayerLevel();

}

function addCategoryXP(
    category,
    amount
){

    if(
        !state.categories[category]
    ){

        return;

    }

    const value =
        Math.max(
            0,
            Math.round(
                number(amount)
            )
        );

    state.categories[category].xp +=
        value;

    updateCategoryLevel(
        category
    );

    addPlayerXP(
        Math.round(
            value*.65
        )
    );

    save();

}

function removeCategoryXP(
    category,
    amount
){

    if(
        !state.categories[category]
    ){

        return;

    }

    const value =
        Math.max(
            0,
            Math.round(
                number(amount)
            )
        );

    state.categories[category].xp =
        Math.max(
            0,
            state.categories[category].xp-value
        );

    updateCategoryLevel(
        category
    );

    state.player.xp =
        Math.max(
            0,
            state.player.xp -
            Math.round(value*.65)
        );

    updatePlayerLevel();

    save();

}

/* =====================================================
   FINANCE ECONOMY
===================================================== */

function financeIncomeXP(
    income
){

    const value =
        Math.max(
            0,
            number(income)
        );

    const level =
        categoryLevel("finance");

    if(value<=0){

        return 0;

    }

    const base =
        XP.financeBase;

    const scale =
        Math.pow(
            level,
            .72
        );

    return Math.max(
        1,
        Math.round(
            (value/50000)*
            base/
            scale
        )
    );

}

function financeSavingsXP(){

    const income =
        state.categories.finance.monthlyIncome;

    const total =
        getExpensesTotal();

    if(income<=0){

        return 0;

    }

    const savings =
        Math.max(
            0,
            income-total
        );

    const ratio =
        savings/income;

    return Math.round(
        clamp(
            ratio,
            0,
            1
        )*45
    );

}

function financeEfficiencyBonus(){

    const income =
        state.categories.finance.monthlyIncome;

    if(income<=0){

        return 0;

    }

    const ratio =
        getExpensesPercent();

    if(ratio<=30) return 25;
    if(ratio<=40) return 18;
    if(ratio<=50) return 12;
    if(ratio<=60) return 6;
    if(ratio<=80) return 2;

    return 0;

}

/* =====================================================
   TRAINING
===================================================== */

function trainingActionXP(){

    const level =
        categoryLevel("training");

    return Math.max(
        5,
        Math.round(
            XP.trainingBase/
            Math.pow(
                level,
                .58
            )
        )
    );

}

/* =====================================================
   DEVELOPMENT
===================================================== */

function developmentActionXP(){

    return XP.developmentAction;

}

/* =====================================================
   PROGRESS
===================================================== */

function metricProgress(
    current,
    target
){

    const c =
        number(current);

    const t =
        number(target);

    if(t<=0){

        return 0;

    }

    return clamp(
        Math.round(
            c/t*100
        ),
        0,
        100
    );

}

function financeProgress(){

    const c =
        state.categories.finance;

    const incomeP =
        metricProgress(
            c.monthlyIncome,
            c.monthlyGoal
        );

    const yearP =
        metricProgress(
            c.monthlyIncome*12,
            c.yearlyGoal
        );

    const savingsP =
        c.monthlyIncome>0
        ? clamp(
            Math.round(
                (
                    getSavings()/
                    Math.max(
                        c.monthlyIncome,
                        1
                    )
                )*100
            ),
            0,
            100
        )
        : 0;

    return Math.round(
        (
            incomeP+
            yearP+
            savingsP
        )/3
    );

}

function trainingProgress(){

    const c =
        state.categories.training;

    return metricProgress(
        c.workouts,
        c.monthlyTarget
    );

}

function developmentProgress(){

    const c =
        state.categories.development;

    const books =
        metricProgress(
            c.books,
            2
        );

    const language =
        metricProgress(
            c.languageMinutes,
            30
        );

    const meditation =
        metricProgress(
            c.meditationMinutes,
            15
        );

    return Math.round(
        (
            books+
            language+
            meditation
        )/3
    );

}

function disciplineProgress(){

    const c =
        state.categories.discipline;

    const total =
        c.completed+
        c.failed;

    if(total<=0){

        return 0;

    }

    return clamp(
        Math.round(
            c.completed/
            total*
            100
        ),
        0,
        100
    );

}

function healthProgress(){

    const c =
        state.categories.health;

    const routine =
        clamp(
            number(c.routine),
            0,
            100
        );

    const nutrition =
        clamp(
            number(c.nutrition),
            0,
            100
        );

    const steps =
        metricProgress(
            c.steps,
            10000
        );

    return Math.round(
        (
            routine+
            nutrition+
            steps
        )/3
    );

}

function categoryProgress(
    category
){

    switch(category){

        case "finance":
            return financeProgress();

        case "training":
            return trainingProgress();

        case "development":
            return developmentProgress();

        case "discipline":
            return disciplineProgress();

        case "health":
            return healthProgress();

        default:
            return 0;

    }

}

function totalProgress(){

    const values =
        Object.keys(
            CATEGORY_META
        ).map(
            category=>
                categoryProgress(category)
        );

    return Math.round(
        values.reduce(
            (a,b)=>a+b,
            0
        )/
        values.length
    );

}

/* =====================================================
   FINANCE EXPENSES
===================================================== */

function getIncome(){

    return number(
        state.categories.finance.monthlyIncome
    );

}

function getExpensesTotal(){

    return expenses.reduce(
        (total,e)=>
            total+
            number(e.amount),
        0
    );

}

function getExpensesPercent(){

    const income =
        getIncome();

    if(income<=0){

        return 0;

    }

    return Math.round(
        getExpensesTotal()/
        income*
        100
    );

}

function getSavings(){

    return Math.max(
        0,
        getIncome()-
        getExpensesTotal()
    );

}

/* =====================================================
   MONTHLY SIMULATOR
===================================================== */

function simulateMonth(
    profile
){

    let income =
        number(profile.income);

    const expenseRate =
        clamp(
            number(
                profile.expenseRate
            ),
            0,
            1
        );

    const growth =
        number(profile.growth);

    const history = [];

    for(
        let month=1;
        month<=120;
        month++
    ){

        let actualGrowth =
            growth;

        if(profile.alternating){

            actualGrowth =
                month%2===0
                ? number(profile.growthHigh)
                : number(profile.growthLow);

        }

        income =
            Math.max(
                0,
                income*
                (1+actualGrowth)
            );

        const expensesValue =
            income*
            expenseRate;

        const savings =
            Math.max(
                0,
                income-
                expensesValue
            );

        history.push({

            month,

            income:
                Math.round(income),

            expenses:
                Math.round(
                    expensesValue
                ),

            savings:
                Math.round(
                    savings
                )

        });

    }

    return history;

}

const SIMULATOR_PROFILES = {

    balanced:{
        name:"Balanced",
        income:50000,
        expenseRate:.35,
        growth:.15
    },

    highSpending:{
        name:"High Spending",
        income:100000,
        expenseRate:.90,
        growth:.05
    },

    aggressive:{
        name:"Aggressive Growth",
        income:200000,
        expenseRate:.80,
        growth:.25
    },

    volatile:{
        name:"Volatile",
        income:250000,
        expenseRate:1,
        growth:0,
        alternating:true,
        growthLow:-.10,
        growthHigh:.135
    },

    declining:{
        name:"Declining",
        income:200000,
        expenseRate:.5,
        growth:-.125
    },

    hyperGrowth:{
        name:"Hyper Growth",
        income:80000,
        expenseRate:.40,
        growth:.58
    }

};

/* =====================================================
   STREAKS
===================================================== */

function increaseStreak(
    category
){

    const c =
        state.categories[category];

    c.streak =
        number(c.streak)+1;

    c.bestStreak =
        Math.max(
            number(c.bestStreak),
            c.streak
        );

}

function breakStreak(
    category
){

    state.categories[category].streak =
        0;

}

function streakBonus(
    category
){

    const streak =
        number(
            state.categories[category].streak
        );

    return Math.min(
        1.5,
        1+
        (
            streak*
            XP.streakMultiplier
        )
    );

}

/* =====================================================
   HOME RENDER
===================================================== */

function renderHome(){

    updatePlayerLevel();

    document.getElementById(
        "playerLevel"
    ).textContent =
        "LVL "+
        state.player.level;

    document.getElementById(
        "playerXP"
    ).textContent =
        format(
            state.player.xp
        )+
        " XP";

    const currentLevelXP =
        xpForLevel(
            state.player.level
        );

    const nextLevelXP =
        xpForLevel(
            state.player.level+1
        );

    const progressXP =
        state.player.level===1
        ? state.player.xp
        : state.player.xp-
          currentLevelXP;

    const required =
        nextLevelXP-
        currentLevelXP;

    const xpPercent =
        required>0
        ? clamp(
            Math.round(
                progressXP/
                required*
                100
            ),
            0,
            100
        )
        : 0;

    document.getElementById(
        "playerXPFill"
    ).style.width =
        xpPercent+
        "%";

    document.getElementById(
        "xpNext"
    ).textContent =
        format(
            Math.max(
                0,
                nextLevelXP-
                state.player.xp
            )
        )+
        " XP TO NEXT LEVEL";

    document.getElementById(
        "playerRank"
    ).textContent =
        getRank(
            state.player.level
        );

    const total =
        totalProgress();

    document.getElementById(
        "lifeProgress"
    ).innerHTML =
        total+
        '<span>%</span>';

    document.getElementById(
        "lifeFill"
    ).style.width =
        total+
        "%";

    Object.keys(
        CATEGORY_META
    ).forEach(category=>{

        const value =
            categoryProgress(
                category
            );

        const percent =
            document.getElementById(
                category+
                "Percent"
            );

        const fill =
            document.getElementById(
                category+
                "Fill"
            );

        if(percent){

            percent.textContent =
                value+
                "%";

        }

        if(fill){

            fill.style.width =
                value+
                "%";

        }

    });

}

function getRank(level){

    if(level>=90)
        return "LEGEND";

    if(level>=75)
        return "ELITE";

    if(level>=60)
        return "MASTER";

    if(level>=45)
        return "VETERAN";

    if(level>=30)
        return "ADVANCED";

    if(level>=15)
        return "PLAYER";

    return "BEGINNER";

}

/* =====================================================
   NAVIGATION
===================================================== */

function setupNavigation(){

    document
        .querySelectorAll("[data-nav]")
        .forEach(button=>{

            button.addEventListener(
                "click",
                function(){

                    const section =
                        this.dataset.nav;

                    document
                        .querySelectorAll("[data-nav]")
                        .forEach(b=>{

                            b.classList.toggle(
                                "active",
                                b.dataset.nav===
                                section
                            );

                        });

                    if(section==="home"){

                        closePage();

                        renderHome();

                        return;

                    }

                    openCategory(
                        section
                    );

                }
            );

        });

    document
        .querySelectorAll(".category")
        .forEach(card=>{

            card.addEventListener(
                "click",
                ()=>{

                    const category =
                        card.dataset.category;

                    document
                        .querySelectorAll("[data-nav]")
                        .forEach(b=>{

                            b.classList.toggle(
                                "active",
                                b.dataset.nav===
                                category
                            );

                        });

                    openCategory(
                        category
                    );

                }
            );

        });

}

/* =====================================================
   CATEGORY PAGE
===================================================== */

function openCategory(
    category
){

    if(
        !CATEGORY_META[category]
    ){

        return;

    }

    closeModal();
    closePage();

    const page =
        document.createElement(
            "div"
        );

    page.className = "page";
    page.id = "activePage";

    page.innerHTML = `

        <div class="page-inner">

            <div class="page-head">

                <button
                    class="back"
                    type="button"
                >
                    ←
                </button>

                <div>

                    <div class="page-eyebrow">
                        LIFE GAME
                    </div>

                    <h2>
                        ${CATEGORY_META[category].icon}
                        ${CATEGORY_META[category].title}
                    </h2>

                </div>

            </div>

            ${renderCategory(category)}

        </div>
    `;

    document.body.appendChild(
        page
    );

    document.body.classList.add(
        "locked"
    );

    page
        .querySelector(".back")
        .addEventListener(
            "click",
            ()=>{

                closePage();

                setHomeNav();

                renderHome();

            }
        );

    bindPageEvents(
        page,
        category
    );

}

/* =====================================================
   CATEGORY RENDER
===================================================== */

function renderCategory(
    category
){

    if(category==="finance")
        return renderFinance();

    if(category==="training")
        return renderTraining();

    if(category==="development")
        return renderDevelopment();

    if(category==="discipline")
        return renderDiscipline();

    if(category==="health")
        return renderHealth();

    return "";

}

/* =====================================================
   FINANCE PAGE
===================================================== */

function renderFinance(){

    const c =
        state.categories.finance;

    const percent =
        financeProgress();

    const income =
        getIncome();

    const totalExpenses =
        getExpensesTotal();

    const expensePercent =
        getExpensesPercent();

    const savings =
        getSavings();

    return `

        <div class="summary">

            <div class="section-label">
                FINANCE LEVEL ${c.level}
            </div>

            <div class="summary-number">
                ${percent}%
            </div>

            <div class="progress">
                <i style="width:${percent}%"></i>
            </div>

            <div class="finance-box">

                <div class="finance-line">
                    <span>FINANCE XP</span>
                    <strong>
                        ${format(c.xp)} XP
                    </strong>
                </div>

                <div class="finance-line">
                    <span>STREAK</span>
                    <strong>
                        🔥 ${c.streak}
                    </strong>
                </div>

            </div>

        </div>

        <div class="cards">

            ${metricCard(
                "💵",
                "Заработано за месяц",
                format(income)+" ₽",
                format(c.monthlyGoal)+" ₽",
                metricProgress(
                    income,
                    c.monthlyGoal
                ),
                "monthlyIncome"
            )}

            ${metricCard(
                "🎯",
                "Цель на месяц",
                format(c.monthlyGoal)+" ₽",
                "Target",
                metricProgress(
                    income,
                    c.monthlyGoal
                ),
                "monthlyGoal"
            )}

            ${metricCard(
                "🏆",
                "Цель на год",
                format(income*12)+" ₽",
                format(c.yearlyGoal)+" ₽",
                metricProgress(
                    income*12,
                    c.yearlyGoal
                ),
                "yearlyGoal"
            )}

            <div class="metric">

                <div class="metric-head">

                    <div class="metric-left">

                        <div class="metric-icon">
                            📉
                        </div>

                        <div class="metric-text">

                            <strong>
                                Обязательные расходы
                            </strong>

                            <span>
                                ${format(totalExpenses)}
                                ₽ ·
                                ${expensePercent}%
                                от заработка
                            </span>

                        </div>

                    </div>

                    <div class="metric-percent">
                        ${expensePercent}%
                    </div>

                </div>

                <div class="metric-bar">
                    <i
                        style="
                            width:${Math.min(
                                expensePercent,
                                100
                            )}%
                        "
                    ></i>
                </div>

                <div class="expenses">

                    <div class="expenses-title">

                        <span>
                            МОИ ОБЯЗАТЕЛЬНЫЕ РАСХОДЫ
                        </span>

                        <strong>
                            ${format(
                                totalExpenses
                            )} ₽
                        </strong>

                    </div>

                    <div class="expense-list">

                        ${
                            expenses.length

                            ?

                            expenses
                                .map(
                                    expenseHTML
                                )
                                .join("")

                            :

                            `
                                <div class="notice">
                                    Добавь обязательные расходы:
                                    аренда, коммунальные услуги,
                                    продукты, транспорт, связь и т.д.
                                </div>
                            `
                        }

                    </div>

                    <button
                        class="add"
                        id="addExpense"
                    >
                        ＋ ДОБАВИТЬ РАСХОД
                    </button>

                    <div class="ratio">

                        <span>
                            РАСХОДЫ / ДОХОД
                        </span>

                        <strong>
                            ${expensePercent}%
                        </strong>

                    </div>

                    <div class="ratio">

                        <span>
                            СВОБОДНЫЕ ДЕНЬГИ
                        </span>

                        <strong>
                            ${format(savings)} ₽
                        </strong>

                    </div>

                </div>

            </div>

            ${metricCard(
                "🛡️",
                "Финансовая эффективность",
                expensePercent<=0
                    ? "—"
                    : (
                        100-
                        expensePercent
                    )+
                    "% свободного дохода",
                "100%",
                clamp(
                    100-
                    expensePercent,
                    0,
                    100
                ),
                null
            )}

            <div class="notice">

                💡 Расходы не дают XP.
                XP начисляется за заработок,
                достижение финансовых целей,
                сбережения и устойчивость.
                Поэтому рост расходов не позволяет
                искусственно прокачивать Finance.

            </div>

        </div>

    `;

/* =====================================================
   METRIC CARD
===================================================== */

function metricCard(
    icon,
    title,
    current,
    target,
    percent,
    id
){

    const button =
        id
        ?
        `
            <button
                class="edit"
                data-edit="${escapeHTML(id)}"
                type="button"
            >
                ✎ ИЗМЕНИТЬ
            </button>
        `
        :
        "";

    return `

        <div class="metric">

            <div class="metric-head">

                <div class="metric-left">

                    <div class="metric-icon">
                        ${icon}
                    </div>

                    <div class="metric-text">

                        <strong>
                            ${escapeHTML(title)}
                        </strong>

                        <span>
                            ${escapeHTML(current)}
                            /
                            ${escapeHTML(target)}
                        </span>

                    </div>

                </div>

                <div class="metric-percent">
                    ${percent}%
                </div>

            </div>

            <div class="metric-bar">

                <i
                    style="
                        width:${clamp(
                            percent,
                            0,
                            100
                        )}%
                    "
                ></i>

            </div>

            ${button}

        </div>

    `;

}

/* =====================================================
   PAGE EVENTS
===================================================== */

function bindPageEvents(
    page,
    category
){

    /*
     * All metric edit buttons.
     */
    page
        .querySelectorAll("[data-edit]")
        .forEach(button=>{

            button.addEventListener(
                "click",
                event=>{

                    event.preventDefault();
                    event.stopPropagation();

                    openMetricEditor(
                        category,
                        button.dataset.edit
                    );

                }
            );

        });

    /* FINANCE */

    if(category==="finance"){

        const add =
            page.querySelector(
                "#addExpense"
            );

        if(add){

            add.addEventListener(
                "click",
                ()=>{

                    openExpenseEditor();

                }
            );

        }

        page
            .querySelectorAll(
                ".expense-edit"
            )
            .forEach(button=>{

                button.addEventListener(
                    "click",
                    ()=>{

                        openExpenseEditor(
                            button.dataset.id
                        );

                    }
                );

            });

        page
            .querySelectorAll(
                ".expense-delete"
            )
            .forEach(button=>{

                button.addEventListener(
                    "click",
                    ()=>{

                        deleteExpense(
                            button.dataset.id
                        );

                    }
                );

            });

    }

    /* TRAINING */

    if(category==="training"){

        const button =
            page.querySelector(
                "#completeWorkout"
            );

        if(button){

            button.addEventListener(
                "click",
                ()=>{

                    const c =
                        state.categories.training;

                    const xp =
                        Math.round(
                            trainingActionXP()*
                            streakBonus(
                                "training"
                            )
                        );

                    c.workouts++;

                    increaseStreak(
                        "training"
                    );

                    addCategoryXP(
                        "training",
                        xp
                    );

                    showToast(
                        "Тренировка выполнена · +"+
                        xp+
                        " XP"
                    );

                    openCategory(
                        "training"
                    );

                    renderHome();

                }
            );

        }

    }

    /* DISCIPLINE */

    if(category==="discipline"){

        const complete =
            page.querySelector(
                "#disciplineComplete"
            );

        const fail =
            page.querySelector(
                "#disciplineFail"
            );

        if(complete){

            complete.addEventListener(
                "click",
                ()=>{

                    const c =
                        state.categories.discipline;

                    c.completed++;

                    increaseStreak(
                        "discipline"
                    );

                    const xp =
                        Math.round(
                            XP.disciplineAction*
                            streakBonus(
                                "discipline"
                            )
                        );

                    addCategoryXP(
                        "discipline",
                        xp
                    );

                    showToast(
                        "Дисциплина +"+
                        xp+
                        " XP"
                    );

                    openCategory(
                        "discipline"
                    );

                    renderHome();

                }
            );

        }

        if(fail){

            fail.addEventListener(
                "click",
                ()=>{

                    const c =
                        state.categories.discipline;

                    c.failed++;

                    breakStreak(
                        "discipline"
                    );

                    const penalty =
                        Math.round(
                            XP.disciplineAction*
                            XP.penaltyMultiplier
                        );

                    removeCategoryXP(
                        "discipline",
                        penalty
                    );

                    showToast(
                        "Штраф −"+
                        penalty+
                        " XP"
                    );

                    openCategory(
                        "discipline"
                    );

                    renderHome();

                }
            );

        }

    }

}

/* =====================================================
   METRIC EDITOR
===================================================== */

function openMetricEditor(
    category,
    id
){

    const item =
        state.categories[category];

    /*
     * IMPORTANT FIX:
     *
     * Finance uses "monthlyIncome",
     * not "income".
     *
     * This check now allows the correct
     * field to open in the editor.
     */
    if(
        !item ||
        item[id]===undefined
    ){

        console.warn(
            "LIFE GAME: metric not found",
            category,
            id
        );

        return;

    }

    const labels = {

        monthlyIncome:
            "Заработано за месяц",

        monthlyGoal:
            "Цель на месяц",

        yearlyGoal:
            "Цель на год",

        workouts:
            "Количество тренировок",

        books:
            "Книги",

        languageMinutes:
            "Минуты изучения языка",

        meditationMinutes:
            "Минуты медитации",

        routine:
            "Режим дня %",

        nutrition:
            "Питание %",

        steps:
            "Шаги"

    };

    const title =
        labels[id] ||
        id;

    const currentValue =
        number(
            item[id]
        );

    openModal(`

        <div class="modal-icon">
            ${CATEGORY_META[category].icon}
        </div>

        <div class="modal-label">
            EDIT VALUE
        </div>

        <h3>
            ${escapeHTML(title)}
        </h3>

        <label for="metricValue">
            Текущее значение
        </label>

        <input
            id="metricValue"
            type="number"
            inputmode="decimal"
            min="0"
            step="1"
            autocomplete="off"
            value="${currentValue}"
        >

        <div class="modal-preview">

            <span>
                Текущее значение
            </span>

            <strong id="metricPreview">
                ${format(currentValue)}
            </strong>

        </div>

        <button
            class="primary"
            id="saveMetric"
            type="button"
        >
            СОХРАНИТЬ
        </button>

    `);

    const overlay =
        document.querySelector(
            ".overlay"
        );

    if(!overlay){

        return;

    }

    const input =
        overlay.querySelector(
            "#metricValue"
        );

    const preview =
        overlay.querySelector(
            "#metricPreview"
        );

    /*
     * Live preview while typing.
     */
    if(input && preview){

        input.addEventListener(
            "input",
            ()=>{

                preview.textContent =
                    format(
                        Math.max(
                            0,
                            number(
                                input.value
                            )
                        )
                    );

            }
        );

    }

    /*
     * Focus input automatically.
     */
    setTimeout(()=>{

        if(input){

            input.focus();

            try{

                input.select();

            }catch(error){}

        }

    },50);

    const saveButton =
        overlay.querySelector(
            "#saveMetric"
        );

    if(saveButton){

        saveButton.addEventListener(
            "click",
            ()=>{

                const value =
                    Math.max(
                        0,
                        number(
                            input
                                ? input.value
                                : 0
                        )
                    );

                /*
                 * Save directly to the real
                 * state property.
                 */
                item[id] =
                    value;

                /*
                 * Explicit finance synchronization.
                 *
                 * This is intentionally kept even
                 * though monthlyIncome is already
                 * the correct property. It makes
                 * the data flow unambiguous.
                 */
                if(
                    category==="finance" &&
                    id==="monthlyIncome"
                ){

                    state.categories.finance.monthlyIncome =
                        value;

                }

                /*
                 * Keep level data valid.
                 */
                updateCategoryLevel(
                    category
                );

                updatePlayerLevel();

                save();

                closeModal();

                renderHome();

                /*
                 * If the category page is open,
                 * recreate it with fresh data.
                 */
                if(
                    document.getElementById(
                        "activePage"
                    )
                ){

                    openCategory(
                        category
                    );

                }

                showToast(
                    "Изменения сохранены"
                );

            }
        );

    }

}

/* =====================================================
   EXPENSE EDITOR
===================================================== */

function openExpenseEditor(
    id=null
){

    const existing =
        expenses.find(
            e=>
                String(e.id)===
                String(id)
        );

    openModal(`

        <div class="modal-icon">
            📉
        </div>

        <div class="modal-label">
            ${
                existing
                ? "EDIT EXPENSE"
                : "NEW EXPENSE"
            }
        </div>

        <h3>
            ${
                existing
                ? "Изменить расход"
                : "Добавить расход"
            }
        </h3>

        <label for="expenseName">
            Название
        </label>

        <input
            id="expenseName"
            type="text"
            maxlength="60"
            placeholder="Например: Аренда"
            autocomplete="off"
            value="${
                existing
                ? escapeHTML(
                    existing.name
                )
                : ""
            }"
        >

        <label for="expenseAmount">
            Сумма
        </label>

        <input
            id="expenseAmount"
            type="number"
            inputmode="decimal"
            min="0"
            step="1"
            placeholder="0"
            autocomplete="off"
            value="${
                existing
                ? number(
                    existing.amount
                )
                : ""
            }"
        >

        <button
            class="primary"
            id="saveExpense"
            type="button"
        >
            СОХРАНИТЬ
        </button>

    `);

    const overlay =
        document.querySelector(
            ".overlay"
        );

    if(!overlay){

        return;

    }

    const nameInput =
        overlay.querySelector(
            "#expenseName"
        );

    if(nameInput){

        setTimeout(()=>{

            nameInput.focus();

        },50);

    }

    const saveButton =
        overlay.querySelector(
            "#saveExpense"
        );

    if(saveButton){

        saveButton.addEventListener(
            "click",
            ()=>{

                const name =
                    nameInput
                        ? nameInput.value.trim()
                        : "";

                const amountInput =
                    overlay.querySelector(
                        "#expenseAmount"
                    );

                const amount =
                    Math.max(
                        0,
                        number(
                            amountInput
                                ? amountInput.value
                                : 0
                        )
                    );

                if(!name){

                    showToast(
                        "Введите название расхода"
                    );

                    if(nameInput){

                        nameInput.focus();

                    }

                    return;

                }

                if(amount<=0){

                    showToast(
                        "Введите сумму расхода"
                    );

                    if(amountInput){

                        amountInput.focus();

                    }

                    return;

                }

                if(existing){

                    existing.name =
                        name;

                    existing.amount =
                        amount;

                }else{

                    expenses.push({

                        id:
                            Date.now()
                            .toString(),

                        name,

                        amount

                    });

                }

                save();

                closeModal();

                renderHome();

                openCategory(
                    "finance"
                );

                showToast(
                    "Расход сохранён"
                );

            }
        );

    }

}

/* =====================================================
   DELETE EXPENSE
===================================================== */

function deleteExpense(
    id
){

    const expense =
        expenses.find(
            e=>
                String(e.id)===
                String(id)
        );

    if(!expense){

        return;

    }

    expenses =
        expenses.filter(
            e=>
                String(e.id)!==
                String(id)
        );

    save();

    renderHome();

    openCategory(
        "finance"
    );

    showToast(
        "Расход удалён"
    );

}

/* =====================================================
   QUEST SYSTEM
===================================================== */

function openQuestPage(){

    closeModal();
    closePage();

    const page =
        document.createElement(
            "div"
        );

    page.className =
        "page";

    page.id =
        "activePage";

    const quests =
        state.quests;

    page.innerHTML = `

        <div class="page-inner">

            <div class="page-head">

                <button
                    class="back"
                    type="button"
                >
                    ←
                </button>

                <div>

                    <div class="page-eyebrow">
                        LIFE GAME
                    </div>

                    <h2>
                        ⚡ Daily Quest
                    </h2>

                </div>

            </div>

            <div class="quest-card">

                <div class="section-label">
                    TODAY'S QUESTS
                </div>

                <div style="margin-top:12px">

                    ${
                        quests.map(
                            (q,index)=>`

                                <div
                                    class="quest-item"
                                >

                                    <div
                                        class="quest-row"
                                    >

                                        <div
                                            class="quest-title"
                                        >
                                            ${escapeHTML(
                                                q.title
                                            )}
                                        </div>

                                        <div
                                            class="quest-xp"

                                            +${q.xp} XP
                                        </div>

                                    </div>

                                    <button

                                                : ""
                                            }

                                    >
                                        ${
                                            q.done
                                            ? "✓ ВЫПОЛНЕНО"
                                            : "ВЫПОЛНИТЬ"
                                        }
                                    </button>

                                </div>

                            `
                        ).join("")
                    }

                </div>

            </div>

            <div class="notice">

                Квесты могут быть сгенерированы
                системой автоматически. В дальнейшем
                генерация будет учитывать уровень
                игрока, цели, streak, историю действий
                и экономику LIFE GAME.

            </div>

        </div>

    `;

    document.body.appendChild(
        page
    );

    document.body.classList.add(

    );

    page
        .querySelector(".back")
        .addEventListener(
            "click",
            ()=>{

                closePage();

                setHomeNav();

                renderHome();

            }
        );

    page
        .querySelectorAll(
            "[data-quest]"
        )
        .forEach(button=>{

            button.addEventListener(
                "click",
                ()=>{

                    const index =
                        number(
                            button.dataset.quest
                        );

                    completeQuest(
                        index
                    );

                }
            );

        });

}

/* =====================================================
   COMPLETE QUEST
===================================================== */

function completeQuest(
    index
){

    const quest =
        state.quests[index];

    if(
        !quest ||
        quest.done
    ){

        return;

    }

    quest.done =
        true;

    const category =
        quest.category;

    increaseStreak(
        category
    );

    const bonus =
        Math.round(
            quest.xp*
            streakBonus(
                category
            )
        );

    addCategoryXP(
        category,
        bonus
    );

    state.player.rating +=
        1;

    save();

    showToast(
        "Quest выполнен · +"+
        bonus+
        " XP"
    );

    openQuestPage();

    renderHome();

}

/* =====================================================
   MODAL
===================================================== */

function openModal(
    content
){

    closeModal();

    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "overlay";

    overlay.innerHTML = `

        <div class="modal">

            <button
                class="close"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>

            ${content}

        </div>

    `;

    document.body.appendChild(
        overlay
    );

    document.body.classList.add(
        "locked"
    );

    overlay
        .querySelector(".close")
        .addEventListener(
            "click",
            closeModal
        );

    overlay.addEventListener(
        "click",
        event=>{

            if(
                event.target===
                overlay
            ){

                closeModal();

            }

        }
    );

}

/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    const overlay =
        document.querySelector(
            ".overlay"
        );

    if(overlay){

        overlay.remove();

    }

    if(
        !document.getElementById(
            "activePage"
        )
    ){

        document.body.classList.remove(
            "locked"
        );

    }

}

/* =====================================================
   CLOSE PAGE
===================================================== */

function closePage(){

    const page =
        document.getElementById(
            "activePage"
        );

    if(page){

        page.remove();

    }

    if(
        !document.querySelector(
            ".overlay"
        )
    ){

        document.body.classList.remove(
            "locked"
        );

    }

}

/* =====================================================
   HOME NAV
===================================================== */

function setHomeNav(){

    document
        .querySelectorAll(
            "[data-nav]"
        )
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.nav===
                "home"
            );

        });

}

/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function showToast(
    message
){

    let toast =
        document.querySelector(
            ".toast"
        );

    if(toast){

        toast.remove();

    }

    toast =
        document.createElement(
            "div"
        );

    toast.className =
        "toast";

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );

    requestAnimationFrame(
        ()=>{

            toast.classList.add(
                "show"
            );

        }
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

                setTimeout(
                    ()=>{

                        if(
                            toast &&
                            toast.parentNode
                        ){

                            toast.remove();

                        }

                    },
                    220
                );

            },
            1800
        );

}

/* =====================================================
   DAILY QUEST BUTTON
===================================================== */

document
    .getElementById(
        "dailyQuest"
    )
    .addEventListener(
        "click",
        openQuestPage
    );

/* =====================================================
   INITIALIZATION
===================================================== */

function initialize(){

    /*
     * Make sure the correct finance field
     * always exists and is numeric.
     */
    state.categories.finance.monthlyIncome =
        Math.max(
            0,
            number(
                state.categories.finance.monthlyIncome
            )
        );

    /*
     * Recalculate category levels.
     */
    Object.keys(
        CATEGORY_META
    ).forEach(
        updateCategoryLevel
    );

    /*
     * Recalculate player level.
     */
    updatePlayerLevel();

    /*
     * Save normalized state.
     */
    save();

    /*
     * Setup UI.
     */
    setupNavigation();

    renderHome();

}

initialize();

})();
</script>
